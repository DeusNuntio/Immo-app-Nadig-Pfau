// QR als Data-URL (SVG). Synchron, immer offline verfügbar.
function qrDataUrl(text, size=300){
  const svg=QRENC.svg(text, size);
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}

/* ── Etikett als PDF (30×50 mm, Inhalt 90° gedreht) ──────────
   Rendert QR + Text auf ein Canvas (quer), dreht es 90°, bettet es
   als JPEG in ein einseitiges PDF ein. Dateiname = Nummer.
*/
// QR als PNG/Bild-Element laden (für Canvas)
function qrImage(text, px){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=qrDataUrl(text, px||300);
  });
}

// Etikett auf Canvas zeichnen: hochkant, QR oben, Text darunter (30×50 mm)
async function renderEtikettCanvas(qrText, zeile1, zeile2, zeile3){
  const dpi=300, mmPx=dpi/25.4;
  const wPx=Math.round(30*mmPx), hPx=Math.round(50*mmPx); // 354 x 591 hochkant
  const cv=document.createElement('canvas');
  cv.width=wPx; cv.height=hPx;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,wPx,hPx);
  // QR oben, zentriert
  const pad=Math.round(2*mmPx);
  const qrSize=wPx-2*pad;
  const qrImg=await qrImage(qrText, 360);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(qrImg, pad, pad, qrSize, qrSize);
  // Text darunter, zentriert
  let y=pad+qrSize+Math.round(2.5*mmPx);
  ctx.textAlign='center'; ctx.textBaseline='top';
  const cx=wPx/2, tw=wPx-2*pad;
  function line(txt, size, color, bold){
    if(!txt) return;
    ctx.fillStyle=color||'#0C447C';
    ctx.font=(bold?'bold ':'')+size+'px Arial, sans-serif';
    const words=String(txt).split(' '); let cur=''; const lines=[];
    for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>tw && cur){ lines.push(cur); cur=w; } else cur=t; }
    if(cur) lines.push(cur);
    for(const ln of lines){ ctx.fillText(ln, cx, y); y+=Math.round(size*1.25); }
  }
  line(zeile1, 40, '#0C447C', true);
  y+=Math.round(1.5*mmPx);
  line(zeile2, 30, '#555', false);
  line(zeile3, 24, '#888', false);
  return { dataUrl: cv.toDataURL('image/jpeg', 0.92), w:wPx, h:hPx };
}

// Einseitiges PDF mit bildschirmfüllendem JPEG bauen
function buildLabelPdf(jpegB64, imgW, imgH, pageWmm, pageHmm){
  function mm2pt(mm){ return mm*72/25.4; }
  const W=mm2pt(pageWmm), H=mm2pt(pageHmm);
  const bin=atob(jpegB64);
  const header='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  let body=''; const offset={};
  function emit(n,s){ offset[n]=header.length+body.length; body+=`${n} 0 obj\n${s}\nendobj\n`; }
  emit(1,'<< /Type /Catalog /Pages 2 0 R >>');
  emit(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  emit(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offset[4]=header.length+body.length;
  body+=`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n`+bin+`\nendstream\nendobj\n`;
  const content=`q\n${W.toFixed(2)} 0 0 ${H.toFixed(2)} 0 0 cm\n/Im0 Do\nQ\n`;
  emit(5,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xrefStart=header.length+body.length;
  let xref='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) xref+=String(offset[i]).padStart(10,'0')+' 00000 n \n';
  const trailer=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return header+body+xref+trailer;
}

// PDF erzeugen und speichern. Standard: direkter Download (landet im Download-Ordner).
async function etikettPdfSpeichern(qrText, dateiname, zeile1, zeile2, zeile3){
  const lab=await renderEtikettCanvas(qrText, zeile1, zeile2, zeile3);
  const jpegB64=lab.dataUrl.split(',')[1];
  const pdfStr=buildLabelPdf(jpegB64, lab.w, lab.h, 30, 50);
  const bytes=new Uint8Array(pdfStr.length);
  for(let i=0;i<pdfStr.length;i++) bytes[i]=pdfStr.charCodeAt(i)&0xff;
  const blob=new Blob([bytes], {type:'application/pdf'});
  // Direkter Download → Datei landet im Download-Ordner mit der Nummer als Name
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=dateiname+'.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  toast('PDF gespeichert: '+dateiname+'.pdf');
}

// Alternativ: Etikett über Teilen-Dialog (für Cloud/Drucker-Apps)
async function etikettPdfTeilen(qrText, dateiname, zeile1, zeile2, zeile3){
  const lab=await renderEtikettCanvas(qrText, zeile1, zeile2, zeile3);
  const jpegB64=lab.dataUrl.split(',')[1];
  const pdfStr=buildLabelPdf(jpegB64, lab.w, lab.h, 30, 50);
  const bytes=new Uint8Array(pdfStr.length);
  for(let i=0;i<pdfStr.length;i++) bytes[i]=pdfStr.charCodeAt(i)&0xff;
  const blob=new Blob([bytes], {type:'application/pdf'});
  const file=new File([blob], dateiname+'.pdf', {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:dateiname}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  // Fallback Download
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=dateiname+'.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}

async function ensureTaetigkeitKat(){

  for(const k of TAETIGKEIT_STANDARD){ await idbPut('taetigkeit_kat', {...k, erstellt:now()}); }

async function getTaetigkeitKat(nurSichtbar){
  const alle=(await idbGetAll('taetigkeit_kat')).sort((a,b)=>(a.sort||99)-(b.sort||99));
  return nurSichtbar ? alle.filter(k=>k.sichtbar!==false) : alle;
}

/* ── Zeiterfassung – Seite ── */

  const el=document.getElementById('page-zeit');

  const istAdmin = CU?.role==='admin';
  let h=`<div class="s-hdr"><div class="s-title"><i class="ti ti-clock"></i> Zeiterfassung</div>
    ${istAdmin?`<button class="btn btn-sm" onclick="modalTaetigkeitQR()"><i class="ti ti-qrcode"></i> QR</button>`:'<span></span>'}
  </div>`;

  // ── Stempeluhr (alle Rollen, die erfassen) ──
  const s=await getOffeneSitzung();
  // Vergessen-Sicherung: offene Sitzung von früherem Tag?
  if(s && s.datum!==today()){
    h+=`<div class="card" style="border-left:3px solid var(--amber);background:var(--amber-l);margin-bottom:12px">
      <div style="font-size:13px;font-weight:600;color:var(--amber);margin-bottom:4px"><i class="ti ti-alert-triangle"></i> Offene Sitzung vom ${s.datum}</div>

      <button class="btn btn-sm btn-copper" onclick="modalSitzungNachtragen('${s.id}')"><i class="ti ti-pencil"></i> Endzeit nachtragen</button>
    </div>`;
  }
  const istPause = s && pauseAktiv(s);
  const seg = s && offenesSegment(s);

  if(!s){
    h+=`<div class="card" style="text-align:center;padding:20px 14px;margin-bottom:14px">
      <div style="font-size:13px;color:var(--ink-40);margin-bottom:12px">Nicht eingestempelt</div>
      <button class="btn btn-copper" style="font-size:16px;padding:14px 28px" onclick="einstempeln()"><i class="ti ti-player-play"></i> Einstempeln</button>
    </div>`;
  } else {
    const min=sitzungMinuten(s);
    h+=`<div class="card" style="margin-bottom:14px;${istPause?'border-left:3px solid var(--amber)':'border-left:3px solid var(--green)'}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:12px;color:var(--ink-40)">seit ${fmtUhr(s.start)} ${istPause?'· <span style="color:var(--amber)">Pause</span>':''}</div>
        <div style="font-size:12px;color:var(--ink-40)">${s.datum}</div>
      </div>
      <div style="font-size:30px;font-weight:700;text-align:center;margin:6px 0">${fmtDauer(min)}</div>`;
    // laufende Tätigkeit
    if(seg && !istPause){
      const tmin=Math.max(0,Math.round((new Date()-new Date(seg.start))/60000));
      h+=`<div style="background:var(--copper-bg);border-radius:8px;padding:8px 12px;margin-bottom:8px;text-align:center">
        <div style="font-size:13px;font-weight:600;color:var(--copper-d)">${seg.katName} läuft</div>
        <div style="font-size:11px;color:var(--ink-40)">${getObj(seg.objId)?.name||''} · ${fmtDauer(tmin)}</div>
      </div>
      <button class="btn btn-full" style="margin-bottom:6px" onclick="taetigkeitBeenden()"><i class="ti ti-player-stop"></i> Tätigkeit beenden</button>`;
    } else if(!istPause){
      h+=`<button class="btn btn-copper btn-full" style="margin-bottom:6px" onclick="modalTaetigkeitStart()"><i class="ti ti-player-play"></i> Tätigkeit starten</button>`;
    }
    // Pause / Ausstempeln
    h+=`<div style="display:flex;gap:6px">
      <button class="btn" style="flex:1" onclick="pauseUmschalten()"><i class="ti ti-coffee"></i> ${istPause?'Pause beenden':'Pause'}</button>
      <button class="btn btn-danger" style="flex:1" onclick="ausstempeln()"><i class="ti ti-player-stop"></i> Ausstempeln</button>
    </div></div>`;
    // Zeitleiste der heutigen Sitzung
    h+=renderZeitleiste(s);
  }

  // Heutige bereits beendete Sitzungen
  const heute=(await idbGetAll('arbeitszeit','userId',CU?.id).catch(()=>[]))
    .filter(x=>x.datum===today() && x.status==='beendet')
    .sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(heute.length){
    h+=`<div class="card-hdr" style="margin:14px 0 6px">Heute abgeschlossen</div>`;
    for(const x of heute){ h+=zeitSitzungCard(x); }
  }

  if(istAdmin){
    h+=`<div class="card-hdr" style="margin:16px 0 6px">Verwaltung</div>
      <button class="btn btn-full" style="margin-bottom:6px" onclick="modalTaetigkeitQR()"><i class="ti ti-qrcode"></i> Tätigkeits-QR drucken</button>
      <div style="font-size:12px;color:var(--ink-40);margin-top:8px">Mitarbeiter-Übersicht und Auswertung folgen im nächsten Schritt.</div>`;
  }

  el.innerHTML=h;
}

function fmtUhr(iso){ if(!iso)return''; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

// Zeitleiste mit Tätigkeiten + automatischen Lücken (Wegezeit/Sonstiges)
function renderZeitleiste(s){
  const segs=(s.segmente||[]).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(!segs.length) return '';
  let h=`<div class="card-hdr" style="margin:12px 0 6px">Verlauf</div><div style="margin-bottom:6px">`;
  let prevEnd=s.start;
  for(const seg of segs){
    // Lücke vor diesem Segment?
    if(seg.start>prevEnd){
      const luecke=Math.round((new Date(seg.start)-new Date(prevEnd))/60000);
      if(luecke>=1) h+=zeitLueckeRow(prevEnd, seg.start, luecke);
    }
    const dur = seg.ende ? Math.round((new Date(seg.ende)-new Date(seg.start))/60000) : Math.round((new Date()-new Date(seg.start))/60000);
    const u=seg.umlage;
    h+=`<div class="card" style="margin-bottom:5px;padding:8px 10px" onclick="modalSegmentBearbeiten('${s.id}','${seg.id}')">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-weight:600;font-size:13px">${seg.katName}${seg.ende?'':' <span style="color:var(--copper);font-size:11px">läuft</span>'}</div>
          <div style="font-size:11px;color:var(--ink-40)">${fmtUhr(seg.start)}${seg.ende?'–'+fmtUhr(seg.ende):''} · ${getObj(seg.objId)?.name||'kein Objekt'}</div>
          ${seg.notiz?`<div style="font-size:11px;color:var(--ink-60);margin-top:2px">${seg.notiz}</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-weight:600;font-size:13px">${fmtDauer(dur)}</div>
          <span class="chip" style="font-size:9px;background:${u==='ja'?'#E8F5E9':(u==='nein'?'#FDECEA':'#F0F0F0')};color:${u==='ja'?'#2E7D52':(u==='nein'?'#C0392B':'#888')}">${umlageLabel(u)}</span>
        </div>
      </div>
    </div>`;
    prevEnd = seg.ende || prevEnd;
  }
  h+=`</div>`;
  return h;
}
function zeitLueckeRow(von, bis, min){
  return `<div style="display:flex;align-items:center;gap:8px;padding:4px 10px;margin-bottom:5px;font-size:11px;color:var(--ink-40);background:var(--ink-05);border-radius:6px">
    <i class="ti ti-arrow-right" style="font-size:12px"></i> Wegezeit / Sonstiges · ${fmtUhr(von)}–${fmtUhr(bis)} · ${fmtDauer(min)}
  </div>`;
}
function zeitSitzungCard(x){
  const min=sitzungMinuten(x);
  const anzT=(x.segmente||[]).length;
  return `<div class="card" style="margin-bottom:6px" onclick="modalSitzungDetail('${x.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-weight:600;font-size:13px">${fmtUhr(x.start)}–${fmtUhr(x.ende)}</div>
      <div style="font-size:11px;color:var(--ink-40)">${anzT} Tätigkeit${anzT===1?'':'en'}</div></div>
      <div style="font-weight:600">${fmtDauer(min)}</div>
    </div></div>`;
}

/* ══════════════════════════════════════════════════════════
   STEMPELUHR – Arbeitszeiterfassung für Hausmeister
   Eine Sitzung pro Stempel-Zyklus mit Tätigkeits-Segmenten.
   Lücken zwischen Tätigkeiten werden als Wegezeit/Sonstiges erfasst.
══════════════════════════════════════════════════════════ */

// offene (laufende) Sitzung des aktuellen Users finden
async function getOffeneSitzung(){
  const alle=await idbGetAll('arbeitszeit','userId',CU?.id).catch(()=>[]);
  return (alle||[]).find(s=>s.status==='offen')||null;
}
// laufendes (offenes) Segment in einer Sitzung
function offenesSegment(s){ return (s?.segmente||[]).find(seg=>!seg.ende)||null; }
// ist gerade Pause aktiv?
function pauseAktiv(s){ const p=(s?.pausen||[]).find(x=>!x.bis); return !!p; }

// Netto-Dauer einer Sitzung in Minuten (ohne Pausen)
function sitzungMinuten(s, bis){
  if(!s?.start) return 0;
  const ende = s.ende || bis || nowIso();
  let ms = new Date(ende)-new Date(s.start);
  for(const p of (s.pausen||[])){
    const pb = p.bis || bis || nowIso();
    if(p.von) ms -= (new Date(pb)-new Date(p.von));
  }
  return Math.max(0, Math.round(ms/60000));
}
function fmtDauer(min){
  const h=Math.floor(min/60), m=min%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')} Std.` : `${m} Min.`;
}
function nowIso(){ return new Date().toISOString(); }

// ── Einstempeln ──
async function einstempeln(){
  const offen=await getOffeneSitzung();
  if(offen){ toast('Du bist bereits eingestempelt'); renderZeiterfassung(); return; }
  const s={
    id:uid(), userId:CU.id, userName:CU.name,
    datum: today(),
    start: nowIso(), ende:null,
    pausen:[], segmente:[],
    status:'offen',
    erstellt:nowIso(), geaendert:nowIso(),
  };
  await idbPut('arbeitszeit', s);
  syncSoon();
  toast('Eingestempelt ✓');
  renderZeiterfassung();
}

// ── Pause an/aus ──
async function pauseUmschalten(){
  const s=await getOffeneSitzung();
  if(!s){ toast('Nicht eingestempelt'); return; }
  const p=(s.pausen||[]).find(x=>!x.bis);
  if(p){
    p.bis=nowIso();                 // Pause beenden
    toast('Pause beendet');
  } else {
    // laufende Tätigkeit beenden (Pause ist keine Tätigkeit)
    const seg=offenesSegment(s);
    if(seg){ seg.ende=nowIso(); }
    s.pausen=s.pausen||[];
    s.pausen.push({von:nowIso(), bis:null});
    toast('Pause gestartet');
  }
  s.geaendert=nowIso();
  await idbPut('arbeitszeit', s);
  syncSoon();
  renderZeiterfassung();
}

// ── Ausstempeln ──
async function ausstempeln(){
  const s=await getOffeneSitzung();
  if(!s){ toast('Nicht eingestempelt'); return; }
  // offene Tätigkeit und offene Pause schließen
  const seg=offenesSegment(s); if(seg) seg.ende=nowIso();
  const p=(s.pausen||[]).find(x=>!x.bis); if(p) p.bis=nowIso();
  s.ende=nowIso(); s.status='beendet'; s.geaendert=nowIso();
  await idbPut('arbeitszeit', s);
  syncSoon();
  toast('Ausgestempelt ✓');
  renderZeiterfassung();
}

// ── Tätigkeit starten ──
// Schließt automatisch ein laufendes Segment und fügt davor ggf. eine Lücke (Wegezeit/Sonstiges) ein.
async function taetigkeitStarten(katId, objId, notiz, mangelId){
  const s=await getOffeneSitzung();
  if(!s){ toast('Bitte zuerst einstempeln'); return; }
  if(pauseAktiv(s)){ toast('Erst Pause beenden'); return; }
  const kats=await getTaetigkeitKat();
  const kat=kats.find(k=>k.id===katId);
  // laufendes Segment beenden
  const vorher=offenesSegment(s);
  if(vorher) vorher.ende=nowIso();
  // Lücke seit letztem Segmentende bzw. seit Sitzungsstart als automatische Wegezeit/Sonstiges
  const segs=s.segmente||[];
  const letzterEnd = segs.length ? segs[segs.length-1].ende : s.start;
  // (Die Lücke wird beim Rendern/Auswerten rechnerisch als Wegezeit dargestellt – wir speichern sie nicht als eigenes Segment,
  //  sondern markieren Tätigkeits-Segmente; Lücken ergeben sich aus den Zwischenräumen.)
  segs.push({
    id:uid(), katId, objId:objId||null,
    katName: kat?.name||katId, umlage: kat?.umlage||'neutral',
    start: nowIso(), ende:null,
    notiz: notiz||'', fotos:[], mangelId: mangelId||null,
  });
  s.segmente=segs; s.geaendert=nowIso();
  await idbPut('arbeitszeit', s);
  syncSoon();
  toast((kat?.name||'Tätigkeit')+' gestartet');
  renderZeiterfassung();
}

// ── Tätigkeit beenden ──
async function taetigkeitBeenden(){
  const s=await getOffeneSitzung();
  if(!s) return;
  const seg=offenesSegment(s);
  if(!seg){ toast('Keine laufende Tätigkeit'); return; }
  seg.ende=nowIso(); s.geaendert=nowIso();
  await idbPut('arbeitszeit', s);
  syncSoon();
  toast('Tätigkeit beendet');
  renderZeiterfassung();
}

  const standortGefiltert=alle.filter(a=>_lagerStandort==='alle'||a.standort===_lagerStandort);
  h+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">`;
  for(const kat of LAGER_KATEGORIEN){
    const cnt=standortGefiltert.filter(a=>a.kategorie===kat.id).length;
    const warnCnt=standortGefiltert.filter(a=>a.kategorie===kat.id&&istLagerWarnung(a)).length;
    h+=`<div class="card" style="cursor:pointer;padding:14px" onclick="zeigeLagerKategorie('${kat.id}')">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div style="width:38px;height:38px;border-radius:9px;background:${kat.color}1a;display:flex;align-items:center;justify-content:center;font-size:19px;color:${kat.color}">

    </div>`;
  }
  h+=`</div>`;

  // Globale Suche im Lager + Barcode-Scan (L4)
  h+=`<div style="margin-top:14px">
    <div style="display:flex;gap:8px">

  el.innerHTML=h;
}

// Warn-Logik (L3): Nachbestell-Bedarf erkennen.
// - Mengenstufen-Artikel: Stufe "wenig" gilt als Nachbestell-Signal.
// - Zahl-Artikel: Bestand <= Mindestbestand (falls gesetzt) bzw. Bestand <= 0.
// - Pro Artikel über warnungAus deaktivierbar.
function istLagerWarnung(a){
  if(!a || a.warnungAus) return false;
  if(a.mengenstufe){
    return a.mengenstufe==='wenig';
  }
  const best=parseFloat(a.bestand);
  const minb=parseFloat(a.mindestbestand);
  if(isNaN(best)) return false;
  if(!isNaN(minb)&&minb>0) return best<=minb;
  return best<=0;
}

function setLagerStandort(id){ _lagerStandort=id; renderLager(); }

// ── L2: Kategorie-Artikelliste, gruppiert nach Unterkategorie ──
async function zeigeLagerKategorie(katId){
  _lagerKat=katId;
  const kat=getLagerKat(katId);
  const el=document.getElementById('page-lager');
  if(!el) return;
  const alle=await getLagerArtikel('kategorie',katId);
  const gefiltert=alle.filter(a=>_lagerStandort==='alle'||a.standort===_lagerStandort)
    .sort((a,b)=>(a.bezeichnung||'').localeCompare(b.bezeichnung||''));

  let h=`<div class="s-hdr">
    <button class="btn btn-sm" onclick="renderLager()"><i class="ti ti-arrow-left"></i></button>
    <div class="s-title" style="display:flex;align-items:center;gap:8px"><i class="ti ${kat.icon}" style="color:${kat.color}"></i> ${kat.label}</div>
    <button class="btn btn-sm btn-copper" onclick="modalLagerArtikel(null,'${katId}')"><i class="ti ti-plus"></i> Artikel</button>
  </div>
  <div style="font-size:12px;color:var(--ink-40);margin-bottom:10px">${gefiltert.length} Artikel${_lagerStandort!=='alle'?` · ${getLagerStandort(_lagerStandort).label}`:''}</div>`;

  if(!gefiltert.length){
    h+=`<div class="empty"><i class="ti ${kat.icon}"></i><p>Noch keine Artikel in dieser Kategorie.</p></div>
      <button class="btn btn-copper btn-full" style="margin-top:10px" onclick="modalLagerArtikel(null,'${katId}')"><i class="ti ti-plus"></i> Ersten Artikel anlegen</button>`;
    el.innerHTML=h; return;
  }

  // Nach Unterkategorie gruppieren
  const gruppen={};
  for(const a of gefiltert){ const u=a.unterkategorie||'Ohne Unterkategorie'; (gruppen[u]=gruppen[u]||[]).push(a); }
  for(const u of Object.keys(gruppen).sort()){
    h+=`<div class="card-hdr" style="margin:12px 0 6px">${u}</div>`;
    for(const a of gruppen[u]){
      const warn=istLagerWarnung(a);
      const bestandTxt = a.mengenstufe ? mengenstufeLabel(a.mengenstufe) : (a.bestand??'–');
      h+=`<div class="card" style="margin-bottom:6px;cursor:pointer;${warn?'border-left:3px solid #C0392B':''}" onclick="zeigeLagerArtikel('${a.id}')">
        <div style="display:flex;align-items:center;gap:10px">
          ${a.foto?`<img src="${a.foto}" style="width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0">`:`<div style="width:42px;height:42px;border-radius:8px;background:${kat.color}1a;display:flex;align-items:center;justify-content:center;color:${kat.color};flex-shrink:0"><i class="ti ${kat.icon}"></i></div>`}
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${a.bezeichnung||'(ohne Namen)'}</div>
            <div style="font-size:11px;color:var(--ink-40)">
              ${getLagerStandort(a.standort).label}${a.lagerort?' · '+a.lagerort:''}${a.groesse?' · '+a.groesse:''}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-weight:600;font-size:13px;${warn?'color:#C0392B':''}">${bestandTxt}</div>
            ${warn?`<div style="font-size:10px;color:#C0392B"><i class="ti ti-alert-triangle" style="font-size:9px"></i> nachbestellen</div>`:''}
          </div>
        </div>
      </div>`;
    }
  }
  el.innerHTML=h;
}

async function saveLagerArtikel(artikelId){
  const bez=document.getElementById('laBez')?.value?.trim();
  if(!bez){ toast('Bitte Bezeichnung eingeben'); return; }
  const standort=document.getElementById('laStandort')?.value;
  if(!standort){ toast('Bitte Standort wählen'); return; }
  const realId = artikelId || null;
  const alt = realId ? await idbGet('lager', realId) : null;
  const katId=document.getElementById('laKat')?.value||'sonstige';
  const istVerbrauch = katId==='verbrauch';
  const modus=document.getElementById('laBestandModus')?.value;
  const nutzeStufe = istVerbrauch && modus==='stufe';
  const bestVal=document.getElementById('laBestand')?.value;
  const minVal=document.getElementById('laMindest')?.value;
  const preisVal=document.getElementById('laPreis')?.value;

  const a = {
    id: realId || ('la_'+standort+'_'+Math.random().toString(36).slice(2,8)),
    objektId: standort,            // für vorhandenen Index nutzbar
    standort,
    kategorie: katId,
    unterkategorie: document.getElementById('laUnterkat')?.value||'',
    bezeichnung: bez,
    lagerort: document.getElementById('laLagerort')?.value?.trim()||'',
    groesse: document.getElementById('laGroesse')?.value?.trim()||'',
    typ: document.getElementById('laTyp')?.value?.trim()||'',
    bestand: nutzeStufe ? '' : (bestVal!==''&&bestVal!=null ? parseFloat(bestVal) : ''),
    mindestbestand: nutzeStufe ? '' : (minVal!==''&&minVal!=null ? parseFloat(minVal) : ''),
    mengenstufe: nutzeStufe ? (document.getElementById('laMengenstufe')?.value||'mittel') : '',
    warnungAus: document.getElementById('laWarnungAus')?.checked||false,
    inventarnummer: document.getElementById('laInv')?.value?.trim()||'',
    barcode: document.getElementById('laBarcode')?.value?.trim()||'',
    produktlink: document.getElementById('laLink')?.value?.trim()||'',
    kaufdatum: document.getElementById('laKaufdatum')?.value||'',
    preis: preisVal!==''&&preisVal!=null ? parseFloat(preisVal) : '',
    zustand: document.getElementById('laZustand')?.value||'',
    verantwortlicher: document.getElementById('laVerantwortlich')?.value?.trim()||'',
    foto: window._lagerFoto||'',
    notiz: document.getElementById('laNotiz')?.value?.trim()||'',
    lagerorte: window._laOrte||[],
    erstellt: alt?.erstellt||now(),
    geaendert: now(),
  };
  // Auto-Inventarnummer, falls leer gelassen
  if(!a.inventarnummer){ a.inventarnummer = await naechsteInventarnummer(standort); }
  await idbPut('lager', a);
  window._lagerFoto=null;
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await zeigeLagerKategorie(a.kategorie);

async function zeigeLagerNachbestellung(){
  const el=document.getElementById('page-lager');
  if(!el) return;
  const alle=await getLagerArtikel();
  // Sichtbare Standorte berücksichtigen
  const meineObjekte=await getMyObjekte();
  const meineGruppen=new Set(meineObjekte.map(o=>o.gruppe));
  const sichtbar=s=>{const st=LAGER_STANDORTE.find(x=>x.id===s);return st&&(st.alleSichtbar||meineGruppen.has(st.id));};
  const betroffen=alle.filter(a=>istLagerWarnung(a)&&sichtbar(a.standort));

  let h=`<div class="s-hdr">
    <button class="btn btn-sm" onclick="renderLager()"><i class="ti ti-arrow-left"></i></button>
    <div class="s-title"><i class="ti ti-shopping-cart"></i> Nachbestellen</div>
    <span></span>
  </div>`;

  if(!betroffen.length){
    h+=`<div class="empty"><i class="ti ti-circle-check"></i><p>Keine Artikel unter Mindestbestand.<br>Alle Bestände sind ausreichend.</p></div>`;
    el.innerHTML=h; return;
  }

  h+=`<div style="font-size:12px;color:var(--ink-40);margin-bottom:10px">${betroffen.length} Artikel erreichen oder unterschreiten den Mindestbestand.</div>`;

  // Nach Standort gruppieren
  const proStandort={};
  for(const a of betroffen){ (proStandort[a.standort]=proStandort[a.standort]||[]).push(a); }
  for(const stId of Object.keys(proStandort).sort()){
    const st=getLagerStandort(stId);
    h+=`<div class="card-hdr" style="margin:12px 0 6px"><i class="ti ti-map-pin" style="font-size:13px"></i> ${st.label} (${proStandort[stId].length})</div>`;
    for(const a of proStandort[stId].sort((x,y)=>(x.bezeichnung||'').localeCompare(y.bezeichnung||''))){
      const kat=getLagerKat(a.kategorie);
      const bestelltVor = a.bestelltAm;
      h+=`<div class="card" style="margin-bottom:6px;${bestelltVor?'opacity:0.55':'border-left:3px solid #C0392B'}">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:8px;background:${kat.color}1a;display:flex;align-items:center;justify-content:center;color:${kat.color};flex-shrink:0"><i class="ti ${kat.icon}"></i></div>
          <div style="flex:1;min-width:0;cursor:pointer" onclick="zeigeLagerArtikel('${a.id}')">
            <div style="font-weight:600;font-size:13px">${a.bezeichnung||'(ohne Namen)'}</div>
            <div style="font-size:11px;color:var(--ink-40)">
              Bestand <strong style="color:#C0392B">${a.bestand??0}</strong> / Min. ${a.mindestbestand??0}${a.lagerort?' · '+a.lagerort:''}
              ${bestelltVor?` · <span style="color:#2E7D52">bestellt am ${a.bestelltAm}</span>`:''}
            </div>
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          ${a.produktlink?`<a href="${a.produktlink}" target="_blank" rel="noopener" class="btn btn-sm" style="text-decoration:none"><i class="ti ti-external-link"></i> Nachbestellen</a>`:''}
          <button class="btn btn-sm" onclick="lagerBestandSchnell('${a.id}')"><i class="ti ti-package"></i> Bestand</button>
          ${bestelltVor
            ? `<button class="btn btn-sm" onclick="lagerBestellungZuruecksetzen('${a.id}')"><i class="ti ti-rotate"></i> Zurücksetzen</button>`
            : `<button class="btn btn-sm" style="color:#2E7D52" onclick="lagerAlsBestellt('${a.id}')"><i class="ti ti-check"></i> Bestellt</button>`}

/* ── L4: Barcode-Scan ──────────────────────────────────────
   Nutzt die native BarcodeDetector API (keine externe Bibliothek).
   Ist sie nicht verfügbar, greift automatisch die manuelle Eingabe.
   Kontext steuert das Verhalten nach erfolgreichem Scan:
   - 'suche'  → Artikel mit dieser Barcode-Nr. suchen/öffnen
   - 'erfassen'→ Barcode in das offene Artikelformular (#laBarcode) eintragen
*/
let _bcStream=null, _bcRunning=false, _bcContext='suche';

async function scanLagerBarcode(context){
  _bcContext = context || 'suche';
  // Beim Scannen aus dem Artikelformular: aktuelle Eingaben sichern, um sie danach wiederherzustellen
  if(_bcContext==='erfassen'){
    window._bcFormState = (typeof leseLagerForm==='function' && document.getElementById('laBez')) ? leseLagerForm() : null;
    window._bcFormEditId = window._lagerEditId || null;
  }
  const unterstuetzt = ('BarcodeDetector' in window);
  showModal(`
    <div class="m-title"><i class="ti ti-scan"></i> Barcode scannen</div>
    ${unterstuetzt?`
      <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px">
        <video id="bcVideo" playsinline style="width:100%;height:100%;object-fit:cover"></video>
        <div style="position:absolute;inset:18% 8%;border:3px solid rgba(255,255,255,0.8);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,0.25)"></div>
      </div>
      <div id="bcStatus" style="text-align:center;font-size:12px;color:var(--ink-40);margin-bottom:10px">Kamera startet…</div>
    `:`
      <div style="background:#FEF3E2;border-left:3px solid #D4820A;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:12px">
        <i class="ti ti-info-circle"></i> Kamera-Scan wird auf diesem Gerät nicht unterstützt. Bitte Barcode-Nummer manuell eingeben.
      </div>
    `}
    <div class="f"><label>Barcode-Nr. manuell</label>
      <input type="text" id="bcManual" inputmode="numeric" placeholder="Nummer eintippen" onkeydown="if(event.key==='Enter')bcManualSubmit()">
    </div>
    <div class="f-row" style="margin-top:8px">
      <button class="btn btn-copper btn-full" onclick="bcManualSubmit()"><i class="ti ti-check"></i> Übernehmen</button>
      <button class="btn btn-full" onclick="stopScanLagerBarcode()">Abbrechen</button>
    </div>`);
  if(unterstuetzt){
    try{ await bcStart(); }
    catch(e){
      console.warn('Barcode-Scanner:', e);
      const st=document.getElementById('bcStatus');
      if(st) st.textContent='Kamera nicht verfügbar – bitte manuell eingeben.';
    }
  }
}

async function bcStart(){
  const detector = new window.BarcodeDetector({
    formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','codabar','qr_code']
  });
  _bcStream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }, audio:false
  });
  const v=document.getElementById('bcVideo');
  if(!v){ // Modal bereits geschlossen
    _bcStream.getTracks().forEach(t=>t.stop()); _bcStream=null; return;
  }
  v.srcObject=_bcStream;
  await v.play().catch(()=>{});
  const st=document.getElementById('bcStatus');
  if(st) st.textContent='Barcode in den Rahmen halten…';
  _bcRunning=true;
  const tick=async()=>{
    if(!_bcRunning) return;
    const vid=document.getElementById('bcVideo');
    if(!vid || !vid.videoWidth){ requestAnimationFrame(tick); return; }
    try{
      const codes=await detector.detect(vid);
      if(codes && codes.length){
        const wert=(codes[0].rawValue||'').trim();
        if(wert){ await bcOnDetected(wert); return; }
      }
    }catch(e){ /* einzelne Frames können fehlschlagen – weiterlaufen */ }
    setTimeout(tick, 300); // ~3 Scans/Sek., schont Akku
  };
  requestAnimationFrame(tick);
}

function _bcStopStream(){
  _bcRunning=false;
  if(_bcStream){ _bcStream.getTracks().forEach(t=>t.stop()); _bcStream=null; }
}

async function bcOnDetected(wert){
  _bcStopStream();
  // kurzes haptisches Feedback, falls verfügbar
  if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
  await bcVerarbeite(wert);
}

async function bcManualSubmit(){
  const wert=document.getElementById('bcManual')?.value?.trim();
  if(!wert){ toast('Bitte Barcode-Nummer eingeben'); return; }
  _bcStopStream();
  await bcVerarbeite(wert);
}

function stopScanLagerBarcode(){
  _bcStopStream();
  closeModal();
}

// Verarbeitet einen erkannten/eingegebenen Barcode je nach Kontext
async function bcVerarbeite(wert){
  if(_bcContext==='erfassen'){
    const state = window._bcFormState || {};
    state.barcode = wert;
    window._bcFormState = null;
    await renderLagerArtikelForm(state, window._bcFormEditId||null);
    toast('Barcode übernommen ✓');
    return;
  }
  if(_bcContext==='inventurort'){
    // Lagerort-QR für Inventur: passenden Ort finden, dessen Artikel zählen
    const qrId=wert.replace(/^LAGERORT:/,'').trim();
    const orte=await getLagerorte();
    const ort=orte.find(o=>o.qrId===qrId || o.qrId===wert);
    closeModal();
    if(ort){ await inventurLosOrt(ort.id); }
    else { toast('Kein Lagerort zu diesem QR gefunden'); await startInventur(); }
    return;
  }
  if(_bcContext==='lagerort'){
    // QR-Inhalt "LAGERORT:<qrId>" → passenden Lagerort finden
    const qrId=wert.replace(/^LAGERORT:/,'').trim();
    const orte=await getLagerorte();
    const ort=orte.find(o=>o.qrId===qrId || o.qrId===wert);
    const state=window._bcFormState||{};
    window._bcFormState=null;
    if(ort){
      state.lagerorte=state.lagerorte||[];
      if(!state.lagerorte.includes(ort.id)) state.lagerorte.push(ort.id);
      window._laOrte=state.lagerorte;
      await renderLagerArtikelForm(state, window._bcFormEditId||null);
      toast('Lagerort übernommen: '+ort.bezeichnung+' ✓');
    } else {
      await renderLagerArtikelForm(state, window._bcFormEditId||null);
      toast('Kein Lagerort zu diesem QR gefunden');
    }
    return;
  }
  // Tätigkeits-QR erkannt: "TAETIGKEIT:<kat>:<obj>"
  if(wert.indexOf('TAETIGKEIT:')===0){
    closeModal();
    const teile=wert.split(':');
    const katId=teile[1], objId=teile[2];
    const kats=await getTaetigkeitKat();
    const kat=kats.find(k=>k.id===katId);
    const obj=getObj(objId);
    if(typeof starteTaetigkeitVonQR==='function'){
      await starteTaetigkeitVonQR(katId, objId);
    } else {
      // Stempeluhr noch nicht aktiv – Inhalt zur Kontrolle anzeigen
      showModal(`<div class="m-title"><i class="ti ti-clock"></i> Tätigkeits-QR erkannt</div>
        <p style="font-size:13px;color:var(--ink-60);margin-bottom:6px">Dieser QR ist gültig:</p>
        <div style="background:var(--ink-05);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px">
          <strong>${kat?kat.name:katId}</strong><br>${obj?obj.name:objId}
        </div>
        <p style="font-size:12px;color:var(--ink-40);margin-bottom:12px">Die Stempeluhr wird im nächsten Schritt aktiviert. Danach startet dieser Scan die Tätigkeit automatisch.</p>
        <button class="btn btn-full" onclick="closeModal()">Schließen</button>`);
    }
    return;
  }
  // Kontext 'suche': Artikel mit exakt dieser Barcode-Nr. finden
  const alle=await getLagerArtikel();
  const treffer=alle.filter(a=>(a.barcode||'').trim()===wert);
  closeModal();
  if(treffer.length===1){
    await zeigeLagerArtikel(treffer[0].id);
  } else if(treffer.length>1){
    // mehrere: Auswahl anzeigen
    showModal(`<div class="m-title"><i class="ti ti-scan"></i> ${treffer.length} Treffer</div>
      <div style="font-size:12px;color:var(--ink-40);margin-bottom:8px">Barcode ${wert}</div>
      ${treffer.map(a=>{const kat=getLagerKat(a.kategorie);return `<div class="card" style="margin-bottom:6px;cursor:pointer" onclick="closeModal();zeigeLagerArtikel('${a.id}')">
        <div style="display:flex;align-items:center;gap:10px"><i class="ti ${kat.icon}" style="color:${kat.color}"></i>
        <div><div style="font-weight:600;font-size:13px">${a.bezeichnung}</div>
        <div style="font-size:11px;color:var(--ink-40)">${getLagerStandort(a.standort).label} · Bestand ${a.bestand??'–'}</div></div></div></div>`;}).join('')}
      <button class="btn btn-full" style="margin-top:8px" onclick="closeModal()">Schließen</button>`);
  } else {
    // kein Treffer: anbieten, neuen Artikel mit dieser Barcode anzulegen
    showModal(`<div class="m-title"><i class="ti ti-scan-eye"></i> Kein Artikel gefunden</div>
      <p style="font-size:13px;color:var(--ink-60);margin-bottom:12px">Für den Barcode <strong>${wert}</strong> ist kein Artikel hinterlegt. Möchten Sie einen neuen Artikel mit dieser Nummer anlegen?</p>
      <div class="f-row">
        <button class="btn btn-copper btn-full" onclick="closeModal();neuerArtikelMitBarcode('${wert.replace(/'/g,'')}')"><i class="ti ti-plus"></i> Artikel anlegen</button>
        <button class="btn btn-full" onclick="closeModal()">Abbrechen</button>
      </div>`);
  }
}

// Inventur für einen bestimmten Lagerort starten
async function inventurLosOrt(ortId){
  const ort=await idbGet('lager', ortId);
  if(!ort){ toast('Lagerort nicht gefunden'); return; }
  const alle=await getLagerArtikel();
  _invListe=alle.filter(a=>a.lagerorte?.includes(ortId))
    .sort((a,b)=>{
      const ka=getLagerKat(a.kategorie).label, kb=getLagerKat(b.kategorie).label;
      return ka.localeCompare(kb)||(a.bezeichnung||'').localeCompare(b.bezeichnung||'');
    });
  _invStandort=ort.standort;
  _invOrtLabel=ort.bezeichnung;
  _invIndex=0; _invGeprueft=0; _invKorrigiert=0;
  if(!_invListe.length){ toast(`Keine Artikel am Lagerort „${ort.bezeichnung}" zugeordnet`); return; }
  renderInventurSchritt();
}

async function inventurLos(){
  _invStandort=document.getElementById('invStandortSel')?.value;
  _invOrtLabel=null;
  const alle=await getLagerArtikel('standort',_invStandort);
  _invListe=alle.sort((a,b)=>{
    const ka=getLagerKat(a.kategorie).label, kb=getLagerKat(b.kategorie).label;
    return ka.localeCompare(kb)||(a.bezeichnung||'').localeCompare(b.bezeichnung||'');
  });
  _invIndex=0; _invGeprueft=0; _invKorrigiert=0;
  if(!_invListe.length){ toast('Keine Artikel an diesem Standort'); closeModal(); return; }
  renderInventurSchritt();
}

function renderInventurSchritt(){
  if(_invIndex>=_invListe.length){ renderInventurFertig(); return; }
  const a=_invListe[_invIndex];
  const kat=getLagerKat(a.kategorie);
  const fortschritt=Math.round((_invIndex/_invListe.length)*100);
  const bestandAktuell = a.mengenstufe ? mengenstufeLabel(a.mengenstufe) : (a.bestand??0);
  showModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div style="font-size:12px;color:var(--ink-40)">Inventur · ${_invOrtLabel?_invOrtLabel:getLagerStandort(_invStandort).label}</div>
      <div style="font-size:12px;color:var(--ink-40)">${_invIndex+1} / ${_invListe.length}</div>
    </div>
    <div style="height:5px;background:var(--ink-10);border-radius:3px;margin-bottom:12px;overflow:hidden">
      <div style="height:100%;width:${fortschritt}%;background:var(--copper);transition:width .2s"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      ${a.foto?`<img src="${a.foto}" style="width:48px;height:48px;border-radius:8px;object-fit:cover">`:`<div style="width:48px;height:48px;border-radius:8px;background:${kat.color}1a;display:flex;align-items:center;justify-content:center;color:${kat.color}"><i class="ti ${kat.icon}"></i></div>`}
      <div style="flex:1">
        <div style="font-weight:600;font-size:15px">${a.bezeichnung||'(ohne Namen)'}</div>
        <div style="font-size:12px;color:var(--ink-40)">${kat.label}${a.lagerort?' · '+a.lagerort:''}</div>
      </div>
    </div>
    <div style="text-align:center;background:var(--ink-05);border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:12px;color:var(--ink-40)">erfasster Bestand</div>
      <div style="font-size:26px;font-weight:700">${bestandAktuell}</div>
    </div>
    ${a.mengenstufe?`
      <div class="f"><label>Tatsächliche Menge</label>
        <select id="invStufe">
          <option value="viel" ${a.mengenstufe==='viel'?'selected':''}>viel</option>
          <option value="mittel" ${a.mengenstufe==='mittel'?'selected':''}>mittel</option>
          <option value="wenig" ${a.mengenstufe==='wenig'?'selected':''}>wenig</option>
        </select></div>
      <button class="btn btn-copper btn-full" style="margin-bottom:6px" onclick="inventurKorrigieren()"><i class="ti ti-edit"></i> Menge übernehmen</button>
    `:`
      <div class="f"><label>Tatsächlicher Bestand (bei Abweichung)</label>
        <input type="number" id="invBestand" step="1" inputmode="numeric" placeholder="${a.bestand??0}"></div>
      <button class="btn btn-copper btn-full" style="margin-bottom:6px" onclick="inventurKorrigieren()"><i class="ti ti-edit"></i> Bestand korrigieren</button>
    `}
    <button class="btn btn-full" style="margin-bottom:6px;color:#2E7D52" onclick="inventurBestaetigen()"><i class="ti ti-check"></i> Passt – weiter</button>
    <div style="display:flex;gap:6px">
      <button class="btn" style="flex:1" onclick="if(_invIndex>0){_invIndex--;renderInventurSchritt();}"><i class="ti ti-arrow-left"></i> Zurück</button>
      <button class="btn" style="flex:1" onclick="inventurAbbrechen()">Beenden</button>
    </div>`);
}

async function inventurBestaetigen(){
  const a=_invListe[_invIndex];
  a.inventurAm=new Date().toLocaleDateString('de-DE');
  a.inventurVon=CU?.name||'';
  await idbPut('lager', a);
  _invGeprueft++;
  _invIndex++;
  renderInventurSchritt();
}

async function inventurKorrigieren(){
  const a=_invListe[_invIndex];
  if(a.mengenstufe){
    a.mengenstufe=document.getElementById('invStufe')?.value||a.mengenstufe;
  } else {
    const v=document.getElementById('invBestand')?.value;
    if(v===''||v==null){ toast('Bitte Bestand eingeben oder „Passt" wählen'); return; }
    const neu=parseFloat(v);
    if(neu!==a.bestand){ _invKorrigiert++; }
    a.bestand=neu;
    if(!istLagerWarnung(a)) delete a.bestelltAm;
  }
  a.inventurAm=new Date().toLocaleDateString('de-DE');
  a.inventurVon=CU?.name||'';
  a.geaendert=now();
  await idbPut('lager', a);
  _invGeprueft++;
  _invIndex++;
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  renderInventurSchritt();
}

function inventurAbbrechen(){
  if(_invGeprueft>0 || _invIndex>0){
    if(!confirm('Inventur beenden? Bereits erfasste Stände bleiben gespeichert.')) return;
  }
  renderInventurFertig(true);
}

function renderInventurFertig(vorzeitig){
  closeModal();
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  showModal(`
    <div class="m-title"><i class="ti ti-circle-check" style="color:#2E7D52"></i> Inventur ${vorzeitig?'beendet':'abgeschlossen'}</div>
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:13px;color:var(--ink-60);margin-bottom:10px">${_invOrtLabel?_invOrtLabel+' · ':''}${getLagerStandort(_invStandort).label}</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <div style="background:var(--ink-05);border-radius:10px;padding:12px 18px">
          <div style="font-size:24px;font-weight:700">${_invGeprueft}</div>
          <div style="font-size:11px;color:var(--ink-40)">geprüft</div>
        </div>
        <div style="background:var(--ink-05);border-radius:10px;padding:12px 18px">
          <div style="font-size:24px;font-weight:700;color:var(--copper)">${_invKorrigiert}</div>
          <div style="font-size:11px;color:var(--ink-40)">korrigiert</div>
        </div>
      </div>
    </div>
    <button class="btn btn-copper btn-full" style="margin-top:12px" onclick="closeModal();renderLager()"><i class="ti ti-check"></i> Fertig</button>`);
}

/* ── L6: Materialentnahme & standortübergreifende Anforderung ──
   Entnahme: Bestand sinkt sofort, optional mit Mangel-/Reparaturbezug.
   Anforderung: Material an anderem Standort „bitte mitbringen" – wird dort
   sichtbar und beim Verbrauch quittiert; erst dann sinkt der Bestand.
*/
async function modalLagerEntnahme(artikelId, mangelId){
  const a=await idbGet('lager', artikelId); if(!a) return;
  const istStufe=!!a.mengenstufe;
  showModal(`
    <div class="m-title"><i class="ti ti-package-export"></i> Entnehmen – ${a.bezeichnung}</div>
    <div style="background:var(--ink-05);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px">
      Standort: <strong>${getLagerStandort(a.standort).label}</strong>${a.lagerort?' · '+a.lagerort:''}<br>
      Aktueller Bestand: <strong>${istStufe?mengenstufeLabel(a.mengenstufe):(a.bestand??0)}</strong>
    </div>
    ${istStufe?`
      <div class="f"><label>Neue Menge nach Entnahme</label>
        <select id="entStufe">
          <option value="viel" ${a.mengenstufe==='viel'?'selected':''}>viel</option>
          <option value="mittel" ${a.mengenstufe==='mittel'?'selected':''}>mittel</option>
          <option value="wenig" ${a.mengenstufe==='wenig'?'selected':''}>wenig</option>
        </select></div>
    `:`
      <div class="f"><label>Entnommene Menge *</label>
        <input type="number" id="entMenge" step="1" min="1" inputmode="numeric" value="1"></div>
    `}
    <div class="f"><label>Verwendung / Bezug (optional)</label>
      <input type="text" id="entZweck" placeholder="z. B. Reparatur WE 3, Mindener Str. 23" value="${mangelId?'Mangel-Behebung':''}"></div>
    <div class="f-row" style="margin-top:12px">
      <button class="btn btn-copper btn-full" onclick="saveLagerEntnahme('${artikelId}','${mangelId||''}')"><i class="ti ti-check"></i> Entnahme buchen</button>
      <button class="btn btn-full" onclick="closeModal()">Abbrechen</button>
    </div>`);
}

async function saveLagerEntnahme(artikelId, mangelId){
  const a=await idbGet('lager', artikelId); if(!a) return;
  let menge=0;
  if(a.mengenstufe){
    a.mengenstufe=document.getElementById('entStufe')?.value||a.mengenstufe;
  } else {
    menge=parseFloat(document.getElementById('entMenge')?.value);
    if(isNaN(menge)||menge<=0){ toast('Bitte gültige Menge eingeben'); return; }
    const best=parseFloat(a.bestand)||0;
    if(menge>best){
      if(!confirm(`Entnahme (${menge}) übersteigt den Bestand (${best}). Bestand auf 0 setzen?`)) return;
      a.bestand=0;
    } else {
      a.bestand=best-menge;
    }
    if(!istLagerWarnung(a)) {} // Warnung ggf. neu aktiv – bewusst nicht zurücksetzen
  }
  const zweck=document.getElementById('entZweck')?.value?.trim()||'';
  // Entnahme protokollieren (Historie am Artikel)
  a.entnahmen = a.entnahmen||[];
  a.entnahmen.unshift({datum:new Date().toLocaleDateString('de-DE'), menge: a.mengenstufe?('→ '+a.mengenstufe):menge, zweck, von:CU?.name||'', mangelId:mangelId||null});
  if(a.entnahmen.length>50) a.entnahmen=a.entnahmen.slice(0,50);
  a.geaendert=now();
  await idbPut('lager', a);
  closeModal();
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  // Falls aus Mangel-Kontext aufgerufen: dorthin zurück, sonst Artikel zeigen
  if(mangelId && typeof showMangelDetail==='function'){
    await showMangelDetail(mangelId, window._mangelMatStore||'maengel');
  } else {
    await zeigeLagerArtikel(artikelId);
  }
  toast('Entnahme gebucht ✓');
}

async function saveLagerAnforderung(artikelId, mangelId){

// L7: Materialauswahl für einen Mangel/Reparatur – entnehmen oder anfordern
async function materialFuerMangel(mangelId, store){
  window._mangelMatStore = store||'maengel';
  const alle=(await getLagerArtikel()).sort((a,b)=>(a.bezeichnung||'').localeCompare(b.bezeichnung||''));
  const meineObjekte=await getMyObjekte();
  const meineGruppen=new Set(meineObjekte.map(o=>o.gruppe));
  const sichtbar=alle.filter(a=>{const st=LAGER_STANDORTE.find(x=>x.id===a.standort);return st&&(st.alleSichtbar||meineGruppen.has(st.id));});

    <div id="matPickerList" style="max-height:55vh;overflow-y:auto">

    </div>
    <button class="btn btn-full" style="margin-top:10px" onclick="showMangelDetail('${mangelId}','${store||'maengel'}')">Zurück zum Vorgang</button>`);
  window._matPickerData=sichtbar; window._matPickerMangel=mangelId;
}

function materialPickerRow(a, mangelId){
  const kat=getLagerKat(a.kategorie);

      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${a.bezeichnung||'(ohne Namen)'}</div>
        <div style="font-size:11px;color:var(--ink-40)">${getLagerStandort(a.standort).label} · Bestand ${best}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button class="btn btn-sm btn-copper" onclick="modalLagerEntnahme('${a.id}','${mangelId}')" title="Entnehmen"><i class="ti ti-package-export"></i></button>

function filterMaterialPicker(q){
  const list=document.getElementById('matPickerList');
  if(!list) return;
  const ql=(q||'').toLowerCase();
  list.querySelectorAll('[data-name]').forEach(el=>{
    el.style.display = !ql || el.getAttribute('data-name').includes(ql) ? '' : 'none';
  });
}

// Übersicht offener Anforderungen (im Lager-Bereich)
async function zeigeLagerAnforderungen(){
  const el=document.getElementById('page-lager');
  if(!el) return;
  const alle=await idbGetAll('lager_anforderung');
  const offen=alle.filter(x=>x.status==='offen')
    .sort((a,b)=>(a.prio==='hoch'?-1:1)-(b.prio==='hoch'?-1:1));
  let h=`<div class="s-hdr">
    <button class="btn btn-sm" onclick="renderLager()"><i class="ti ti-arrow-left"></i></button>
    <div class="s-title"><i class="ti ti-truck-delivery"></i> Materialanforderungen</div>
    <span></span>
  </div>`;
  if(!offen.length){
    h+=`<div class="empty"><i class="ti ti-circle-check"></i><p>Keine offenen Anforderungen.</p></div>`;
    el.innerHTML=h; return;
  }
  for(const x of offen){
    h+=`<div class="card" style="margin-bottom:8px;${x.prio==='hoch'?'border-left:3px solid #C0392B':''}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        ${x.prio==='hoch'?'<span class="chip chip-warn" style="font-size:10px">dringend</span>':''}
        <div style="font-weight:600;font-size:14px;flex:1">${x.artikelName}${x.menge?` · ${x.menge} Stk.`:''}</div>
      </div>
      <div style="font-size:12px;color:var(--ink-60)">
        Von Standort <strong>${x.standortLabel}</strong> mitbringen${x.ziel?` nach <strong>${x.ziel}</strong>`:''}.<br>
        ${x.notiz?x.notiz+'<br>':''}
        <span style="color:var(--ink-40)">${x.ersteller} · ${x.erstellt}</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-sm btn-copper" style="flex:1" onclick="anforderungErledigt('${x.id}')"><i class="ti ti-check"></i> Erledigt (Bestand buchen)</button>
        <button class="btn btn-sm" onclick="anforderungLoeschen('${x.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }
  el.innerHTML=h;
}

// Anforderung erledigt: Material wurde mitgebracht/verbraucht → Bestand am Quellstandort mindern
async function anforderungErledigt(anfId){
  const x=await idbGet('lager_anforderung', anfId); if(!x) return;
  const a=await idbGet('lager', x.artikelId);
  if(a && !a.mengenstufe && x.menge){
    const best=parseFloat(a.bestand)||0;
    a.bestand=Math.max(0, best-x.menge);
    a.entnahmen=a.entnahmen||[];
    a.entnahmen.unshift({datum:new Date().toLocaleDateString('de-DE'), menge:x.menge, zweck:'Anforderung'+(x.ziel?' → '+x.ziel:''), von:CU?.name||'', mangelId:x.mangelId||null});
    a.geaendert=now();
    await idbPut('lager', a);
  }
  x.status='erledigt'; x.erledigtAm=now(); x.erledigtVon=CU?.name||'';
  await idbPut('lager_anforderung', x);
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  await zeigeLagerAnforderungen();
  toast('Anforderung erledigt – Bestand gebucht ✓');
}

async function anforderungLoeschen(anfId){
  if(!confirm('Anforderung löschen?')) return;
  await idbDelete('lager_anforderung', anfId);
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  await zeigeLagerAnforderungen();
  toast('Anforderung gelöscht');
}

async function sucheLager(q){
  const res=document.getElementById('lagerSucheResult');
  if(!res) return;
  if(!q||q.length<2){ res.innerHTML=''; return; }
  const alle=await getLagerArtikel();
  const tref=alle.filter(a=>
    (a.bezeichnung||'').toLowerCase().includes(q.toLowerCase())||
    (a.inventarnummer||'').toLowerCase().includes(q.toLowerCase())||
    (a.barcode||'').toLowerCase().includes(q.toLowerCase()));
  if(!tref.length){ res.innerHTML='<div style="padding:10px;color:var(--ink-40);font-size:13px">Keine Treffer</div>'; return; }
  res.innerHTML=tref.slice(0,20).map(a=>{
    const kat=getLagerKat(a.kategorie);
    return `<div class="card" style="margin-top:6px;cursor:pointer" onclick="zeigeLagerArtikel('${a.id}')">
      <div style="display:flex;align-items:center;gap:10px">
        <i class="ti ${kat.icon}" style="color:${kat.color}"></i>
        <div style="flex:1"><div style="font-weight:600;font-size:13px">${a.bezeichnung||'(ohne Namen)'}</div>
          <div style="font-size:11px;color:var(--ink-40)">${kat.label} · ${getLagerStandort(a.standort).label} · Bestand: ${a.bestand??'–'}</div></div>
      </div></div>`;
  }).join('');
}

async function aktiviereFaelligeMieterwechsel() {
  try {
    const heute = new Date(); heute.setHours(0,0,0,0);
    const alle = await idbGetAll('mieter');
    const zukunft = alle.filter(m=>m._zukuenftig && m.einzugISO);
    let geaendert = false;
    for (const neu of zukunft) {
      const start = new Date(neu.einzugISO); start.setHours(0,0,0,0);
      if (start > heute) continue; // noch nicht fällig
      // Wechsel durchführen
      const alt = neu._ersetztMieterId ? alle.find(m=>m.id===neu._ersetztMieterId) : null;
      if (alt && !alt._vormieter) {
        await mieterZuVormieter(alt, neu);
      }
      delete neu._zukuenftig;
      neu._vormieterId = alt?.id || neu._vormieterId || null;
      await idbPut('mieter', neu);
      geaendert = true;
    }
    if (geaendert) {
      clearTimeout(window._syncTimer);
      window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
    }
    return geaendert;
  } catch(e) { console.warn('Mieterwechsel-Prüfung:', e); return false; }
}

const WARTUNG_TYPEN = [
  {val:'heizung',    label:'Heizungswartung',        intervall:12, icon:'ti-flame',         hinweis:'Fachkundige Wartung nach GEG; Intervall je nach Anlage (oft jährlich).'},
  {val:'rauchmelder',label:'Rauchmelder-Prüfung',    intervall:12, icon:'ti-bell-ringing',  hinweis:'Jährliche Funktionsprüfung nach DIN 14676.'},
  {val:'schornstein',label:'Schornsteinfeger',       intervall:12, icon:'ti-building-factory',hinweis:'Abgasmessung / Feuerstättenschau nach Kehr- und Überprüfungsordnung.'},
  {val:'legionellen',label:'Legionellenprüfung',     intervall:36, icon:'ti-droplet',        hinweis:'Trinkwasseruntersuchung bei Großanlagen, i.d.R. alle 3 Jahre (TrinkwV).'},
  {val:'feuerloescher',label:'Feuerlöscher-Prüfung', intervall:24, icon:'ti-fire-extinguisher',hinweis:'Sachkundige Prüfung üblicherweise alle 2 Jahre (DIN 14406).'},
  {val:'sonstiges',  label:'Sonstige Wartung',       intervall:12, icon:'ti-tool',           hinweis:''},
];
const wartungTyp = v => WARTUNG_TYPEN.find(t=>t.val===v) || WARTUNG_TYPEN[WARTUNG_TYPEN.length-1];

// Tage bis zur Fälligkeit (negativ = überfällig)
function wartungTageBis(w){
  if(!w.faellig) return null;
  const heute = new Date(); heute.setHours(0,0,0,0);
  const f = new Date(w.faellig); f.setHours(0,0,0,0);
  return Math.round((f - heute)/86400000);
}
// Nächstes Fälligkeitsdatum aus Basisdatum + Intervall (Monate)
function wartungNaechste(basisISO, intervallMonate){
  const d = new Date(basisISO);
  d.setMonth(d.getMonth() + (intervallMonate||12));
  return d.toISOString().split('T')[0];
}

async function getMyWartung(){
  const myObj = await getMyObjekte();
  const ids = myObj.map(o=>o.id);
  const all = await idbGetAll('wartung');
  return all.filter(w => !w.objektId || ids.includes(w.objektId));
}

// Liefert fällige + bald fällige Wartungen (für Dashboard-Warnbox)
async function getFaelligeWartung(vorlaufTage=30){
  const list = await getMyWartung();
  return list
    .map(w => ({...w, tage: wartungTageBis(w)}))
    .filter(w => w.tage !== null && w.tage <= vorlaufTage)
    .sort((a,b)=>a.tage-b.tage);
}

async function renderWartung(){
  const el = document.getElementById('page-wartung');
  const list = (await getMyWartung()).map(w=>({...w, tage:wartungTageBis(w)}))
    .sort((a,b)=>(a.tage??9e9)-(b.tage??9e9));

  let html = `<div style="margin-bottom:14px">
    <button class="btn btn-copper btn-full" onclick="modalAddWartung()"><i class="ti ti-plus"></i> Wartungsfrist anlegen</button>
  </div>`;

  if(!list.length){
    html += `<div style="text-align:center;color:var(--ink-40);padding:30px 16px;font-size:13px">
      <i class="ti ti-calendar-check" style="font-size:32px;display:block;margin-bottom:8px;opacity:.4"></i>
      Noch keine Wartungsfristen erfasst.<br>Lege z. B. Heizung, Rauchmelder oder Legionellenprüfung an.
    </div>`;
  } else {
    for(const w of list){
      const t = wartungTyp(w.typ);
      const obj = w.objektId ? getObj(w.objektId) : null;
      let statusColor='var(--green)', statusText='', statusBg='';
      if(w.tage===null){ statusColor='var(--ink-40)'; statusText='Kein Datum'; }
      else if(w.tage<0){ statusColor='var(--red)'; statusText=`${Math.abs(w.tage)} Tage überfällig`; statusBg='var(--red-l,#fdecea)'; }
      else if(w.tage<=30){ statusColor='var(--amber)'; statusText=`fällig in ${w.tage} Tagen`; statusBg='var(--amber-l)'; }
      else { statusColor='var(--green)'; statusText=`fällig in ${w.tage} Tagen`; }
      html += `<div class="card" style="margin-bottom:10px;${statusBg?`background:${statusBg}`:''}">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <i class="ti ${t.icon}" style="font-size:22px;color:${statusColor};flex-shrink:0;margin-top:2px"></i>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px">${esc(w.titel||t.label)}</div>
            <div style="font-size:12px;color:var(--ink-40);margin-top:2px">
              ${obj?esc(obj.name):'Alle Objekte'} · alle ${w.intervall||12} Monate
            </div>
            <div style="font-size:12px;color:${statusColor};font-weight:600;margin-top:4px">
              <i class="ti ti-calendar" style="font-size:12px"></i> ${w.faellig?fmtDate(w.faellig):'–'} ${statusText?`· ${statusText}`:''}
            </div>
            ${w.notiz?`<div style="font-size:12px;color:var(--ink-40);margin-top:4px">${esc(w.notiz)}</div>`:''}
          </div>
        </div>

async function modalAddWartung(id){

  const myObj = await getMyObjekte();
  const titel = w ? 'Wartungsfrist bearbeiten' : 'Wartungsfrist anlegen';
  const selTyp = w?.typ || 'heizung';
  const html = `

    <div class="f"><label>Art der Wartung</label>
      <select id="wTyp" onchange="wartungTypChange()">
        ${WARTUNG_TYPEN.map(t=>`<option value="${t.val}" ${t.val===selTyp?'selected':''}>${t.label}</option>`).join('')}

    </div>
    <div class="f"><label>Eigene Bezeichnung (optional)</label>

    <div class="f"><label>Objekt</label>

      <textarea id="wNotiz" style="min-height:60px" placeholder="z. B. Firma, Vertragsnummer, Ansprechpartner">${w?esc(w.notiz||''):''}</textarea></div>
    <div id="wHinweis" style="font-size:11px;color:var(--ink-40);line-height:1.5;margin-bottom:12px"></div>
    <button class="btn btn-copper btn-full" onclick="saveWartung('${id||''}')">
      <i class="ti ti-device-floppy"></i> Speichern
    </button>`;

function wartungTypChange(){
  const typ = document.getElementById('wTyp')?.value;
  if(!typ) return;
  const t = wartungTyp(typ);
  const hinweisEl = document.getElementById('wHinweis');
  if(hinweisEl) hinweisEl.textContent = t.hinweis ? 'Hinweis: '+t.hinweis : '';
  // Intervall-Vorschlag nur setzen, wenn Feld leer oder noch Default
  const intEl = document.getElementById('wIntervall');
  if(intEl && (!intEl.value || intEl.dataset.auto!=='0')){ intEl.value = t.intervall; intEl.dataset.auto='1'; }
}

async function saveWartung(id){
  const typ = document.getElementById('wTyp').value;
  const titel = document.getElementById('wTitel').value.trim();
  const objektId = document.getElementById('wObjekt').value || null;
  const intervall = parseInt(document.getElementById('wIntervall').value,10) || wartungTyp(typ).intervall;
  const faellig = document.getElementById('wFaellig').value;
  const notiz = document.getElementById('wNotiz').value.trim();
  if(!faellig){ toast('Bitte Fälligkeitsdatum angeben'); return; }
  const existing = id ? await idbGet('wartung', id) : null;
  const w = {
    id: id || uid(),
    typ, titel: titel || wartungTyp(typ).label,
    objektId, intervall, faellig, notiz,
    erstellt: existing?.erstellt || now(),
    historie: existing?.historie || [],
  };
  await idbPut('wartung', w);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await renderWartung();
  if(curPage==='dash') await renderDash();
  toast('Wartungsfrist gespeichert ✓');
}

async function wartungErledigt(id){
  const w = await idbGet('wartung', id);
  if(!w) return;
  if(!confirm(`Wartung "${w.titel}" als erledigt markieren? Die nächste Fälligkeit wird automatisch berechnet.`)) return;
  // Historie pflegen, nächste Fälligkeit ab heute berechnen
  w.historie = w.historie || [];
  w.historie.push({ erledigtAm: today(), war: w.faellig, von: CU?.name||'' });
  w.faellig = wartungNaechste(today(), w.intervall);
  await idbPut('wartung', w);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await renderWartung();
  if(curPage==='dash') await renderDash();
  toast(`Erledigt ✓ – nächste Fälligkeit: ${fmtDate(w.faellig)}`);
}

async function deleteWartung(id){
  if(!confirm('Wartungsfrist wirklich löschen?')) return;
  await idbDelete('wartung', id);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await renderWartung();
  if(curPage==='dash') await renderDash();
  toast('Wartungsfrist gelöscht');
}

/* ═══════════════════════════════════════════════════════════
   AUFGABEN PAGE
═══════════════════════════════════════════════════════════ */
async function renderAufgaben(){
  const myObj=await getMyObjekte();
  const myIds=myObj.map(o=>o.id);
  const aufgaben=(await idbGetAll('aufgaben')).filter(a=>myIds.includes(a.objektId));
  const maengelRaw=(await idbGetAll('maengel')).filter(m=>myIds.includes(m.objektId));
  const altReps=(await idbGetAll('reparaturen')).filter(r=>myIds.includes(r.objektId)).map(r=>({...r,istReparatur:true,_altStore:true}));
  const maengel=[...maengelRaw,...altReps];
  const el=document.getElementById('page-aufgaben');

  const offen=aufgaben.filter(a=>a.status!=='erledigt');
  const erledigt=aufgaben.filter(a=>a.status==='erledigt');
  const offMng=maengel.filter(m=>m.status!=='behoben'&&m.status!=='erledigt');

  let h=`<div class="tab-bar">
    <button class="tab-btn active" onclick="aufgabenTab('todos',this)">ToDos (${offen.length})</button>
    <button class="tab-btn" onclick="aufgabenTab('maengel',this)">Mängel & Reparaturen (${offMng.length})</button>
    <button class="tab-btn" onclick="aufgabenTab('einkauf',this)"><i class="ti ti-shopping-cart"></i> Einkauf</button>
  </div>
  <div id="auf-todos">`;

  if(!offen.length&&!erledigt.length){
    h+=`<div class="empty"><i class="ti ti-check"></i><p>Keine offenen Aufgaben</p></div>`;
  } else {
    offen.sort((a,b)=>prioPrio(a.prio)-prioPrio(b.prio)).forEach(a=>h+=taskHTML(a));
    if(erledigt.length){
      h+=`<div class="s-hdr" style="margin-top:16px"><div class="s-title" style="font-size:14px;color:var(--ink-40)">Erledigt (${erledigt.length})</div></div>`;
      erledigt.slice(0,8).forEach(a=>h+=taskHTML(a));
    }
  }
  h+=`</div>
  <div id="auf-maengel" style="display:none">`;
  if(!maengel.length){h+=`<div class="empty"><i class="ti ti-mood-smile"></i><p>Keine Mängel erfasst</p></div>`;}
  else maengel.sort((a,b)=>new Date(b.erstellt)-new Date(a.erstellt)).forEach(m=>h+=mangelHTML(m));
  h+=`</div><div id="auf-einkauf" style="display:none"><div id="einkaufListeContent"></div></div>`;
  el.innerHTML=h;
  updateBadge();
}

function aufgabenTab(t,btn){
  document.querySelectorAll('#page-aufgaben .tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  ['todos','maengel','einkauf'].forEach(x=>{
    const el=document.getElementById('auf-'+x);
    if(el) el.style.display=x===t?'block':'none';
  });
  window._aufTab=t;
  if(t==='einkauf') renderEinkaufsliste();
}

async function refreshAufgaben(){
  if(curPage==='aufgaben') await renderAufgaben();
  await updateBadge();
}

async function updateBadge(){
  const myObj=await getMyObjekte();
  const myIds=myObj.map(o=>o.id);
  const auf=(await idbGetAll('aufgaben')).filter(a=>myIds.includes(a.objektId)&&a.status!=='erledigt');
  const mng=(await idbGetAll('maengel')).filter(m=>myIds.includes(m.objektId)&&m.status!=='behoben');
  const n=auf.length+mng.length;
  const badge=document.getElementById('navBadge');
  if(badge){badge.style.display=n?'flex':'none';badge.textContent=n>99?'99+':n;}
}

async function toggleAufgabe(id){
  const a=await idbGet('aufgaben',id); if(!a) return;
  a.status=a.status==='erledigt'?'offen':'erledigt';
  a.erledigtAm=a.status==='erledigt'?new Date().toLocaleDateString('de-DE'):'';
  await idbPut('aufgaben',a); bcSend('aufgabe_changed',{id});
  await refreshAufgaben(); if(curPage==='objekt') await renderObjTab('aufgaben');
  toast('Status aktualisiert');
}
async function deleteAufgabe(id){
  await idbDelete('aufgaben',id); bcSend('aufgabe_changed',{id});
  await refreshAufgaben(); if(curPage==='objekt') await renderObjTab('aufgaben');
  toast('Aufgabe gelöscht');
}
async function toggleMangel(id){
  let store='maengel';
  let m=await idbGet('maengel',id);
  if(!m){ m=await idbGet('reparaturen',id).catch(()=>null); if(m) store='reparaturen'; }
  if(!m) return;
  const done=m.status==='behoben'||m.status==='erledigt';
  m.status=done?'offen':(store==='reparaturen'?'erledigt':'behoben');
  await idbPut(store,m); bcSend('mangel_changed',{id});
  await refreshAufgaben(); if(curPage==='objekt') await renderObjTab('maengel');
  await renderDash(); toast('Status aktualisiert');
}
async function deleteMangel(id){
  let store='maengel';
  if(!(await idbGet('maengel',id))){ if(await idbGet('reparaturen',id).catch(()=>null)) store='reparaturen'; }
  await idbDelete(store,id); bcSend('mangel_changed',{id});
  await refreshAufgaben(); toast('Mangel gelöscht');
}
async function toggleReparatur(id){
  const r=await idbGet('reparaturen',id); if(!r) return;
  r.status=r.status==='erledigt'?'ausstehend':'erledigt';
  await idbPut('reparaturen',r); await refreshAufgaben(); toast('Status aktualisiert');
}
async function deleteReparatur(id){
  await idbDelete('reparaturen',id); await refreshAufgaben(); toast('Reparatur gelöscht');
}



/* ═══════════════════════════════════════════════════════════
   BENACHRICHTIGUNGEN – Fällige Aufgaben
═══════════════════════════════════════════════════════════ */
async function checkFaelligeAufgaben() {
  if (!('Notification' in window)) return;
  const myObj = await getMyObjekte();
  const myIds = myObj.map(o=>o.id);
  const heute = today();
  const morgen = new Date(); morgen.setDate(morgen.getDate()+1);
  const morgenStr = morgen.toISOString().split('T')[0];

  const aufgaben = (await idbGetAll('aufgaben'))
    .filter(a => myIds.includes(a.objektId) && a.status !== 'erledigt' && a.datum);

  const faellig = aufgaben.filter(a => a.datum <= heute);
  const morgenFaellig = aufgaben.filter(a => a.datum === morgenStr);

  if (faellig.length === 0 && morgenFaellig.length === 0) return;

  if (Notification.permission === 'granted') {
    if (faellig.length > 0) {
      new Notification('⚠️ Nadig Pfau – Fällige Aufgaben', {
        body: faellig.length === 1
          ? `„${faellig[0].titel}" ist fällig`
          : `${faellig.length} Aufgaben sind fällig oder überfällig`,
        icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"%3E%3Crect width="192" height="192" rx="32" fill="%230D1F2D"/%3E%3Crect x="46" y="64" width="42" height="64" rx="5" fill="%23C97B3A"/%3E%3C/svg%3E',
        badge: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Ccircle cx="32" cy="32" r="32" fill="%23C97B3A"/%3E%3C/svg%3E',
        tag: 'faellig',
      });
    }
    if (morgenFaellig.length > 0) {
      new Notification('📅 Nadig Pfau – Morgen fällig', {
        body: morgenFaellig.length === 1
          ? `„${morgenFaellig[0].titel}" wird morgen fällig`
          : `${morgenFaellig.length} Aufgaben werden morgen fällig`,
        icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"%3E%3Crect width="192" height="192" rx="32" fill="%230D1F2D"/%3E%3Crect x="46" y="64" width="42" height="64" rx="5" fill="%23C97B3A"/%3E%3C/svg%3E',
        tag: 'morgen',
      });
    }
  } else if (Notification.permission === 'default') {
    // Zeige einen In-App-Banner
    showFaelligBanner(faellig.length + morgenFaellig.length);
  }
}

function showFaelligBanner(anzahl) {
  let banner = document.getElementById('faelligBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'faelligBanner';
    banner.style.cssText = 'position:fixed;top:56px;left:0;right:0;background:var(--amber);color:#fff;font-size:13px;font-weight:500;padding:10px 14px;z-index:100;display:flex;align-items:center;gap:10px;cursor:pointer';
    banner.onclick = () => {
      Notification.requestPermission().then(p => {
        if (p === 'granted') checkFaelligeAufgaben();
        banner.remove();
      });
    };
    document.body.appendChild(banner);
  }
  banner.innerHTML = `<i class="ti ti-bell" style="font-size:16px;flex-shrink:0"></i>
    <span>${anzahl} fällige Aufgabe${anzahl!==1?'n':''} · Tippen für Benachrichtigungen</span>
    <button onclick="event.stopPropagation();this.parentNode.remove()" style="margin-left:auto;background:none;border:none;color:#fff;font-size:18px;cursor:pointer">×</button>`;
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) {
    toast('Benachrichtigungen werden auf diesem Gerät nicht unterstützt');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    toast('✓ Benachrichtigungen aktiviert');
    await checkFaelligeAufgaben();
    // Tägliche Prüfung einrichten
    localStorage.setItem('notif_enabled', '1');
  } else {
    toast('Benachrichtigungen wurden abgelehnt');
  }
}

// Tägliche Prüfung beim App-Start
function initNotifications() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    checkFaelligeAufgaben();
    // Alle 4 Stunden prüfen
    setInterval(checkFaelligeAufgaben, 4 * 60 * 60 * 1000);
  } else {
    // Nach kurzer Verzögerung Banner zeigen
    setTimeout(async () => {
      const myObj = await getMyObjekte();
      const myIds = myObj.map(o=>o.id);
      const heute = today();
      const aufgaben = (await idbGetAll('aufgaben'))
        .filter(a => myIds.includes(a.objektId) && a.status !== 'erledigt' && a.datum && a.datum <= heute);
      if (aufgaben.length > 0) showFaelligBanner(aufgaben.length);
    }, 2000);
  }
}

/* ═══════════════════════════════════════════════════════════
   MIETER-ARCHIV: erzeugte Schreiben automatisch beim Mieter ablegen
   Speichert generiertes HTML als druckbares Dokument im 'dokumente'-Store
   (vorhandener mieterId-Index). So bleibt jedes Schreiben pro Mieter
   abrufbar und weiterleitbar – auch für ausgezogene (Vor-)Mieter.
═══════════════════════════════════════════════════════════ */
async function archiviereMieterDokument({mieterId, objektId, typ, name, html, mimeType}) {
  if (!mieterId) return null;
  try {
    const entry = {
      id: uid(),
      objektId: objektId || null,
      mieterId,
      typ: typ || 'sonstiges',
      name: name || 'Dokument',
      erstellt: now(),
      ersteller: CU?.name || '',
      mimeType: mimeType || (html ? 'text/html' : 'application/octet-stream'),
    };
    if (html) {
      // HTML als selbsttragendes, druckbares Dokument als Data-URL ablegen
      entry.data = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
      entry.size = new Blob([html]).size;
      entry.istHtml = true;
    }
    await idbPut('dokumente', entry);
    clearTimeout(window._syncTimer);
    window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
    return entry.id;
  } catch (e) {
    console.warn('Archivierung fehlgeschlagen:', e);
    return null;
  }
}

// Archiviertes HTML-Dokument in neuem Fenster öffnen (Ansicht / Druck / Weiterleitung)
async function openArchivDok(id) {
  const d = await idbGet('dokumente', id);
  if (!d || !d.data) return;
  if (d.istHtml) {
    const html = decodeURIComponent(d.data.replace(/^data:text\/html;charset=utf-8,/, ''));
    const ok = printViaIframe(html);
    if (!ok) {
      const win = window.open('', '_blank');
      if (win) { win.document.write(html); win.document.close(); }
    }
  } else {
    downloadDok(id);
  }
}

async function renderDokumente(el, objektId, mieterId) {
  const alle = await idbGetAll('dokumente');
  const docs = mieterId
    ? alle.filter(d=>d.mieterId===mieterId)
    : alle.filter(d=>d.objektId===objektId && !d.mieterId);

  const gruppeByTyp = {};
  DOK_TYPEN.forEach(t=>{ gruppeByTyp[t.val]=[]; });
  docs.forEach(d=>{ if(gruppeByTyp[d.typ]) gruppeByTyp[d.typ].push(d); else gruppeByTyp['sonstiges'].push(d); });

  let h = `<div class="s-hdr" style="margin-bottom:12px">
    <div class="s-title">Dokumente (${docs.length})</div>
    <button class="btn btn-sm btn-copper" onclick="modalUploadDok('${objektId}','${mieterId||''}')">
      <i class="ti ti-upload"></i> Hochladen
    </button>
  </div>`;

  if (!docs.length) {
    h += `<div class="empty"><i class="ti ti-files"></i><p>Noch keine Dokumente vorhanden.</p></div>`;
    el.innerHTML = h; return;
  }

  DOK_TYPEN.forEach(typ => {
    const list = gruppeByTyp[typ.val];
    if (!list.length) return;
    h += `<div class="card-hdr" style="margin:12px 0 6px"><i class="ti ${typ.icon}"></i> ${typ.label} (${list.length})</div>`;
    list.forEach(d => {
      const isImg = d.mimeType?.startsWith('image/');
      const isPdf = d.mimeType === 'application/pdf';
      const isHtmlDok = d.istHtml === true;
      h += `<div style="background:var(--white);border:1px solid var(--ink-10);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center">
        <div style="width:38px;height:38px;border-radius:8px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:var(--copper)">
          <i class="ti ${isImg?'ti-photo':isPdf?'ti-file-type-pdf':isHtmlDok?typ.icon:'ti-file'}"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</div>
          <div style="font-size:11px;color:var(--ink-40);margin-top:1px">${d.erstellt||''} · ${isHtmlDok?'Schreiben':fmtBytes(d.size||0)}</div>
          ${d.notiz?`<div style="font-size:11px;color:var(--ink-60);margin-top:2px;font-style:italic">${d.notiz}</div>`:''}
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          ${isImg?`<button class="btn btn-sm" onclick="openFoto('${d.id}','dok')"><i class="ti ti-eye"></i></button>`:''}
          ${isHtmlDok?`<button class="btn btn-sm" onclick="openArchivDok('${d.id}')" title="Öffnen / Drucken / Weiterleiten"><i class="ti ti-eye"></i></button>`:''}
          <button class="btn btn-sm" onclick="downloadDok('${d.id}')"><i class="ti ti-download"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteDok('${d.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    });
  });
  el.innerHTML = h;
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
