// Spielt einzeln gesicherte Fotos zurück in PD, falls ein Gesamt-Update zuvor
// abgebrochen wurde (z. B. OS-Kill nach Kamera-Nutzung). Ergänzt nur Fehlendes.
async function restoreFotosForPD(){
  if (!PD || !PD.id) return;
  let fotos = [];
  try { fotos = await idbGetAll('fotos', 'protId', PD.id); } catch(e){ console.warn('Foto-Wiederherstellung:', e); return; }
  if (!fotos.length) return;
  let ergaenzt = false;
  for (const fo of fotos) {
    if (!fo || !fo.slot || !fo.data) continue;
    if (fo.slot.startsWith('room:')) {
      const room = fo.slot.slice(5);
      if (PD.raeume && PD.raeume[room]) {
        PD.raeume[room].photoIds = PD.raeume[room].photoIds || [];
        if (!PD.raeume[room].photoIds.includes(fo.id)) {
          PD.raeume[room].photos = PD.raeume[room].photos || [];
          PD.raeume[room].photos.push(fo.data);
          PD.raeume[room].photoIds.push(fo.id);
          ergaenzt = true;
        }
      }
    } else if (fo.slot.startsWith('zaehler:')) {
      const idx = parseInt(fo.slot.slice(8), 10);
      if (PD.zaehler && PD.zaehler[idx] && PD.zaehler[idx].fotoId !== fo.id && !PD.zaehler[idx].foto) {
        PD.zaehler[idx].foto = fo.data;
        PD.zaehler[idx].fotoId = fo.id;
        ergaenzt = true;
      }
    }
  }
  if (ergaenzt) {
    try { await idbPut('protokolle', PD); } catch(e){ console.warn('Draft nach Wiederherstellung:', e); }
  }
}

async function startProt(){
  const objId=document.getElementById('pObjSel').value;
  const mietId=document.getElementById('pMietSel').value||null;
  const art=document.getElementById('pArt').value;
  closeModal();
  // Prüfe ob bereits ein Draft für dieses Objekt/Mieter existiert
  const bestehendeDrafts=(await idbGetAll('protokolle'))
    .filter(p=>p.status==='draft'&&p.objektId===objId&&(p.mieterId===mietId||(!p.mieterId&&!mietId)));
  if(bestehendeDrafts.length>0){
    const draft=bestehendeDrafts.sort((a,b)=>new Date(b.erstellt)-new Date(a.erstellt))[0];
    const step=draft._draftStep||0;
    if(confirm(`Es gibt einen gespeicherten Entwurf vom ${fmtDate(draft.datum)} (Schritt ${step+1}). Fortfahren?`)){
      PD={...draft};
      await restoreFotosForPD();
      renderProt(step);
      return;
    }
  }
  PD=await buildPD(objId,mietId,art);
  renderProt(0);
}

async function buildPD(objId,mietId,art){
  const obj=getObj(objId);
  const m=mietId?(await idbGet('mieter',mietId)):null;
  const tg=m?.tgNr?(await idbGet('tg',m.tgNr).catch(()=>null)):null;
  return {
    id:uid(),objektId:objId,mieterId:mietId,
    objektName:obj?.name||'',objektOrt:obj?.ort||'',
    weNr:m?.weNr||'',etage:m?.etage||'',
    mieterName:m?.mieter||'',mieterNeu:'',mietKontakt:m?.telefon||'',
    flaeche:m?.flaeche||'',art,
    datum:today(),uhrzeitStart:'',uhrzeitEnd:'',
    vermName:CU?.name||'',vermFunktion:CU?.role==='admin'?'Eigentümer / Hausverwaltung':'Hausmeister',
    zeugeName:'',zeugeFunktion:'',
    raeume:Object.fromEntries(ROOMS.map(r=>[r,{conditions:{},notes:'',photos:[]}])),
    zaehler:[{typ:'Stromzähler',nr:'',stand:'',einheit:'kWh'},{typ:'Gaszähler',nr:'',stand:'',einheit:'m³'},
             {typ:'Wasserzähler kalt',nr:'',stand:'',einheit:'m³'},{typ:'Wasserzähler warm',nr:'',stand:'',einheit:'m³'}],
    schluessel:{wohnung:2,haus:1,bk:1,keller:0,garage:0,sonstige:0},
    schluesselHinweis:'',
    tgNr:m?.tgNr||'',tgMiete:tg?.miete||'',
    schoenheit:'Nicht erforderlich',
    gesamtzustand:'Gut – ordnungsgemäß übergeben',
    vereinbarungen:'',
    sigVermieter:'',sigMieter:'',sigZeuge:'',
    status:'draft',erstellt:now(),
  };
}

function renderProt(step){
  nav('protokoll','Übergabeprotokoll',`Schritt ${step+1} / ${PROT_STEPS.length}`);
  pSigPads={};
  // Draft nach jedem Schritt automatisch speichern
  if (PD) {
    if (PD._adminEditOriginal) {
      // Admin bearbeitet ein archiviertes Protokoll: NICHT als Draft speichern,
      // damit es bei Abbruch nicht aus dem Archiv verschwindet. Status bleibt 'fertig'.
      PD._draftStep = step;
    } else {
      PD.status = 'draft';
      PD._draftStep = step;
      idbPut('protokolle', PD).catch(e=>console.warn('Draft-Speicherung:', e));
    }
  }

  let stepsH='';
  PROT_STEPS.forEach((s,i)=>{
    stepsH+=`<div class="step-dot ${i<step?'done':i===step?'cur':''}">
      <div class="step-circle">${i<step?'<i class="ti ti-check" style="font-size:10px"></i>':(i+1)}</div>
      <div class="step-lbl">${s}</div>
    </div>${i<PROT_STEPS.length-1?`<div class="step-line ${i<step?'done':''}"></div>`:''}`;
  });

  const nav2=`<div class="f-row" style="margin-top:20px">
    ${step>0?`<button class="btn btn-full" onclick="renderProt(${step-1})"><i class="ti ti-arrow-left"></i> Zurück</button>`:'<div></div>'}
    ${step<PROT_STEPS.length-1
      ?`<button class="btn btn-copper btn-full" onclick="renderProt(${step+1})">Weiter <i class="ti ti-arrow-right"></i></button>`
      :`<button class="btn btn-success btn-full btn-lg" onclick="finishProt()"><i class="ti ti-printer"></i> Abschließen & Drucken</button>`}
  </div>`;

  document.getElementById('page-protokoll').innerHTML=
    `<div class="steps">${stepsH}</div>`+getProtStep(step)+nav2;

  if(step===1) renderProtRaeume();
  if(step===5){ pSigPads={}; setTimeout(initSigs,200); }
}

  const allConds=condsForRoom(rn);

    PD.status='draft';

function setRoomCond(room,cond,val){PD.raeume[room].conditions[cond]=val;}
function setRoomCondFull(room,cond,val){
  PD.raeume[room].conditions[cond]=val;

  if(val==='Einwandfrei'||val==='Entfällt'){
    if(PD.raeume[room].condNotes) delete PD.raeume[room].condNotes[cond];

/* ── SIGNATUREN ── */
function initSigs(){
  ['sigV','sigM','sigZ'].forEach(id=>{
    const c=document.getElementById(id);
    if(!c||pSigPads[id]) return;
    const dpr=window.devicePixelRatio||1;
    const w=c.offsetWidth||320;
    c.width=w*dpr;c.height=180*dpr;
    c.style.width=w+'px';c.style.height='180px';
    const ctx=c.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.strokeStyle='#0D1F2D';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    let dn=false,lx=0,ly=0;
    const pos=e=>{const r=c.getBoundingClientRect();const s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top}};
    const start=e=>{e.preventDefault();dn=true;const p=pos(e);lx=p.x;ly=p.y;ctx.beginPath();ctx.arc(p.x,p.y,1,0,Math.PI*2);ctx.fillStyle='#0D1F2D';ctx.fill()};
    const move=e=>{e.preventDefault();if(!dn)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y};
    const end=e=>{e.preventDefault();dn=false;saveSigToMemory(id);};
    c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);c.addEventListener('mouseup',end);c.addEventListener('mouseleave',end);
    c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end,{passive:false});
    pSigPads[id]=true;
    // Bereits vorhandene Unterschrift (z. B. bei Admin-Bearbeitung) wieder einzeichnen
    restoreSigToCanvas(id);
  });
}

// Zeichnet eine in PD gespeicherte Unterschrift zurück auf das Canvas,
// damit sie bei der Admin-Bearbeitung erhalten bleibt und nicht neu erfasst werden muss.
function restoreSigToCanvas(id){
  if(!PD) return;
  const c=document.getElementById(id);
  if(!c) return;
  const key = id==='sigV'?'sigVermieter':id==='sigM'?'sigMieter':'sigZeuge';
  const dataUrl = PD[key];
  if(!dataUrl) return;
  const img=new Image();
  img.onload=()=>{
    const ctx=c.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    // In CSS-Pixeln zeichnen (Kontext ist bereits per scale(dpr) skaliert)
    ctx.drawImage(img, 0, 0, c.width/dpr, c.height/dpr);
  };
  img.src=dataUrl;
}

function clearSig(id){
  const c=document.getElementById(id);
  if(c){
    c.getContext('2d').clearRect(0,0,c.width,c.height);
    // Gespeicherte Sig löschen
    const key = id==='sigV'?'sigVermieter':id==='sigM'?'sigMieter':'sigZeuge';
    if(PD) PD[key]='';
  }
}

function saveSigToMemory(id) {
  if (!PD) return;
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  const data = ctx.getImageData(0,0,c.width,c.height).data;
  let hasContent = false;
  for(let px=0;px<data.length;px+=4){
    if(data[px+3]>0&&(data[px]<250||data[px+1]<250||data[px+2]<250)){hasContent=true;break;}
  }
  const key = id==='sigV'?'sigVermieter':id==='sigM'?'sigMieter':'sigZeuge';
  PD[key] = hasContent ? c.toDataURL('image/png') : '';
}

async function finishProt(){
  // Unterschriften final speichern (Fallback: nochmal aus Canvas lesen)
  ['sigV','sigM','sigZ'].forEach(id=>{
    saveSigToMemory(id);
    // Falls PD noch keine Sig hat, aus Canvas nachlesen
    const key = id==='sigV'?'sigVermieter':id==='sigM'?'sigMieter':'sigZeuge';
    if (!PD[key]) {
      const c=document.getElementById(id);
      if(c){
        const ctx=c.getContext('2d');
        const data=ctx.getImageData(0,0,c.width,c.height).data;
        let hasContent=false;
        for(let px=0;px<data.length;px+=4){
          if(data[px+3]>0&&(data[px]<250||data[px+1]<250||data[px+2]<250)){hasContent=true;break;}
        }
        PD[key]=hasContent?c.toDataURL('image/png'):'';
      }
    }
  });
  // Admin-Änderungen an einem bereits abgeschlossenen Protokoll erkennen und protokollieren
  if(PD._adminEditOriginal){
    const orig=PD._adminEditOriginal;
    const aend=PD.aenderungen||[];
    const wann=new Date().toLocaleString('de-DE');
    const von=CU?.name||'Admin';
    // Raumzustände vergleichen
    for(const rn of ROOMS){
      const oC=orig.raeume?.[rn]?.conditions||{};
      const nC=PD.raeume?.[rn]?.conditions||{};
      const keys=new Set([...Object.keys(oC),...Object.keys(nC)]);
      for(const c of keys){
        const a=oC[c]||'Einwandfrei', n=nC[c]||'Einwandfrei';
        if(a!==n) aend.push({feld:`${rn} – ${c}`, alt:a, neu:n, von, wann});
      }
    }
    // Vereinbarungen / Gesamtzustand
    if((orig.vereinbarungen||'')!==(PD.vereinbarungen||'')) aend.push({feld:'Vereinbarungen', alt:orig.vereinbarungen||'–', neu:PD.vereinbarungen||'–', von, wann});
    if((orig.gesamtzustand||'')!==(PD.gesamtzustand||'')) aend.push({feld:'Gesamtzustand', alt:orig.gesamtzustand||'–', neu:PD.gesamtzustand||'–', von, wann});
    // Zählerstände
    (orig.zaehler||[]).forEach((z,i)=>{
      const nz=PD.zaehler?.[i];
      if(nz && (z.stand||'')!==(nz.stand||'')) aend.push({feld:`Zähler ${z.typ}`, alt:z.stand||'–', neu:nz.stand||'–', von, wann});
    });
    PD.aenderungen=aend;
    delete PD._adminEditOriginal;
  }
  PD.status='fertig';PD.abgeschlossenAm=now();
  await idbPut('protokolle',PD);
  // Temporäre Einzelfoto-Sicherungen aufräumen (sind jetzt final im Protokoll enthalten)
  try {
    const tmp = await idbGetAll('fotos', 'protId', PD.id);
    for (const fo of tmp) await idbDelete('fotos', fo.id).catch(()=>{});
  } catch(e) { console.warn('Foto-Aufräumung:', e); }
  // Auto-Mängel aus Protokoll speichern (mit laufender Nummer, Bemerkung und Fotos)
  if(PD._autoMaengel?.length){
    for(const m of PD._autoMaengel){
      if(!m.nummer) m.nummer = await naechsteMangelNr(m.objektId);
      // Bemerkung aus dem Protokoll übernehmen (Titel = "Raum – Bauteil")
      const sep=m.titel.indexOf(' – ');
      if(sep>0){
        const room=m.titel.slice(0,sep);
        const cond=m.titel.slice(sep+3);
        const rd=PD.raeume?.[room];
        const note=rd?.condNotes?.[cond];
        if(note && note.trim()){
          m.beschreibung = note.trim();
        }
        // Zugehörige Raum-Fotos als Daten-URLs übernehmen
        if(rd?.photoIds?.length){
          m.fotos = m.fotos||[];
          for(const fid of rd.photoIds){
            try{ const fo=await idbGet('fotos', fid); if(fo?.data && !m.fotos.includes(fo.data)) m.fotos.push(fo.data); }catch(e){}
          }
        }
      }
      await idbPut('maengel',m);
    }
    toast(`Protokoll gespeichert ✓ – ${PD._autoMaengel.length} Mängel übernommen`);
  } else {
    toast('Protokoll gespeichert ✓');
  }
  bcSend('protokoll_saved',{id:PD.id});
  clearTimeout(window._syncTimer);
  window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  const fertigesPD = {...PD};
  // Wiederherstellungsmarker löschen (Protokoll ist abgeschlossen)
  try { localStorage.removeItem('openProtokoll'); } catch(e){}
  PD = null;
  // Erst ins Archiv navigieren, damit der Nutzer das gespeicherte Protokoll sieht
  await renderProtokollArchiv();
  nav('protokoll-archiv','Protokoll-Archiv','',false);
  toast('Protokoll im Archiv gespeichert ✓');
  // Dann drucken (nicht blockierend, im selben Tab via iframe)
  setTimeout(()=>printProtHTML(fertigesPD), 400);
}

async function editProtokoll(id){
  const p=await idbGet('protokolle',id);
  if(!p) return;
  // Fertige Protokolle: schreibgeschützte Ansicht. Nur Entwürfe direkt in den Wizard.
  if(p.status==='fertig'){ viewProtokoll(id); return; }
  PD={...p};pRoomIdx=0;
  if(p.status==='draft') await restoreFotosForPD();
  const step = p.status==='draft' ? (p._draftStep||0) : 0;
  renderProt(step);
}

async function viewProtokoll(id){
  const p=await idbGet('protokolle',id);
  if(!p) return;
  const obj=getObj(p.objektId);
  const istAdmin=CU?.role==='admin';
  const aenderungen=p.aenderungen||[];

  const condRows=(rn,rd)=>{

    const conds=condsForRoom(rn);

    for(const c of conds){
      const val=rd.conditions?.[c]||'Einwandfrei';
      const note=rd.condNotes?.[c]||'';
      if(val==='Einwandfrei'&&!note) continue;
      any=true;
      const col=val==='Beschädigt'?'var(--red)':val==='Einwandfrei'?'var(--green)':'var(--amber)';

      rows+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">`;

      rows+=`</div>`;

  };

  let roomsH='';
  for(const rn of ROOMS){ roomsH+=condRows(rn,p.raeume?.[rn]); }

  let zaehlerH='';

    </div>`;
  });

  const sig=(label,data)=>data?`<div style="flex:1;min-width:130px"><div style="font-size:11px;color:var(--ink-40);margin-bottom:4px">${label}</div><img src="${data}" style="width:100%;max-width:180px;border:1px solid var(--ink-10);border-radius:6px;background:#fff"></div>`:'';

  let aendH='';
  if(aenderungen.length){
    aendH=`<div style="margin-top:16px;padding:12px;border:1px solid var(--red);border-radius:10px;background:#fdecea">
      <div style="font-weight:700;font-size:13px;color:var(--red);margin-bottom:8px"><i class="ti ti-history"></i> Nachträgliche Änderungen</div>
      ${aenderungen.map(a=>`<div style="font-size:12px;color:var(--red);padding:3px 0;border-bottom:1px solid rgba(192,57,43,.15)">
        <strong>${esc(a.feld)}:</strong> „${esc(a.alt||'–')}" → „${esc(a.neu||'–')}"<br>
        <span style="font-size:11px;opacity:.8">geändert von ${esc(a.von)} am ${esc(a.wann)}</span>
      </div>`).join('')}
    </div>`;
  }

  showModal(`
    <div class="m-title"><i class="ti ti-clipboard-check"></i> Protokoll (archiviert)</div>
    <div style="font-size:12px;color:var(--ink-40);margin-bottom:6px">
      <span class="chip chip-ok" style="font-size:10px;padding:1px 6px">Abgeschlossen</span>
      Schreibgeschützt – nur Ansicht
    </div>
    <div style="font-size:13px;line-height:1.7;margin-bottom:12px">
      <strong>${esc(obj?.name||'')}</strong> · WE ${esc(p.weNr||'?')}<br>
      ${esc(p.mieterName||'–')} · ${esc(p.art||'Übergabe')}<br>
      Datum: ${fmtDate(p.datum)} · Abgeschlossen: ${esc(p.abgeschlossenAm||'–')}
    </div>
    <div class="card-hdr" style="margin:10px 0 6px"><i class="ti ti-door"></i> Räume & Zustand</div>
    ${roomsH||'<div style="font-size:12px;color:var(--ink-40)">Keine Angaben</div>'}
    ${zaehlerH?`<div class="card-hdr" style="margin:14px 0 6px"><i class="ti ti-gauge"></i> Zählerstände</div>${zaehlerH}`:''}
    ${p.notes||p.vereinbarungen?`<div class="card-hdr" style="margin:14px 0 6px"><i class="ti ti-note"></i> Anmerkungen</div><div style="font-size:12px;color:var(--ink-60)">${esc(p.vereinbarungen||'')}</div>`:''}
    ${(p.sigVermieter||p.sigMieter||p.sigZeuge)?`<div class="card-hdr" style="margin:14px 0 6px"><i class="ti ti-signature"></i> Unterschriften</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">${sig('Vermieter',p.sigVermieter)}${sig('Mieter',p.sigMieter)}${sig('Zeuge',p.sigZeuge)}</div>`:''}
    ${aendH}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <button class="btn btn-sm btn-copper" onclick="printProt('${id}')"><i class="ti ti-printer"></i> PDF / Drucken</button>
      ${istAdmin?`<button class="btn btn-sm" onclick="adminEditProtokoll('${id}')"><i class="ti ti-edit"></i> Ändern (Admin)</button>`:''}
      <button class="btn btn-sm" onclick="closeModal()">Schließen</button>
    </div>`);
}

// Admin-Bearbeitung eines fertigen Protokolls: Wizard öffnen, Originalzustand merken
async function adminEditProtokoll(id){
  const p=await idbGet('protokolle',id);
  if(!p){ return; }
  if(CU?.role!=='admin'){ toast('Nur Administratoren dürfen archivierte Protokolle ändern'); return; }
  if(!confirm('Dieses archivierte Protokoll bearbeiten? Änderungen werden rot protokolliert.')) return;
  closeModal();
  PD={...p};pRoomIdx=0;
  PD._adminEditOriginal = JSON.parse(JSON.stringify({
    raeume:p.raeume, zaehler:p.zaehler, vereinbarungen:p.vereinbarungen,
    gesamtzustand:p.gesamtzustand, schluessel:p.schluessel
  }));
  await restoreFotosForPD();
  renderProt(0);
}

}

// Druckt HTML zuverlässig im selben Tab (mobil-tauglich) via verstecktem iframe.
// Fallback auf window.open, falls iframe-Druck nicht greift.
function printViaIframe(html){
  try {
    const old = document.getElementById('printFrame');
    if (old) old.remove();
    const f = document.createElement('iframe');
    f.id = 'printFrame';
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(f);
    const fd = f.contentWindow.document;
    fd.open(); fd.write(html); fd.close();
    const doPrint = () => {
      try { f.contentWindow.focus(); f.contentWindow.print(); }
      catch(e){ console.warn('iframe-Druck:', e); }
    };
    // Warten bis Bilder geladen sind
    if (f.contentWindow.document.readyState === 'complete') setTimeout(doPrint, 500);
    else f.addEventListener('load', ()=>setTimeout(doPrint, 500));
    return true;
  } catch(e) {
    console.warn('printViaIframe fehlgeschlagen, Fallback window.open:', e);
    const win = window.open('', '_blank');
    if (!win) { toast('Druck nicht möglich – bitte Popups erlauben'); return false; }
    win.document.write(html); win.document.close();
    win.addEventListener('load', () => setTimeout(() => win.print(), 600));
    return true;
  }
}

    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const s = Math.min(maxW/img.width, maxH/img.height, 1);
        c.width = img.width*s; c.height = img.height*s;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => res(src);
      img.src = src;
    });
  }
  const win = { _html:'', document:{ write(s){ win._html+=s; }, close(){} } };
  const datum = d.datum ? new Date(d.datum).toLocaleDateString('de-DE') : d.datum||'–';

  const tgRow = d.tgNr ? `<tr><td style="padding:3px 8px;border:1px solid #dde;font-size:10px;background:#fff8f0">TG-Stellplatz Nr. ${d.tgNr} (Schlüssel/Chipkarte)</td><td style="padding:3px 8px;border:1px solid #dde;font-size:10px;font-weight:700;background:#fff8f0">übergeben</td></tr>` : '';

async function importExcel(input){
  const file=input.files[0]; if(!file) return;
  const el=document.getElementById('importStatus');
  el.innerHTML='<div style="color:var(--amber);font-size:13px"><i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Importiere...</div>';

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      let imported=0,tgCount=0;

      if(wb.SheetNames.includes('_APP_DATEN')){
        const ws=wb.Sheets['_APP_DATEN'];

        // Mieterdaten aus A4
        const raw=ws['A4']?.v;
        if(raw){
          const data=JSON.parse(raw);
          await idbClear('mieter');
          for(const r of data){
            if(!r.Mieter||r.Mieter==='') continue;
            const objId=OBJ_MAP[r.Objekt];
            if(!objId) continue;
            const id=`m_${objId}_${r['WE-Nr.']}_${(r.Mieter||'').replace(/\W/g,'').slice(0,10)}`;
            await idbPut('mieter',{
              id,objektId:objId,objekt:r.Objekt||'',
              weNr:String(r['WE-Nr.']||''),
              etage:r['Etage / Lage']||'',
              mieter:r.Mieter||'',
              miete:r['Miete (€)']||'',
              nk:r['NK-Vorauszahlung (€)']||'',
              gesamt:r['Gesamtmiete (€)']||'',
              flaeche:r['Wohnfläche (m²)']||'',
              einzug:r.Einzug||'',
              auszug:r.Auszug||'',
              kaution:r['Kaution (€)']||'',
              telefon:r.Telefon||'',
              email:r['E-Mail']||'',
              uebergabe:r['Übergabe']||'',
              krKlausel:r['KR-Klausel']||'',
              krHoehe:r['KR-Höhe (€)']||'',
              krProzent:r['KR-% Jahresmiete']||'',
              tgNr:r['TG-Stellplatz Nr.']||'',
            });
            imported++;
          }
        }

        // TG-Daten aus A6
        const rawTG=ws['A6']?.v;
        if(rawTG){
          await idbClear('tg');
          const tgData=JSON.parse(rawTG);
          for(const t of tgData){
            await idbPut('tg',{id:String(t.Nr),nr:t.Nr,mieter:t.Mieter,ab:t.Ab,miete:t['Miete (€)']});
            tgCount++;
          }
        }
      }

      const ts=new Date().toLocaleString('de-DE');
      await idbPut('settings',{id:'lastImport',value:`${imported} Mieter · ${tgCount} TG-Plätze · ${ts}`});
      el.innerHTML=`<div style="color:var(--green);font-size:13px"><i class="ti ti-circle-check"></i> ${imported} Mieter und ${tgCount} TG-Stellplätze importiert · ${ts}</div>`;
      bcSend('mieter_imported',{count:imported});
      await renderDash(); await updateBadge(); toast(`${imported} Mieter importiert ✓`);
    }catch(err){
      el.innerHTML=`<div style="color:var(--red);font-size:13px"><i class="ti ti-alert-circle"></i> Fehler: ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

  const el=document.getElementById('userListEl');
  if(!el) return;
  const users=await idbGetAll('users');
  el.innerHTML=users.map(u=>`
    <div class="user-item">
      <div class="user-av ${u.role==='admin'?'admin':''}"><i class="ti ti-user"></i></div>
      <div class="user-body">
        <div class="user-name">${u.name}</div>
        <div class="user-role">${u.role==='admin'?'Administrator':'Hausmeister'} · ${u.objekte?.length?u.objekte.map(g=>GRUPPE_LABEL[g]||g).join(', '):'alle Objekte'}</div>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-sm" onclick="modalEditUser('${u.id}')"><i class="ti ti-pencil"></i></button>

      </div>

/* ═══════════════════════════════════════════════════════════
   ONEDRIVE SYNC – OAuth2 PKCE
═══════════════════════════════════════════════════════════ */
const OD_CLIENT_ID  = '269324a3-2f44-4ab9-a8d5-280093a8271c';
const OD_REDIRECT   = 'https://deusnuntio.github.io/Immo-app-Nadig-Pfau/';
const OD_SCOPES     = 'Files.ReadWrite User.Read offline_access';
const OD_AUTH_URL   = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize';
const OD_TOKEN_URL  = 'https://login.microsoftonline.com/common/oauth2/v2.0/token';
const OD_FILE_URL   = 'https://graph.microsoft.com/v1.0/me/drive/root:/NadigPfau/immo_daten.json:/content';

let odTokens       = null;
let syncInProgress = false;
let lastSyncHash   = '';

// ── Token speichern/laden ─────────────────────────────────
function odSaveTokens(t) {
  odTokens = {
    access_token:  t.access_token,
    refresh_token: t.refresh_token || odTokens?.refresh_token || '',
    expires_at:    Date.now() + ((t.expires_in||3600) - 60) * 1000,
    user_name:     odTokens?.user_name || '',
  };
  try { localStorage.setItem('od_tokens', JSON.stringify(odTokens)); } catch(e) {}
};

function odLoadTokens() {
  try {
    const raw = localStorage.getItem('od_tokens');
    if (raw) odTokens = JSON.parse(raw);
  } catch(e) { odTokens = null; }
};

async function odGetToken() {
  if (!odTokens) return null;
  if (Date.now() < odTokens.expires_at) return odTokens.access_token;
  if (!odTokens.refresh_token) { odTokens = null; return null; }
  try {
    const r = await fetch(OD_TOKEN_URL, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        client_id: OD_CLIENT_ID, grant_type:'refresh_token',
        refresh_token: odTokens.refresh_token, scope: OD_SCOPES,
      }),
    });
    const t = await r.json();
    if (t.error) throw new Error(t.error_description||t.error);
    odSaveTokens(t);
    return odTokens.access_token;
  } catch(e) {
    console.warn('Token-Refresh fehlgeschlagen:', e.message);
    odTokens = null;
    try { localStorage.removeItem('od_tokens'); } catch(e2) {}
    setSyncStatus('offline');
    return null;
  }
};

// ── PKCE ─────────────────────────────────────────────────
async function pkceGen() {
  const arr = crypto.getRandomValues(new Uint8Array(32));
  const verifier = btoa(String.fromCharCode(...arr))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  return {verifier, challenge};
};

// ── Anmeldung ─────────────────────────────────────────────
async function msalLogin() {
  try {
    const {verifier, challenge} = await pkceGen();
    const state = crypto.getRandomValues(new Uint8Array(8))
      .reduce((s,b)=>s+b.toString(16).padStart(2,'0'),'');
    localStorage.setItem('od_pkce_v', verifier);
    localStorage.setItem('od_pkce_s', state);
    const params = new URLSearchParams({
      client_id: OD_CLIENT_ID, response_type:'code',
      redirect_uri: OD_REDIRECT, scope: OD_SCOPES,
      state, code_challenge: challenge, code_challenge_method:'S256',
      prompt:'select_account',
    });
    // Öffne Auth in neuem Fenster (funktioniert in PWA und Browser)
    const authWin = window.open(OD_AUTH_URL + '?' + params, '_blank',
      'width=500,height=650,scrollbars=yes');
    if (!authWin) {
      // Fallback: direkte Weiterleitung
      localStorage.setItem('od_pkce_redirect', '1');
      window.location.href = OD_AUTH_URL + '?' + params;
    }
  } catch(e) {
    toast('Anmeldung fehlgeschlagen: ' + e.message);
    console.error('msalLogin:', e);
  }
};

// ── OAuth-Code verarbeiten ────────────────────────────────
async function handleOAuthRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const state  = params.get('state');
  const error  = params.get('error');

  // URL sofort bereinigen
  if (code || error) {
    window.history.replaceState({}, '', window.location.pathname);
  }

  if (error) {
    console.warn('OAuth Fehler:', error, params.get('error_description'));
    toast('Microsoft-Anmeldung fehlgeschlagen: ' + (params.get('error_description')||error));
    return;
  }
  if (!code) return;

  const verifier  = localStorage.getItem('od_pkce_v');
  const savedState = localStorage.getItem('od_pkce_s');
  localStorage.removeItem('od_pkce_v');
  localStorage.removeItem('od_pkce_s');
  localStorage.removeItem('od_pkce_redirect');

  if (state !== savedState) {
    console.warn('State mismatch – möglicher CSRF-Angriff');
    return;
  }
  if (!verifier) {
    console.warn('PKCE Verifier fehlt');
    return;
  }

  setSyncStatus('pending');
  try {
    const r = await fetch(OD_TOKEN_URL, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        client_id: OD_CLIENT_ID, grant_type:'authorization_code',
        code, redirect_uri: OD_REDIRECT, code_verifier: verifier,
      }),
    });
    const t = await r.json();
    if (t.error) throw new Error(t.error_description||t.error);
    odSaveTokens(t);
    // Benutzernamen laden
    const me = await fetch('https://graph.microsoft.com/v1.0/me',
      {headers:{'Authorization':'Bearer '+odTokens.access_token}});
    const meData = await me.json();
    if (odTokens) {
      odTokens.user_name = meData.displayName || meData.userPrincipalName || '';
      try { localStorage.setItem('od_tokens', JSON.stringify(odTokens)); } catch(e) {}
    }
    setSyncStatus('ok');
    toast('✓ Mit OneDrive verbunden: ' + (odTokens.user_name||''));
    await syncFromOneDrive();
    renderSettings();
  } catch(e) {
    console.error('Token-Austausch:', e);
    setSyncStatus('offline');
    toast('Anmeldung fehlgeschlagen: ' + e.message);
  }
};

function msalLogout() {
  odTokens = null;
  try { localStorage.removeItem('od_tokens'); } catch(e) {}
  setSyncStatus('offline');
  toast('Microsoft-Konto abgemeldet');
  renderSettings();
};

// ── Sync zu OneDrive ──────────────────────────────────────
async function syncToOneDrive() {
  if (syncInProgress) return;
  const token = await odGetToken();
  if (!token) return;
  syncInProgress = true;
  setSyncStatus('pending');
  try {
    const backup = {};
    for (const s of ['users','mieter','tg','protokolle','aufgaben','maengel','reparaturen','settings','dokumente','nka_archiv','einkaufsliste','termine','wartung','zaehler','zaehlerstaende','versorger','lager','lager_anforderung','taetigkeit_kat','arbeitszeit','abwesenheit']) {
      backup[s] = await idbGetAll(s);
    }
    backup.updatedAt = now();
    backup.updatedBy = odTokens?.user_name || 'Unbekannt';
    const json = JSON.stringify(backup);
    const hash = json.length+'_'+json.slice(-30);
    if (hash === lastSyncHash) { setSyncStatus('ok'); syncInProgress=false; return; }
    const r = await fetch(OD_FILE_URL, {
      method:'PUT',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body: json,
    });
    if (!r.ok) throw new Error('HTTP '+r.status);
    lastSyncHash = hash;
    try { await idbPut('settings', { id:'lastSync', value: new Date().toISOString() }); } catch(e){}
    setSyncStatus('ok');
  } catch(e) {
    console.warn('Sync Upload:', e);
    setSyncStatus('offline');
  }
  syncInProgress = false;
};

// ── Sync von OneDrive ─────────────────────────────────────
async function syncFromOneDrive() {
  const token = await odGetToken();
  if (!token) return;
  setSyncStatus('pending');
  try {
    const r = await fetch(OD_FILE_URL,
      {headers:{'Authorization':'Bearer '+token}});
    if (r.status === 404) { await syncToOneDrive(); return; }
    if (!r.ok) throw new Error('HTTP '+r.status);
    const backup = await r.json();
    const remoteTime = backup.updatedAt||'';
    const ls = await idbGet('settings','lastSync').catch(()=>null);
    const localTime  = ls?.value||'';
    if (remoteTime > localTime) {
      // Merge: ID-basiert, nur übernehmen wenn remote neuer oder lokal fehlt
      const mergeStores = ['protokolle','aufgaben','maengel','reparaturen','dokumente','nka_archiv','einkaufsliste','wartung','termine','zaehler','zaehlerstaende','versorger','lager','lager_anforderung','taetigkeit_kat','arbeitszeit','abwesenheit'];
      for (const s of mergeStores) {
        if (!backup[s]) continue;
        for (const item of backup[s]) {
          if(!item || !item.id) continue;
          const local = await idbGet(s, item.id).catch(()=>null);
          const remoteStamp = item.geaendert||item.updatedAt||item.erstellt||'';
          const localStamp  = local ? (local.geaendert||local.updatedAt||local.erstellt||'') : '';
          if (!local || remoteStamp >= localStamp) {
            await idbPut(s, item);
          }
        }
      }
      // Stammdaten überschreiben
      for (const s of ['users','mieter','tg']) {
        if (backup[s]) { await idbClear(s); for (const item of backup[s]) await idbPut(s,item); }
      }
      await idbPut('settings',{id:'lastSync',value:remoteTime});
      await renderDash(); await updateBadge();
      toast('✓ Synchronisiert (' + (backup.updatedBy||'') + ')');
    }
    setSyncStatus('ok');
  } catch(e) {
    console.warn('Sync Download:', e);
    setSyncStatus('offline');
  }
};

/* ═══════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════ */
function uid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);}
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function today(){return new Date().toISOString().split('T')[0];}
function now(){return new Date().toLocaleString('de-DE');}
function fmtDate(v){
  if(!v) return '–';
  if(/^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v).toLocaleDateString('de-DE');
  return v;
}
function fmtEur(v){
  if(!v&&v!==0) return '–';
  if(isNaN(Number(v))) return String(v);
  return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
}
function initials(name){
  return (name||'').split(/[\s,]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
}
function prioPrio(p){return p==='hoch'?0:p==='mittel'?1:2;}
function toast(msg,dur=2400){
  const t=document.getElementById('toastEl');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

async function openFoto(src, caption='') {
  // Dokument-ID? Dann Bild aus IDB laden
  if (caption === 'dok' && src && !src.startsWith('data:')) {
    const d = await idbGet('dokumente', src).catch(()=>null);
    if (d) { src = d.data; caption = d.name; }
  }
  // Zählerstand-Foto aus IDB laden
  if (caption === 'zaehlerstand' && src && !src.startsWith('data:')) {
    const s = await idbGet('zaehlerstaende', src).catch(()=>null);
    if (s) { src = s.foto; caption = `Zählerstand ${s.wert} ${s.einheit||''} · ${s.datum||''}`; }
  }
  // Lager-Artikelfoto aus IDB laden
  if (caption === 'lager' && src && !src.startsWith('data:')) {
    const a = await idbGet('lager', src).catch(()=>null);
    if (a) { src = a.foto; caption = a.bezeichnung||'Artikel'; }
  }
  window._currentFoto = src;
  window._currentFotoName = caption || 'Foto';
  document.getElementById('fotoOverlayImg').src = src;
  document.getElementById('fotoOverlayCaption').textContent = caption;
  document.getElementById('fotoOverlay').classList.add('open');
}
function closeFotoOverlay() {
  document.getElementById('fotoOverlay').classList.remove('open');
}

// Foto über das native Teilen-Menü weiterleiten (Mail, WhatsApp, etc.)
async function shareFoto(){
  const src = window._currentFoto;
  if(!src){ toast('Kein Foto ausgewählt'); return; }
  try {
    const res = await fetch(src);
    const blob = await res.blob();
    const name = (window._currentFotoName||'Foto').replace(/[^a-zA-Z0-9äöüÄÖÜ _-]/g,'').slice(0,40) || 'Foto';
    const file = new File([blob], name+'.jpg', { type: blob.type||'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title: name });
      return;
    }
    // Fallback: Bild herunterladen, wenn Datei-Teilen nicht geht
    const a = document.createElement('a');
    a.href = src; a.download = name+'.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Foto heruntergeladen – kann jetzt weitergeleitet werden');
  } catch(e) {
    if (e && e.name === 'AbortError') return; // Nutzer hat abgebrochen
    console.warn('Teilen:', e);
    toast('Teilen nicht möglich – Foto wird heruntergeladen');
    try { const a=document.createElement('a'); a.href=src; a.download='Foto.jpg'; a.click(); } catch(_){}
  }
}

function highlightQ(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark style="background:var(--copper-bg);color:var(--copper-d);border-radius:2px">$1</mark>');
}

/* ═══════════════════════════════════════════════════════════
   MANGEL DETAIL – vollständig mit Foto-Galerie & Bearbeiten
═══════════════════════════════════════════════════════════ */
async function showMangelDetail(id, store='maengel') {
  const m = await idbGet(store, id);
  if (!m) { // auch in reparaturen suchen
    const r = await idbGet('reparaturen', id).catch(()=>null);
    if (r) { showMangelDetail(id, 'reparaturen'); return; }
    return;
  }
  const obj = getObj(m.objektId);
  const mieter = m.mieterId ? (await idbGet('mieter', m.mieterId).catch(()=>null)) : null;
  const kommentare = m.kommentare || [];
  const done = m.status==='behoben'||m.status==='erledigt';

  // L7: bereits für diesen Mangel verbuchtes Material sammeln
  let materialHTML='';
  try{
    const alleArtikel=await getLagerArtikel();
    const verwendet=[];
    for(const art of alleArtikel){
      (art.entnahmen||[]).forEach(e=>{ if(e.mangelId===id) verwendet.push({name:art.bezeichnung, menge:e.menge, datum:e.datum, von:e.von}); });
    }
    const offeneAnf=(await idbGetAll('lager_anforderung')).filter(x=>x.mangelId===id&&x.status==='offen');
    if(verwendet.length||offeneAnf.length){
      materialHTML=`<div class="card-hdr" style="margin-bottom:8px"><i class="ti ti-package"></i> Material</div><div style="margin-bottom:12px">`;
      verwendet.forEach(v=>{ materialHTML+=`<div style="font-size:13px;padding:5px 0;border-bottom:1px solid var(--ink-10)">
        <i class="ti ti-package-export" style="font-size:12px;color:var(--copper)"></i> ${v.menge}× ${v.name}
        <span style="color:var(--ink-40);font-size:11px"> · ${v.datum}${v.von?' · '+v.von:''}</span></div>`; });
      offeneAnf.forEach(x=>{ materialHTML+=`<div style="font-size:13px;padding:5px 0;border-bottom:1px solid var(--ink-10);color:#0E7C7B">
        <i class="ti ti-truck-delivery" style="font-size:12px"></i> angefordert: ${x.menge?x.menge+'× ':''}${x.artikelName} <span style="font-size:11px">(${x.standortLabel})</span></div>`; });
      materialHTML+=`</div>`;
    }
  }catch(e){}

  // Arbeitszeit, die auf diesen Mangel gebucht wurde
  let zeitHTML='';
  try{
    const sitzungen=await idbGetAll('arbeitszeit');
    const eintraege=[];
    let summeMin=0;
    for(const s of (sitzungen||[])){
      for(const seg of (s.segmente||[])){
        if(seg.mangelId===id && seg.ende){
          const min=Math.round((new Date(seg.ende)-new Date(seg.start))/60000);
          summeMin+=min;
          eintraege.push({min, datum:s.datum, von:s.userName||'', kat:seg.katName});
        }
      }
    }
    if(eintraege.length){
      zeitHTML=`<div class="card-hdr" style="margin-bottom:8px"><i class="ti ti-clock"></i> Arbeitszeit (${fmtDauer(summeMin)})</div><div style="margin-bottom:12px">`;
      eintraege.forEach(e=>{ zeitHTML+=`<div style="font-size:13px;padding:5px 0;border-bottom:1px solid var(--ink-10)">
        <i class="ti ti-clock-hour-4" style="font-size:12px;color:var(--copper)"></i> ${fmtDauer(e.min)} · ${e.kat}
        <span style="color:var(--ink-40);font-size:11px"> · ${e.datum}${e.von?' · '+e.von:''}</span></div>`; });
      zeitHTML+=`</div>`;
    }
  }catch(e){}
  materialHTML += zeitHTML;

  showModal(`
    <div class="m-title"><i class="ti ti-${m.type==='reparatur'||m.istReparatur?'tools':'alert-triangle'}" style="color:${done?'var(--green)':'var(--red)'}"></i>
      ${m.nummer?esc(m.nummer)+' · ':''}${esc(m.titel)}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <span class="status-badge ${done?'sb-behoben':'sb-offen'}" onclick="toggleMangelFromDetail('${id}','${store}')">
        <i class="ti ti-${done?'circle-check':'circle'}"></i>
        ${done?(m.type==='reparatur'||m.istReparatur?'Erledigt':'Behoben'):'Offen'} · Tippen zum Ändern
      </span>
      ${(m.istReparatur||m.type==='reparatur')?`<span class="chip chip-copper"><i class="ti ti-tools" style="font-size:11px"></i> Reparatur</span>`:''}
      <span class="chip chip-${m.schwere==='schwerwiegend'?'err':m.schwere==='mittel'?'warn':'ok'}">${esc(m.schwere||'–')}</span>
      ${m.kosten?`<span class="chip chip-copper">${fmtEur(m.kosten)}</span>`:''}
    </div>
    ${(m.kostenTeile||m.kostenArbeit)?`<div style="font-size:13px;color:var(--ink-60);margin-bottom:12px;padding:8px 12px;background:var(--ink-05);border-radius:8px">
      ${m.kostenTeile?`Material: <strong>${fmtEur(m.kostenTeile)}</strong>`:''}
      ${m.kostenArbeit?`${m.kostenTeile?' · ':''}Arbeit: <strong>${fmtEur(m.kostenArbeit)}</strong>${m.stunden&&m.stundensatz?` (${m.stunden} h × ${fmtEur(m.stundensatz)})`:''}`:''}
      ${m.kosten?` · Gesamt: <strong>${fmtEur(m.kosten)}</strong>`:''}
    </div>`:''}
    <div style="font-size:13px;color:var(--ink-40);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap">
      <span><i class="ti ti-building" style="font-size:12px"></i> ${obj?.name||'–'}</span>
      ${mieter?`<span><i class="ti ti-user" style="font-size:12px"></i> ${mieter.mieter} · WE ${mieter.weNr}</span>`:''}
      <span><i class="ti ti-calendar" style="font-size:12px"></i> ${m.datum||m.erstellt||'–'}</span>
      <span><i class="ti ti-user-circle" style="font-size:12px"></i> ${m.ersteller||'–'}</span>
    </div>
    ${m.beschreibung?`<div style="background:var(--ink-05);border-radius:8px;padding:10px;font-size:13px;color:var(--ink);margin-bottom:12px;line-height:1.6">${m.beschreibung}</div>`:''}

    ${m.fotos?.length ? `
    <div class="card-hdr" style="margin-bottom:8px"><i class="ti ti-photo"></i> Fotos (${m.fotos.length})</div>
    <div class="foto-gallery">
      ${m.fotos.map((f,i)=>`<div class="foto-item" onclick="openFoto('${f}','Foto ${i+1} – ${m.titel}')">
        <img src="${f}" loading="lazy">
      </div>`).join('')}
    </div>` : ''}

    ${materialHTML}
    <div class="card-hdr" style="margin-bottom:8px"><i class="ti ti-message"></i> Kommentare (${kommentare.length})</div>
    ${kommentare.length ? `<div class="comment-box" style="margin-bottom:10px">
      ${kommentare.map(k=>`<div class="comment-item">
        <div class="comment-meta">${k.autor||'–'} · ${k.datum||'–'}</div>
        <div class="comment-text">${k.text}</div>
      </div>`).join('')}
    </div>` : `<div style="font-size:13px;color:var(--ink-40);margin-bottom:10px">Noch keine Kommentare</div>`}

    <div style="display:flex;gap:7px;margin-bottom:14px">
      <input type="text" id="kommentarInput" placeholder="Kommentar hinzufügen..." style="flex:1;padding:9px 12px;border:1.5px solid var(--ink-10);border-radius:var(--radius);font-size:14px;font-family:var(--font)">
      <button class="btn btn-copper" onclick="addKommentar('${id}','${store}')"><i class="ti ti-send"></i></button>
    </div>

    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn btn-sm ${done?'':'btn-success'}" onclick="toggleMangelFromDetail('${id}','${store}')">
        <i class="ti ti-${done?'rotate-ccw':'check'}"></i> ${done?'Wieder öffnen':'Als erledigt markieren'}
      </button>
      <button class="btn btn-sm" onclick="editMangel('${id}','${store}')"><i class="ti ti-pencil"></i> Bearbeiten</button>
      <button class="btn btn-sm" onclick="materialFuerMangel('${id}','${store}')"><i class="ti ti-package"></i> Material</button>
      <button class="btn btn-sm" onclick="modalAddEinkauf('${id}','Mangel','',{objektId:'${m.objektId||''}',weNr:'${esc(m.weNr||'')}',bezugText:'${esc((m.nummer?m.nummer+' · ':'')+m.titel)}'})"><i class="ti ti-shopping-cart"></i></button>
      <button class="btn btn-sm btn-danger" onclick="deleteMangelConfirm('${id}','${store}')"><i class="ti ti-trash"></i></button>
    </div>`);
}

async function addKommentar(id, store) {
  const input = document.getElementById('kommentarInput');
  const text  = input?.value.trim();
  if (!text) return;
  const m = await idbGet(store, id);
  if (!m) return;
  if (!m.kommentare) m.kommentare = [];
  m.kommentare.push({ autor: CU?.name||'–', datum: now(), text });
  await idbPut(store, m);
  await showMangelDetail(id, store);
  toast('Kommentar gespeichert');
}

async function toggleMangelFromDetail(id, store) {
  const m = await idbGet(store, id);
  if (!m) return;
  const doneVal = store==='reparaturen' ? 'erledigt' : 'behoben';
  m.status = m.status===doneVal ? 'offen' : doneVal;
  if (!m.kommentare) m.kommentare = [];
  m.kommentare.push({ autor:CU?.name||'–', datum:now(), text:`Status geändert zu: ${m.status}` });
  await idbPut(store, m);
  bcSend('mangel_changed', {id});
  await showMangelDetail(id, store);
  await refreshAufgaben(); await renderDash();
  toast('Status geändert ✓');
}

async function editMangel(id, store) {
  const m = await idbGet(store, id);
  if (!m) return;
  closeModal();
  const istRep = m.istReparatur||m.type==='reparatur';
  showModal(`
    <div class="m-title"><i class="ti ti-pencil"></i> Bearbeiten${m.nummer?' · '+esc(m.nummer):''}</div>
    <div class="f"><label>Bezeichnung</label><input type="text" id="em_titel" value="${esc(m.titel)}"></div>
    <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ink-05);border-radius:10px;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="em_istRep" ${istRep?'checked':''} style="width:18px;height:18px;flex-shrink:0">
      <span style="font-size:13px">Dies ist eine <strong>Kleinreparatur</strong></span>
    </label>
    <div class="f-row">
      <div class="f"><label>Schwere</label><select id="em_schwere">
        ${['gering','mittel','schwerwiegend'].map(v=>`<option ${m.schwere===v?'selected':''}>${v}</option>`).join('')}
      </select></div>
      <div class="f"><label>Materialkosten Teile (€)</label><input type="number" id="em_teile" value="${m.kostenTeile||''}" step="0.01" oninput="emKostenUpdate()"></div>
    </div>
    <div class="f-row">
      <div class="f"><label>Arbeitsstunden</label><input type="number" id="em_stunden" value="${m.stunden||''}" step="0.25" oninput="emKostenUpdate()"></div>
      <div class="f"><label>Stundensatz (€/h)</label><input type="number" id="em_satz" value="${m.stundensatz||''}" step="0.01" oninput="emKostenUpdate()"></div>
    </div>
    <div id="em_kostenSum" style="font-size:13px;color:var(--ink-60);margin-bottom:12px;padding:8px 12px;background:var(--ink-05);border-radius:8px;display:none"></div>
    <div class="f"><label>Beschreibung</label><textarea id="em_beschr">${esc(m.beschreibung||'')}</textarea></div>
    <div class="f"><label>Fotos</label>
      <div id="em_fotoGrid" style="display:${(m.fotos&&m.fotos.length)?'grid':'none'};grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px"></div>
      <div style="display:flex;gap:6px">
        <button class="btn" style="flex:1" onclick="openCamMangelEdit()"><i class="ti ti-camera"></i> Foto aufnehmen</button>
        <button class="btn" style="flex:1" onclick="document.getElementById('em_fotoIn').click()"><i class="ti ti-photo"></i> Aus Galerie</button>
      </div>
      <input type="file" id="em_fotoIn" accept="image/*" style="display:none" onchange="onMangelEditFoto(this)">
    </div>
    <div class="f-row">
      <button class="btn btn-copper btn-full" onclick="saveEditMangel('${id}','${store}')"><i class="ti ti-check"></i> Speichern</button>
      <button class="btn btn-full" onclick="closeModal()">Abbrechen</button>
    </div>`);
  window._emFotos = (m.fotos||[]).slice();
  renderEmFotoGrid();
  emKostenUpdate();
}

function renderEmFotoGrid(){
  const grid=document.getElementById('em_fotoGrid');
  if(!grid) return;
  const fotos=window._emFotos||[];
  if(!fotos.length){ grid.style.display='none'; grid.innerHTML=''; return; }
  grid.style.display='grid';
  grid.innerHTML=fotos.map((f,i)=>`<div style="position:relative">
    <img src="${f}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--ink-10)">
    <button onclick="delEmFoto(${i})" style="position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:#C0392B;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center">&times;</button>
  </div>`).join('');
}

function delEmFoto(i){
  window._emFotos=(window._emFotos||[]).filter((_,idx)=>idx!==i);
  renderEmFotoGrid();
}

async function onMangelEditFoto(input){
  const file=input.files[0]; if(!file) return;
  window._mangelEditCamActive=false;
  const data=await compressFoto(file, 1400, 0.78);
  window._emFotos=window._emFotos||[];
  window._emFotos.push(data);
  renderEmFotoGrid();
}

// In-App-Kamera für Mangel-Bearbeitung (kein PWA-Reload)
function openCamMangelEdit(){
  pPhotoRoom=null; window._zaehlerIdx=null; window._mangelPhotos=null; window._lagerCamActive=false;
  window._mangelEditCamActive=true;
  if(typeof openCam==='function'){ openCam(); }
  else { document.getElementById('em_fotoIn')?.click(); }
}

function emKostenUpdate(){
  const teile=parseFloat(document.getElementById('em_teile')?.value)||0;
  const std=parseFloat(document.getElementById('em_stunden')?.value)||0;
  const satz=parseFloat(document.getElementById('em_satz')?.value)||0;
  const arbeit=std*satz, sum=teile+arbeit;
  const el=document.getElementById('em_kostenSum');
  if(!el) return;
  if(teile||arbeit){ el.style.display='block';
    el.innerHTML=`Material: <strong>${fmtEur(teile)}</strong> · Arbeit: <strong>${fmtEur(arbeit)}</strong> · Gesamt: <strong>${fmtEur(sum)}</strong>`;
  } else el.style.display='none';
}

async function saveEditMangel(id, store) {
  const m = await idbGet(store, id);
  if (!m) return;
  m.titel       = document.getElementById('em_titel').value.trim() || m.titel;
  m.schwere     = document.getElementById('em_schwere').value;
  m.beschreibung= document.getElementById('em_beschr').value;
  m.istReparatur= document.getElementById('em_istRep')?.checked||false;
  m.type        = m.istReparatur?'reparatur':'mangel';
  const teile   = parseFloat(document.getElementById('em_teile').value)||0;
  const stunden = parseFloat(document.getElementById('em_stunden').value)||0;
  const satz    = parseFloat(document.getElementById('em_satz').value)||0;
  m.kostenTeile = teile||null; m.stunden=stunden||null; m.stundensatz=satz||null;
  m.kostenArbeit= (stunden*satz)||null;
  m.kosten      = (teile+stunden*satz)||null;
  m.fotos       = window._emFotos || m.fotos || [];
  m.bearbeitetAm = now(); m.bearbeitetVon = CU?.name||'';
  await idbPut(store, m);
  window._emFotos=null;
  closeModal(); toast('Gespeichert ✓');
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  await refreshAufgaben(); await renderDash();
}

async function deleteMangelConfirm(id, store) {
  if (!confirm('Eintrag wirklich löschen?')) return;
  await idbDelete(store, id);
  closeModal(); bcSend('mangel_changed',{id});
  await refreshAufgaben(); await renderDash(); toast('Gelöscht');
}

═══════════════════════════════════════════════════════════ */
function renderTodoList(aufg) {
  const el = document.getElementById('todos-list');
  if (!el) return;
  const f = filterState.aufgaben;
  const q = (document.getElementById('auf_todos_q')?.value || f.q || '').toLowerCase();

  let items = aufg;
  if (f.status && f.status !== 'offen' && ['hoch','mittel','niedrig'].includes(f.status)) {
    items = items.filter(a=>a.prio===f.status && a.status!=='erledigt');
  } else if (f.status === 'erledigt') {
    items = items.filter(a=>a.status==='erledigt');
  } else if (f.status === 'offen' || !f.status) {
    items = items.filter(a=>a.status!=='erledigt');
  }
  if (f.objId && f.objId !== 'all') items = items.filter(a=>a.objektId===f.objId);
  if (q) items = items.filter(a=>
    a.titel.toLowerCase().includes(q) ||
    (a.beschreibung||'').toLowerCase().includes(q) ||
    (getObj(a.objektId)?.name||'').toLowerCase().includes(q)
  );

  if (!items.length) {
    el.innerHTML = `<div class="no-results"><i class="ti ti-check"></i><p>${q?`Nichts gefunden für „${q}"`:f.status==='erledigt'?'Keine erledigten Aufgaben':'Keine offenen Aufgaben'}</p></div>`;
    return;
  }
  items.sort((a,b)=>prioPrio(a.prio)-prioPrio(b.prio));
  el.innerHTML = items.map(a=>taskHTML(a)).join('');
}

function renderMangelList(mangel) {
  const el = document.getElementById('mangel-list');
  if (!el) return;
  const f = filterState.maengel;
  const q = (document.getElementById('auf_mng_q')?.value || '').toLowerCase();
  let items = mangel;
  if (f.status && f.status!=='all') items=items.filter(m=>m.status===(f.status==='behoben'?'behoben':'offen'));
  if (f.objId && f.objId!=='all') items=items.filter(m=>m.objektId===f.objId);
  if (q) items=items.filter(m=>m.titel.toLowerCase().includes(q)||(m.beschreibung||'').toLowerCase().includes(q));
  items.sort((a,b)=>new Date(b.erstellt)-new Date(a.erstellt));
  el.innerHTML = items.length
    ? items.map(m=>mangelHTML(m)).join('')
    : `<div class="no-results"><i class="ti ti-mood-smile"></i><p>${f.status==='behoben'?'Keine behobenen Mängel':'Keine offenen Mängel'}</p></div>`;
}

function renderReparaturList(reps) {
  const el = document.getElementById('rep-list');
  if (!el) return;
  if (!reps.length) { el.innerHTML='<div class="empty"><i class="ti ti-tools"></i><p>Keine Reparaturen erfasst</p></div>'; return; }
  el.innerHTML = reps.sort((a,b)=>new Date(b.erstellt)-new Date(a.erstellt)).map(r=>reparaturHTML(r)).join('');
}

// Filter-Setter
function setAufgabenFilter(val,btn){
  filterState.aufgaben.status=val;
  document.querySelectorAll('#auf-todos .filter-chip').forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  idbGetAll('aufgaben').then(a=>renderTodoList(a));
}
function setAufgabenObjFilter(val,btn){
  filterState.aufgaben.objId=val;
  const row=btn?.parentNode;
  if(row) Array.from(row.children).forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  idbGetAll('aufgaben').then(a=>renderTodoList(a));
}
function filterTodos(){
  filterState.aufgaben.q=document.getElementById('auf_todos_q')?.value||'';
  idbGetAll('aufgaben').then(a=>renderTodoList(a));
}
function setMangelFilter(val,btn){
  filterState.maengel.status=val;
  document.querySelectorAll('#auf-maengel .filter-row:first-of-type .filter-chip').forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  idbGetAll('maengel').then(m=>renderMangelList(m));
}
function setMangelObjFilter(val,btn){
  filterState.maengel.objId=val;
  const row=btn?.parentNode;
  if(row) Array.from(row.children).forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  idbGetAll('maengel').then(m=>renderMangelList(m));
}
function filterMaengel(){
  idbGetAll('maengel').then(m=>renderMangelList(m));
}
function setReparaturFilter(val,btn){
  document.querySelectorAll('#auf-reparaturen .filter-chip').forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  idbGetAll('reparaturen').then(r=>{
    const filtered=val==='all'?r:r.filter(x=>x.status===val);
    renderReparaturList(filtered);
  });
}

    <div class="f-row">

        ${['niedrig','mittel','hoch'].map(v=>`<option ${a.prio===v?'selected':''}>${v}</option>`).join('')}
      </select></div>
      <div class="f"><label>Fällig am</label><input type="date" id="ea_datum" value="${a.datum||''}"></div>
    </div>

// Foto komprimieren (max 1200px, 75% Qualität) – verhindert App-Absturz bei großen Kamera-Fotos
function compressFoto(file, maxPx=1200, quality=0.75) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          const ratio = Math.min(maxPx/w, maxPx/h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// Verarbeitet ein fertiges (komprimiertes) Foto je nach aktivem Kontext.
async function processPhoto(data) {
    if (window._zsCamActive) {
      window._zsCamActive=false;
      window._zsFoto=data;
      zsFotoVorschau(data);
      if(document.getElementById('camOverlay')?.style.display==='flex') closeCam();
      toast('Foto aufgenommen ✓');
      return;
    }
    if (window._mangelEditCamActive) {
      window._mangelEditCamActive=false;
      window._emFotos=window._emFotos||[];
      window._emFotos.push(data);
      renderEmFotoGrid();
      if(document.getElementById('camOverlay')?.style.display==='flex') closeCam();
      toast('Foto aufgenommen ✓');
      return;
    }
    if (window._lagerCamActive) {
      window._lagerCamActive=false;
      lagerFotoAusKamera(data);
      if(document.getElementById('camOverlay')?.style.display==='flex') closeCam();
      return;
    }
    if (pPhotoRoom) {
      if (PD && PD.raeume && PD.raeume[pPhotoRoom]) {
        const fotoId = uid();
        try {
          await idbPut('fotos', { id: fotoId, protId: PD.id, slot: 'room:'+pPhotoRoom, data, erstellt: now() });
        } catch(e) { console.warn('Einzelfoto-Sicherung:', e); toast('Foto konnte nicht gesichert werden – bitte erneut'); return; }
        PD.raeume[pPhotoRoom].photos.push(data);
        PD.raeume[pPhotoRoom].photoIds = PD.raeume[pPhotoRoom].photoIds || [];
        PD.raeume[pPhotoRoom].photoIds.push(fotoId);
        if(!PD._adminEditOriginal) PD.status = 'draft';
        try { await idbPut('protokolle', PD); } catch(e){ console.warn('Draft nach Foto:', e); }
        renderProtRaeume();
      }
    } else if (window._zaehlerIdx !== null && window._zaehlerIdx !== undefined) {
      if (PD && PD.zaehler && PD.zaehler[window._zaehlerIdx] !== undefined) {
        const idx = window._zaehlerIdx;
        const fotoId = uid();
        try {
          await idbPut('fotos', { id: fotoId, protId: PD.id, slot: 'zaehler:'+idx, data, erstellt: now() });
        } catch(e) { console.warn('Einzelfoto-Sicherung:', e); toast('Foto konnte nicht gesichert werden – bitte erneut'); return; }
        PD.zaehler[idx].foto = data;
        PD.zaehler[idx].fotoId = fotoId;
        if(!PD._adminEditOriginal) PD.status = 'draft';
        try { await idbPut('protokolle', PD); } catch(e){ console.warn('Draft nach Zählerfoto:', e); }
        renderProt(2);
        if(document.getElementById('camOverlay')?.style.display==='flex') closeCam();
      }
    } else if (Array.isArray(window._mangelPhotos)) {
      const fid = uid();
      window._mangelFotoIds = window._mangelFotoIds || [];
      try {
        await idbPut('fotos', { id: fid, protId: '__mangel_offen__', slot: 'mangel', data, erstellt: now() });
        window._mangelFotoIds.push(fid);
      } catch(e) { console.warn('Mangel-Foto-Sicherung:', e); }
      window._mangelPhotos.push(data);
      const grid = document.getElementById('mgPhotoGrid');
      if (grid) {
        grid.style.display = 'grid';
        grid.innerHTML = window._mangelPhotos.map((p,i) =>
          '<div class="ph-thumb"><img src="'+p+'"><button class="ph-del" onclick="delMangelFoto('+i+')">'+String.fromCharCode(10005)+'</button></div>'
        ).join('');
      }
    }
}

let camStream=null, camFacing='environment', camShots=0;

async function openCam(){
  camShots=0;
  const ov=document.getElementById('camOverlay');
  ov.style.display='flex';
  document.getElementById('camShotCount').style.display='none';
  try {
    await startCamStream();
  } catch(e) {
    console.warn('Kamera nicht verfügbar:', e);
    // Fallback: native Galerie/Kamera über File-Input
    closeCam();
    toast('Kamera nicht verfügbar – bitte Foto auswählen');
    if(window._zsCamActive){ document.getElementById('zsFotoIn').click(); }
    else if(window._mangelEditCamActive){ document.getElementById('em_fotoIn').click(); }
    else if(window._lagerCamActive){ document.getElementById('laFotoIn').click(); }
    else { document.getElementById('photoIn').click(); }
  }
}

async function startCamStream(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  camStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: camFacing, width:{ideal:1920}, height:{ideal:1080} },
    audio: false
  });
  const v=document.getElementById('camVideo');
  v.srcObject=camStream;
  await v.play().catch(()=>{});
}

async function camFlip(){
  camFacing = camFacing==='environment' ? 'user' : 'environment';
  try { await startCamStream(); } catch(e){ toast('Kamerawechsel nicht möglich'); }
}

async function camCapture(){
  const v=document.getElementById('camVideo');
  if(!v.videoWidth){ toast('Kamera lädt noch…'); return; }
  const canvas=document.getElementById('camCanvas');
  canvas.width=v.videoWidth; canvas.height=v.videoHeight;
  canvas.getContext('2d').drawImage(v,0,0);
  // kurzes visuelles Feedback
  const sh=document.getElementById('camShutter');
  sh.style.background='rgba(255,255,255,.7)'; setTimeout(()=>sh.style.background='rgba(255,255,255,.25)',120);
  let data;
  try {
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.85));
    data=await compressFoto(blob);
  } catch(e){ console.warn('Aufnahme:', e); toast('Foto konnte nicht verarbeitet werden'); return; }
  if(data){
    await processPhoto(data);
    camShots++;
    const c=document.getElementById('camShotCount');
    c.style.display='block'; c.textContent=camShots+(camShots===1?' Foto':' Fotos');
    toast('Foto aufgenommen ✓');
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  // OAuth-Redirect zuerst prüfen (kommt von Microsoft-Anmeldung)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('code') || urlParams.get('error')) {
    // IDB öffnen, dann Redirect verarbeiten
    await openIDB().catch(()=>{});
    await ensureDefaultUsers().catch(()=>{});
    await handleOAuthRedirect();
    showScreen('loginScreen');
    await loadLoginUsers().catch(()=>{});
    return;
  }

  let dbOk = false;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      await openIDB();
      dbOk = true;
      break;
    } catch(err) {
      console.warn('IDB Versuch ' + attempt + ' fehlgeschlagen:', err);
      if (attempt < 3) await new Promise(r => setTimeout(r, 400 * attempt));
    }
  }
  if (!dbOk) {
    showStartError('Datenbank konnte nicht geöffnet werden. Bitte App neu starten.');
    return;
  }
  try { await ensureDefaultUsers(); } catch(err) { console.warn('ensureDefaultUsers:', err); }
  try { await ensureTaetigkeitKat(); } catch(err) { console.warn('ensureTaetigkeitKat:', err); }
  try {
    // Aktive Session wiederherstellen (nach OS-Reload, z. B. nach Kamera-Nutzung)
    let sessionUid = null;
    try { sessionUid = sessionStorage.getItem('activeSession'); } catch(e) {}
    if (!sessionUid) {
      try {
        const raw = localStorage.getItem('activeSession');
        if (raw) {
          const s = JSON.parse(raw);
          // nur innerhalb von 12 Stunden automatisch wieder anmelden
          if (s && s.uid && s.ts && (Date.now() - s.ts) < 12*60*60*1000) sessionUid = s.uid;
        }
      } catch(e) {}
    }
    if (sessionUid) {
      const user = await idbGet('users', sessionUid).catch(()=>null);
      if (user && user.aktiv !== false) {
        CU = user;
        try { sessionStorage.setItem('activeSession', sessionUid); } catch(e) {}
        try { localStorage.setItem('activeSession', JSON.stringify({uid: sessionUid, ts: Date.now()})); } catch(e) {}
        showScreen('appScreen');
        await initApp();
        try {
          const rawP = localStorage.getItem('openProtokoll');
          if (rawP) {
            const op = JSON.parse(rawP);
            if (op && op.id && op.ts && (Date.now() - op.ts) < 60*60*1000) {
              const prot = await idbGet('protokolle', op.id).catch(()=>null);
              if (prot && prot.status === 'draft') {
                PD = {...prot};
                await restoreFotosForPD();
                renderProt(op.step || prot._draftStep || 0);
              }
            }
            localStorage.removeItem('openProtokoll');
          }
        } catch(e) { console.warn('Protokoll-Wiederherstellung:', e); }
        return;
      }
    }
    showScreen('loginScreen');
    await loadLoginUsers();
  } catch(err) {
    showStartError('Login-Fehler: ' + err.message);
  }
});

function showStartError(msg) {
  // Fehler groß auf dem Startbildschirm anzeigen
  const splash = document.getElementById('splashScreen');
  if (splash) {
    splash.style.display = 'flex';
    const sub = splash.querySelector('.splash-sub');
    const loader = splash.querySelector('.splash-loader');
    const title = splash.querySelector('.splash-title');
    if (sub) { sub.textContent = msg; sub.style.color = '#ff6b6b'; sub.style.fontSize = '13px'; sub.style.marginTop = '8px'; sub.style.maxWidth = '280px'; sub.style.textAlign = 'center'; sub.style.lineHeight = '1.5'; }
    if (loader) loader.style.display = 'none';
    if (title) title.style.color = '#ff6b6b';
  }
  console.error('ImmoApp Startfehler:', msg);
}

<script>
// ── INLINE SERVICE WORKER + PWA INSTALL ──────────────────────────────────
(function() {
  // Service Worker als Blob registrieren (funktioniert auch von file://)
  // Service Worker komplett deregistrieren + alle Caches leeren
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister().catch(()=>{}));
    }).catch(()=>{});
  }
  if ('caches' in window) {
    caches.keys().then(keys => {
      keys.forEach(k => caches.delete(k).catch(()=>{}));
      if (keys.length > 0) console.log('[NadigPfau] Cache geleert:', keys.length, 'Einträge');
    }).catch(()=>{});
  }
  // Force-Reload bei veralteter App-Version
  const storedVersion = localStorage.getItem('app_version');
  if (storedVersion && storedVersion !== APP_VERSION) {
    localStorage.setItem('app_version', APP_VERSION);
    console.log('[NadigPfau] Neue Version, Hard-Reload...');
    window.location.reload(true);
  } else {
    localStorage.setItem('app_version', APP_VERSION);
  }

  // PWA Install-Prompt abfangen
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    showInstallBanner();
  });
  window.addEventListener('appinstalled', () => {
    hideInstallBanner();
    deferredPrompt = null;
  });

  window.installPWA = function() {
    if (!deferredPrompt) {
      // Fallback-Anleitung anzeigen
      const msg = navigator.userAgent.includes('Android')
        ? 'Tippen Sie auf die drei Punkte (⋮) oben rechts in Chrome, dann „Zum Startbildschirm hinzufügen".'
        : 'Tippen Sie auf „Teilen" (□↑) und dann „Zum Home-Bildschirm".';
      alert('App installieren:\n\n' + msg);
      return;
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; hideInstallBanner(); });
  };

  function showInstallBanner() {
    const b = document.getElementById('installBanner');
    if (b) b.style.display = 'flex';
  }
  function hideInstallBanner() {
    const b = document.getElementById('installBanner');
    if (b) b.style.display = 'none';
  }

  // iOS: kein beforeinstallprompt – Banner manuell zeigen
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone;
  if (isIOS && !isStandalone) {
    window.addEventListener('load', () => setTimeout(showInstallBanner, 2000));
  }
})();
</script>
