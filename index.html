function modalUploadDok(objektId, mieterId) {
  showModal(`
    <div class="m-title"><i class="ti ti-upload"></i> Dokument hochladen</div>
    <div class="f"><label>Bezeichnung *</label>
      <input type="text" id="dokName" placeholder="z. B. Grundriss EG, Ausweis Mustermann..."></div>
    <div class="f"><label>Typ</label>
      <select id="dokTyp">
        ${DOK_TYPEN.map(t=>`<option value="${t.val}">${t.label}</option>`).join('')}
      </select>
    </div>
    <div class="f"><label>Notiz (optional)</label>
      <input type="text" id="dokNotiz" placeholder="z. B. Kopie, Stand 2024..."></div>
    <div class="f"><label>Datei *</label>
      <input type="file" id="dokFile" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"
        style="padding:8px;border:1.5px solid var(--ink-10);border-radius:var(--radius);width:100%;font-size:13px">
    </div>
    <div id="dokUploadInfo" style="font-size:12px;color:var(--ink-40);margin-top:6px"></div>
    <div class="f-row" style="margin-top:12px">
      <button class="btn btn-copper btn-full" onclick="saveDok('${objektId}','${mieterId}')">
        <i class="ti ti-check"></i> Speichern
      </button>
      <button class="btn btn-full" onclick="closeModal()">Abbrechen</button>
    </div>`);

  document.getElementById('dokFile').addEventListener('change', function() {
    const f = this.files[0];
    if (f) {
      document.getElementById('dokUploadInfo').textContent = f.name + ' · ' + fmtBytes(f.size);
      if (!document.getElementById('dokName').value) {
        document.getElementById('dokName').value = f.name.replace(/\.[^.]+$/, '');
      }
    }
  });
}

async function saveDok(objektId, mieterId) {
  const name = document.getElementById('dokName').value.trim();
  const file = document.getElementById('dokFile').files[0];
  if (!name) { toast('Bitte Bezeichnung eingeben'); return; }
  if (!file)  { toast('Bitte Datei auswählen'); return; }
  if (file.size > 10 * 1024 * 1024) { toast('Datei zu groß (max. 10 MB)'); return; }

  const info = document.getElementById('dokUploadInfo');
  info.textContent = 'Wird gespeichert...';
  info.style.color = 'var(--amber)';

  const reader = new FileReader();
  reader.onload = async (e) => {
    const dok = {
      id: uid(), name,
      typ:      document.getElementById('dokTyp').value,
      notiz:    document.getElementById('dokNotiz').value,
      objektId, mieterId: mieterId||null,
      data:     e.target.result,
      mimeType: file.type,
      size:     file.size,
      erstellt: now(), ersteller: CU?.name||'',
    };
    await idbPut('dokumente', dok);
    closeModal();
    clearTimeout(window._syncTimer);
    window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
    toast('Dokument gespeichert ✓');
    // Aktuell angezeigte Liste neu laden
    const el = document.getElementById('objTabContent') || document.getElementById('mieterDokEl');
    if (el) await renderDokumente(el, objektId, mieterId||null);
  };
  reader.readAsDataURL(file);
}

async function downloadDok(id) {
  const d = await idbGet('dokumente', id);
  if (!d) return;
  const a = document.createElement('a');
  a.href = d.data;
  a.download = d.name + (d.mimeType?.includes('pdf')?'.pdf':d.mimeType?.includes('image')?'.jpg':'');
  a.click();
}

async function deleteDok(id) {
  if (!confirm('Dokument wirklich löschen?')) return;
  await idbDelete('dokumente', id);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  toast('Dokument gelöscht');
  // Liste neu laden
  const el = document.getElementById('objTabContent') || document.getElementById('mieterDokEl');
  if (el) {
    const dok = await idbGet('dokumente', id).catch(()=>null);
    if (dok) await renderDokumente(el, dok.objektId, dok.mieterId);
    else el.innerHTML = '<div class="empty"><i class="ti ti-files"></i><p>Keine Dokumente</p></div>';
  }
}

  // Kosten einlesen
  const kostenMap = {};
  vorlage.kosten.forEach(k => {
    if (k.schluessel==='einzeln') {
      kostenMap[k.id]={};
      mieter.forEach(m=>{kostenMap[k.id][m.id]=parseFloat(document.getElementById('nka_heiz_'+m.id)?.value)||0;});
    } else {
      kostenMap[k.id]=parseFloat(document.getElementById('nka_'+k.id)?.value)||0;
    }
  });

  // Reparaturen im Abrechnungszeitraum laden
  const alleReps = await idbGetAll('reparaturen');
  const vonDate = von ? new Date(von) : null;
  const bisDate = bis ? new Date(bis) : null;

  // Vorauszahlung, KR, Sonstiges, Bemerkung pro Mieter
  const mieterExtras = {};
  for (const m of mieter) {
    // Manuelle KR aus Formular
    let krManual = parseFloat(document.getElementById('nka_kr_'+m.id)?.value)||0;
    // Automatische KR aus Reparaturen im Zeitraum
    const repsImZeitraum = alleReps.filter(r=>{
      if (r.mieterId !== m.id) return false;
      if (!r.datum) return false;
      const rd = new Date(r.datum);
      if (vonDate && rd < vonDate) return false;
      if (bisDate && rd > bisDate) return false;
      return true;
    });
    const krAuto = repsImZeitraum.reduce((s,r)=>s+(parseFloat(r.kosten)||0),0);
    mieterExtras[m.id]={
      vz:   parseFloat(document.getElementById('nka_vz_'+m.id)?.value)||(parseFloat(m.nk)||0),
      kr:   krManual + krAuto,
      krAuto,
      krManual,
      repsImZeitraum,
      so:   parseFloat(document.getElementById('nka_so_'+m.id)?.value)||0,
      bem:  document.getElementById('nka_bem_'+m.id)?.value||'',
    };
  }

  function getAnteil(k, m) {
    const betrag   = kostenMap[k.id];
    const flaeche  = (parseFloat(m.flaeche)||0)*12;
    const personen = (parseInt(m.personen)||1)*12;
    const we=12;
    switch(k.schluessel){
      case 'personen':      return gesamtPersonen>0?betrag*personen/gesamtPersonen:0;
      case 'wfl':           return gesamtWFL>0?betrag*flaeche/gesamtWFL:0;
      case 'we':            return gesamtWE>0?betrag*we/gesamtWE:0;
      case 'monate':        return gesamtMonate>0?betrag*we/gesamtMonate:0;
      case 'we_fest':       return (k.preisProWE||0)*12;
      case 'personen_fest': return (k.preisProPers||0)*(parseInt(m.personen)||1)*12;
      case 'besonders':     return betrag;
      case 'einzeln':       return betrag[m.id]||0;
      default:              return 0;
    }
  }

  // Gesamtkosten-Tabelle (Übersicht)
  const gesamtkosten = vorlage.kosten.filter(k=>k.schluessel!=='einzeln')
    .reduce((s,k)=>s+(kostenMap[k.id]||0),0);

  let kostenZeilen='';
  vorlage.kosten.forEach(k=>{
    if(k.schluessel==='einzeln') return;
    const b=kostenMap[k.id];
    if(!b||b===0) return;
    const sl=k.schluessel==='personen'?'Personen':k.schluessel==='wfl'?'Wohnfläche':
      k.schluessel==='we'||k.schluessel==='we_fest'?'WE':k.schluessel==='monate'?'Monate':
      k.schluessel==='personen_fest'?'Personen':k.schluessel==='besonders'?'bes. Berechn.':'';
    kostenZeilen+=`<tr><td style="padding:3px 8px;border:1px solid #dde;font-size:10px">${k.name}</td>
      <td style="padding:3px 8px;border:1px solid #dde;font-size:10px">${sl}</td>
      <td style="padding:3px 8px;border:1px solid #dde;font-size:10px;text-align:right;font-weight:600">${fmtEur(b)}</td></tr>`;
  });

  // Übersichtstabelle alle Mieter
  let uebersichtRows='';
  let gesamtNachzahlung=0, gesamtGuthaben=0;
  const mieterErgebnisse=[];

  mieter.forEach(m=>{
    const ex=mieterExtras[m.id];
    const vzJahres=ex.vz*12;
    let nkAnteil=0;
    vorlage.kosten.forEach(k=>{nkAnteil+=getAnteil(k,m);});
    const gesamt=nkAnteil+ex.kr+ex.so;
    const diff=gesamt-vzJahres;
    const diffCol=diff>0?'#C0392B':'#2E7D52';
    const diffTxt=diff>0?`Nachz.: ${fmtEur(diff)}`:`Gutschr.: ${fmtEur(Math.abs(diff))}`;
    if(diff>0) gesamtNachzahlung+=diff; else gesamtGuthaben+=Math.abs(diff);
    mieterErgebnisse.push({m, ex, nkAnteil, gesamt, vzJahres, diff});
    uebersichtRows+=`<tr>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px">WE ${m.weNr}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px">${m.mieter}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right">${parseFloat(m.flaeche)||0} m²</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right">${fmtEur(nkAnteil)}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right">${kostenMap['heizung']?.[m.id]>0?fmtEur(kostenMap['heizung'][m.id]):'–'}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right">${ex.kr>0?fmtEur(ex.kr):'–'}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right;font-weight:600">${fmtEur(gesamt)}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right">${fmtEur(vzJahres)}</td>
      <td style="padding:4px 6px;border:1px solid #dde;font-size:9px;text-align:right;font-weight:700;color:${diffCol}">${diffTxt}</td>
    </tr>`;
  });

  // Einzel-Briefe HTML generieren
  const today=new Date().toLocaleDateString('de-DE');
  let briefeHTML='';

  mieterErgebnisse.forEach(({m,ex,nkAnteil,gesamt,vzJahres,diff})=>{
    const diffPos=diff>0;
    const diffAbs=Math.abs(diff);
    let posZeilen='';
    vorlage.kosten.forEach(k=>{
      if(k.schluessel==='einzeln'){
        const h=kostenMap[k.id]?.[m.id]||0;
        if(h>0) posZeilen+=nkaZeile(k.name,'bes. Berechnung','',h,1,h);
        return;
      }
      const b=kostenMap[k.id]||0; if(!b) return;
      const flaeche=(parseFloat(m.flaeche)||0)*12;
      const personen=(parseInt(m.personen)||1)*12;
      const wfl_ges=gesamtWFL;
      const pers_ges=gesamtPersonen;
      const we_ges=gesamtWE;
      let geteilt,anteil,preis,kosten;
      switch(k.schluessel){
        case 'personen':      geteilt=pers_ges;anteil=personen;preis=b/pers_ges;kosten=b*personen/pers_ges;break;
        case 'wfl':           geteilt=wfl_ges;anteil=flaeche;preis=b/wfl_ges;kosten=b*flaeche/wfl_ges;break;
        case 'we':            geteilt=we_ges;anteil=12;preis=b/we_ges;kosten=b*12/we_ges;break;
        case 'monate':        geteilt=we_ges;anteil=12;preis=b/we_ges;kosten=b*12/we_ges;break;
        case 'personen_fest': geteilt='-';anteil=(parseInt(m.personen)||1)*12;preis=k.preisProPers||0;kosten=preis*anteil;break;
        case 'we_fest':       geteilt='-';anteil=12;preis=k.preisProWE||0;kosten=preis*12;break;
        case 'besonders':     geteilt='-';anteil='-';preis='-';kosten=b;break;
        default:              kosten=getAnteil(k,m);geteilt='-';anteil='-';preis='-';
      }
      posZeilen+=nkaZeile(k.name,k.schluessel==='personen'?'Personen':k.schluessel==='wfl'?'WFL':k.schluessel==='we'||k.schluessel==='we_fest'?'WE':k.schluessel==='monate'?'Monate':'Bes.',
        typeof geteilt==='number'?geteilt.toFixed(2):geteilt,
        b,
        typeof anteil==='number'?anteil:anteil,
        typeof preis==='number'?preis:preis,
        kosten);
    });
    // Automatische Reparaturen aus Zeitraum
    if(ex.repsImZeitraum?.length>0){

        posZeilen+=nkaZeile(r.titel+' ('+fmtDate(r.datum)+')',r.extern==='extern'?'Extern':'Intern','–','–','–','–',r.kosten||0);
      });
    }
    if(ex.krManual>0) posZeilen+=nkaZeile('Kleinreparaturen (manuell)','–','–','–','–','–',ex.krManual);
    if(ex.so>0) posZeilen+=nkaZeile('Sonstiges','–','–','–','–','–',ex.so);

    const schlBez=k=>{const s=k.schluessel;return s==='personen'?`${(parseInt(m.personen)||1)} Pers. × 12 Mon.`:s==='wfl'?`${parseFloat(m.flaeche)||0} m² × 12 Mon.`:s==='we'?'12 Mon.':'';};

    briefeHTML+=`

          </svg>
          <div style="font-size:8px;color:#555;margin-top:4px;line-height:1.5">
            ${bk.strasse} · ${bk.ort}<br>
            Tel: ${bk.tel}<br>
            ${bk.email||''}
          </div>
        </div>
        <div class="bk-right">
          <div class="bk-absender">${bk.name} · ${bk.strasse} · ${bk.ort}</div>
          <div class="bk-empf">
            <strong>${m.mieter}</strong><br>
            ${obj?.name||''}<br>
            ${obj?.ort||''}
          </div>
          <div style="margin-top:8mm;font-size:10px;color:#555">${today}</div>
        </div>
      </div>
      <div class="bk-trennlinie"></div>

      <h2 style="margin:14px 0 2px">${obj?.name||''} · WE ${m.weNr}${m.etage?' · '+m.etage:''}</h2>
      <h1 style="margin-bottom:8px">Mietnebenkosten – Einzelabrechnung</h1>
      <p style="font-size:11px;margin-bottom:6px">${
        (m.personen_liste?.length>1)?'Sehr geehrte Damen und Herren,'
        : m.anrede==='Frau' ? 'Sehr geehrte Frau '+m.mieter+','
        : m.anrede==='Divers' ? 'Guten Tag, '+m.mieter+','
        : 'Sehr geehrter Herr '+m.mieter+','
      }</p>
      <p style="font-size:11px;margin-bottom:10px;line-height:1.6">anbei erhalten Sie Ihre Nebenkostenabrechnung gemäß folgender Aufstellung:</p>
      <table class="info-table" style="margin:10px 0 8px">
        <tr><td></td><td>von</td><td>bis</td><td>Monate</td></tr>
        <tr><td>Abrechnungszeitraum</td><td>${fmtD(von)}</td><td>${fmtD(bis)}</td><td>12</td></tr>
        <tr><td>Ihr Abrechnungszeitraum</td><td>${fmtD(von)}</td><td>${fmtD(bis)}</td><td>12</td></tr>
      </table>
      <table class="info-table" style="margin-bottom:10px">
        <tr><td>Monate</td><td>WFL</td><td>Personen</td><td>Vorauszahlung</td></tr>
        <tr><td>12</td><td>${parseFloat(m.flaeche)||0}</td><td>${parseInt(m.personen)||1}</td>
          <td>${fmtEur(ex.vz)}/Mon. = ${fmtEur(vzJahres)}/Jahr</td></tr>
      </table>

      <table class="pos-table">
        <thead><tr>
          <th>Kostenart</th><th>Schlüssel</th><th>Betrag</th>
          <th>Geteilt durch</th><th>Ihr Anteil</th><th>Preis/Anteil</th><th>Ihre Kosten</th>
        </tr></thead>
        <tbody>${posZeilen}</tbody>
      </table>

      <table class="summen-table">
        <tr><td>Summe Nebenkosten</td><td>${fmtEur(nkAnteil-( kostenMap['heizung']?.[m.id]||0)-(ex.kr||0)-(ex.so||0))}</td></tr>
        ${kostenMap['heizung']?.[m.id]>0?`<tr><td>Heizkosten</td><td>${fmtEur(kostenMap['heizung'][m.id])}</td></tr>`:''}
        ${ex.kr>0?`<tr><td>Kleinreparaturen</td><td>${fmtEur(ex.kr)}</td></tr>`:''}
        ${ex.so>0?`<tr><td>Sonstiges</td><td>${fmtEur(ex.so)}</td></tr>`:''}
        <tr class="total"><td>Gesamtnebenkosten</td><td>${fmtEur(gesamt)}</td></tr>
        <tr><td>Summe Vorauszahlung</td><td>${fmtEur(vzJahres)}</td></tr>
        <tr class="${diffPos?'nachzahl':'gutschr'}">
          <td>${diffPos?'Nachzahlung':'Guthaben'}</td>
          <td>${fmtEur(diffAbs)}</td>
        </tr>
      </table>

      ${ex.bem?`<div class="bemerkung"><strong>Hinweis:</strong> ${ex.bem}</div>`:''}

      <p class="abschluss">${diffPos
        ? 'Bitte überweisen Sie den Nachzahlungsbetrag innerhalb von 4 Wochen auf unser Konto.'
        : 'Das Guthaben wird mit der kommenden Mietzahlung verrechnet bzw. ausgezahlt.'
      }</p>

      <div class="gruss">Mit freundlichen Grüßen<br><br>${bk.name}</div>
    </div>`;
  });

  // NKA im Archiv speichern
  const archivEntry = {
    id: uid(),
    objektId, objektName: obj?.name||'',
    jahr, von, bis,
    erstellt: now(), ersteller: CU?.name||'',
    mieterAnzahl: mieter.length,
    gesamtkosten,
    gesamtNachzahlung, gesamtGuthaben,
    mieterErgebnisse: mieterErgebnisse.map(({m,ex,gesamt,vzJahres,diff})=>({
      mieterId:m.id, mieterName:m.mieter, weNr:m.weNr,
      gesamt, vzJahres, diff, bemerkung:ex.bem||'',
    })),
  };
  await idbPut('nka_archiv', archivEntry);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  toast('NKA gespeichert und wird gedruckt...');

  const nkaHtml = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">

  // Pro Mieter im Archiv ablegen (auch für ausgezogene/Vormieter abrufbar)
  for (const {m} of mieterErgebnisse) {

  // PDF-Fenster öffnen
  const win = window.open('', '_blank');
  if (!win) { toast('Popup blockiert – Abrechnung wurde im Archiv gespeichert'); return; }
  win.document.write(nkaHtml);
  win.document.close();
}

function nkaZeile(name, schluessel, geteilt, betrag, anteil, preis, kosten) {
  const isWFL = schluessel === 'WFL' || schluessel === 'Wohnfläche';
  const anteilFmt = typeof anteil === 'number'
    ? (isWFL ? anteil.toFixed(2)+' m²' : anteil)
    : (anteil||'–');
  const geteiltFmt = typeof geteilt === 'number'
    ? (isWFL ? geteilt.toFixed(2)+' m²' : geteilt.toFixed(2))
    : (geteilt||'–');
  return `<tr>
    <td>${name}</td>
    <td>${schluessel}</td>
    <td style="text-align:right">${typeof betrag==='number'?fmtEur(betrag):betrag}</td>
    <td style="text-align:right">${geteiltFmt}</td>
    <td style="text-align:right">${anteilFmt}</td>
    <td style="text-align:right">${typeof preis==='number'?preis.toFixed(4)+'€':preis}</td>
    <td style="text-align:right">${fmtEur(kosten)}</td>
  </tr>`;
}

async function renderProtokollArchiv() {
  const myObj  = await getMyObjekte();
  const myIds  = myObj.map(o=>o.id);
  const alle   = (await idbGetAll('protokolle'))
    .filter(p => myIds.includes(p.objektId) && p.status !== 'draft')
    .sort((a,b) => new Date(b.datum||b.erstellt) - new Date(a.datum||a.erstellt));

  const el = document.getElementById('page-protokoll-archiv');

  // Filter-Status
  const filterObjId = window._archivFilter?.objId || 'all';
  const filterArt   = window._archivFilter?.art   || 'all';
  const filterQ     = window._archivFilter?.q     || '';

  let gefiltert = alle;
  if (filterObjId !== 'all') gefiltert = gefiltert.filter(p=>p.objektId===filterObjId);
  if (filterArt   !== 'all') gefiltert = gefiltert.filter(p=>(p.art||'').includes(filterArt));
  if (filterQ)               gefiltert = gefiltert.filter(p=>
    (p.mieterName||'').toLowerCase().includes(filterQ.toLowerCase()) ||
    (p.objektName||'').toLowerCase().includes(filterQ.toLowerCase()) ||
    (p.weNr||'').includes(filterQ)
  );

  // Statistik
  const anzEinzug = gefiltert.filter(p=>(p.art||'').includes('Einzug')).length;
  const anzAuszug = gefiltert.filter(p=>(p.art||'').includes('Auszug')).length;
  const anzZwischen = gefiltert.filter(p=>(p.art||'').includes('Zwischen')).length;

  let h = `
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
    <div class="stat"><div class="stat-n" style="font-size:22px">${anzAuszug}</div><div class="stat-l">Auszüge</div></div>
    <div class="stat"><div class="stat-n" style="font-size:22px">${anzEinzug}</div><div class="stat-l">Einzüge</div></div>
    <div class="stat hl"><div class="stat-n" style="font-size:22px">${alle.length}</div><div class="stat-l">Gesamt</div></div>
  </div>

  <div class="search-bar" style="margin-bottom:10px">
    <div class="search-wrap" style="flex:1">
      <i class="ti ti-search"></i>
      <input class="search-input" id="archivQ" placeholder="Mieter, Objekt, WE..."
        value="${filterQ}" oninput="setArchivFilter('q',this.value)">
    </div>
    <button class="btn btn-copper btn-sm" onclick="newProtokoll()">
      <i class="ti ti-plus"></i> Neu
    </button>
  </div>

  <div class="filter-row" style="margin-bottom:10px">
    <button class="filter-chip ${filterArt==='all'?'active':''}" onclick="setArchivFilter('art','all',this)">Alle</button>
    <button class="filter-chip ${filterArt==='Auszug'?'active':''}" onclick="setArchivFilter('art','Auszug',this)">Auszüge</button>
    <button class="filter-chip ${filterArt==='Einzug'?'active':''}" onclick="setArchivFilter('art','Einzug',this)">Einzüge</button>
    <button class="filter-chip ${filterArt==='Zwischen'?'active':''}" onclick="setArchivFilter('art','Zwischen',this)">Zwischenabnahmen</button>
  </div>

  <div class="filter-row" style="margin-bottom:12px">
    <button class="filter-chip ${filterObjId==='all'?'active':''}" onclick="setArchivFilter('objId','all',this)">Alle Objekte</button>
    ${myObj.map(o=>`<button class="filter-chip ${filterObjId===o.id?'active':''}" onclick="setArchivFilter('objId','${o.id}',this)">${o.name}</button>`).join('')}
  </div>`;

  if (!gefiltert.length) {
    h += `<div class="empty"><i class="ti ti-clipboard-off"></i>
      <p>${filterQ||filterObjId!=='all'||filterArt!=='all' ? 'Keine Protokolle gefunden.' : 'Noch keine Protokolle vorhanden.'}</p>
    </div>`;
    el.innerHTML = h; return;
  }

  h += `<div style="font-size:12px;color:var(--ink-40);margin-bottom:8px">${gefiltert.length} Protokoll${gefiltert.length!==1?'e':''}</div>`;

  // Gruppierung nach Jahr
  const nachJahr = {};
  gefiltert.forEach(p => {
    const d = p.datum || p.erstellt || '';
    const jahr = d ? (d.includes('-') ? d.slice(0,4) : d.slice(-4)) : 'Unbekannt';
    if (!nachJahr[jahr]) nachJahr[jahr] = [];
    nachJahr[jahr].push(p);
  });

  Object.keys(nachJahr).sort((a,b)=>b-a).forEach(jahr => {
    h += `<div style="font-size:11px;font-weight:700;color:var(--ink-40);text-transform:uppercase;
      letter-spacing:.6px;margin:14px 0 6px;display:flex;align-items:center;gap:6px">
      <i class="ti ti-calendar" style="font-size:13px;color:var(--copper)"></i> ${jahr}
      <span style="background:var(--ink-05);border-radius:10px;padding:1px 7px;font-size:10px">${nachJahr[jahr].length}</span>
    </div>`;

    nachJahr[jahr].forEach(p => {
      const isEinzug   = (p.art||'').includes('Einzug');
      const isAuszug   = (p.art||'').includes('Auszug');
      const dotColor   = isEinzug ? 'var(--green)' : isAuszug ? 'var(--amber)' : 'var(--copper)';
      const artChip    = isEinzug ? 'chip-ok' : isAuszug ? 'chip-warn' : 'chip-gray';
      const obj        = getObj(p.objektId);
      const mangelAnz  = (p._autoMaengel||[]).length;

      h += `<div style="background:var(--white);border:1px solid var(--ink-10);border-radius:var(--radius);
        padding:11px 13px;margin-bottom:7px;display:flex;gap:10px;align-items:center;cursor:pointer"
        onclick="editProtokoll('${p.id}')">
        <div style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0;margin-top:2px"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
            ${p.mieterName||'–'} · WE ${p.weNr||'?'}
          </div>
          <div style="font-size:12px;color:var(--ink-40);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span>${obj?.name||p.objektName||'–'}</span>
            <span>${fmtDate(p.datum)}</span>
            <span class="chip ${artChip}" style="font-size:10px;padding:1px 6px">${p.art||'Übergabe'}</span>
            ${mangelAnz ? `<span class="chip chip-err" style="font-size:10px;padding:1px 6px"><i class="ti ti-alert-triangle" style="font-size:9px"></i> ${mangelAnz} Mängel</span>` : ''}
            ${p.status==='fertig' ? '' : `<span class="chip chip-warn" style="font-size:10px;padding:1px 6px">Entwurf</span>`}
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          <button class="btn btn-sm" onclick="event.stopPropagation();printProt('${p.id}')">
            <i class="ti ti-printer"></i>
          </button>
          <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteProtokoll('${p.id}')">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </div>`;
    });
  });

  el.innerHTML = h;
}

function setArchivFilter(key, val, btn) {
  if (!window._archivFilter) window._archivFilter = {objId:'all', art:'all', q:''};
  window._archivFilter[key] = val;
  if (btn && key !== 'q') {
    const row = btn.parentNode;
    Array.from(row.children).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderProtokollArchiv();
}

async function deleteProtokoll(id) {
  if (!confirm('Protokoll wirklich löschen?')) return;
  await idbDelete('protokolle', id);
  // verknüpfte Einzelfoto-Sicherungen mit entfernen
  try {
    const tmp = await idbGetAll('fotos', 'protId', id);
    for (const fo of tmp) await idbDelete('fotos', fo.id).catch(()=>{});
  } catch(e) { console.warn('Foto-Aufräumung (Löschung):', e); }
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await renderProtokollArchiv();
  await renderDash();
  toast('Protokoll gelöscht');
}

async function renderNKAArchiv(el, objektId) {
  const alle = (await idbGetAll('nka_archiv','objektId',objektId))
    .sort((a,b)=>b.erstellt.localeCompare(a.erstellt));

  let h = `<div class="s-hdr" style="margin-bottom:10px">
    <div class="s-title">NKA-Archiv (${alle.length})</div>
    ${CU?.role==='admin'?`<button class="btn btn-sm btn-copper" onclick="modalNKA('${objektId}')">
      <i class="ti ti-receipt"></i> Neue NKA
    </button>`:''}
  </div>`;

  if (!alle.length) {
    h += '<div class="empty"><i class="ti ti-receipt-off"></i><p>Noch keine Abrechnungen erstellt.</p></div>';
    el.innerHTML = h; return;
  }

  alle.forEach(nka => {
    const fmtD = d => d ? new Date(d).toLocaleDateString('de-DE') : '–';
    const ergebnisChips = (nka.mieterErgebnisse||[]).map(mr=>{
      const col = mr.diff>0 ? 'var(--red)' : 'var(--green)';
      const txt = mr.diff>0 ? '+'+fmtEur(mr.diff) : fmtEur(Math.abs(mr.diff));
      return '<span style="background:var(--ink-05);border-radius:6px;padding:3px 8px;font-size:10px">WE '+mr.weNr+' <strong style="color:'+col+'">'+txt+'</strong></span>';
    }).join('');

    h += '<div style="background:var(--white);border:1px solid var(--ink-10);border-radius:var(--radius);padding:12px;margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
      +'<div><div style="font-size:14px;font-weight:600;color:var(--ink)">NKA '+nka.jahr+'</div>'
      +'<div style="font-size:11px;color:var(--ink-40)">'+fmtD(nka.von)+' – '+fmtD(nka.bis)+'</div>'
      +'<div style="font-size:11px;color:var(--ink-40)">'+nka.erstellt+' · '+(nka.ersteller||'')+'</div></div>'
      +'<div style="text-align:right">'
      +'<div style="font-size:12px;color:var(--red);font-weight:600">Nachz.: '+fmtEur(nka.gesamtNachzahlung||0)+'</div>'
      +'<div style="font-size:12px;color:var(--green);font-weight:600">Gutschr.: '+fmtEur(nka.gesamtGuthaben||0)+'</div>'
      +'</div></div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+ergebnisChips+'</div>'
      +`<button class="btn btn-sm btn-danger" onclick="deleteNKA('${nka.id}')"><i class="ti ti-trash"></i> Löschen</button>`
      +'</div>';
  });

  el.innerHTML = h;
}

async function deleteNKA(id) {
  if (!confirm('NKA-Eintrag wirklich löschen?')) return;
  await idbDelete('nka_archiv', id);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  const el = document.getElementById('objTabContent');
  if (el && currentObjId) await renderNKAArchiv(el, currentObjId);
  toast('NKA gelöscht');
}

═══════════════════════════════════════════════════════════ */
function getAnrede(m) {
  const persListe = m.personen_liste?.filter(p=>p.name) || [];
  // Einzelperson
  if (persListe.length <= 1) {
    const anrede = m.anrede || 'Herr';
    if (anrede === 'Frau')   return 'Sehr geehrte Frau ' + m.mieter;
    if (anrede === 'Divers') return 'Guten Tag, ' + m.mieter;
    return 'Sehr geehrter Herr ' + m.mieter;
  }
  // Mehrere Personen: "Sehr geehrter Herr X und Frau Y" / "Sehr geehrte Frau X und Herr Y"
  // Nutze Anrede des Hauptmieters + "und [Anrede] [Name2]"
  const hauptAnrede = m.anrede || 'Herr';
  const hauptName   = m.mieter;
  const hauptPfx    = hauptAnrede === 'Frau' ? 'Sehr geehrte Frau' : hauptAnrede === 'Divers' ? 'Guten Tag,' : 'Sehr geehrter Herr';
  // Weitere Personen
  const weitere = persListe.slice(1).map(p => {
    // Versuche Anrede aus personen_liste (anrede-Feld)
    const pa = p.anrede || '';
    if (pa === 'Frau') return 'Frau ' + p.name;
    if (pa === 'Divers') return p.name;
    return 'Herr ' + p.name;
  });
  if (weitere.length === 0) return hauptPfx + ' ' + hauptName;
  if (weitere.length === 1) return hauptPfx + ' ' + hauptName + ' und ' + weitere[0];
  return hauptPfx + ' ' + hauptName + ', ' + weitere.slice(0,-1).join(', ') + ' und ' + weitere[weitere.length-1];
}

function getAnredeKurz(m) {
  const anrede = m.anrede || 'Herr';
  const persListe = m.personen_liste || [{name:m.mieter}];
  if (persListe.length > 1) return 'die Bewohner';
  if (anrede === 'Frau')   return 'Frau ' + m.mieter;
  if (anrede === 'Divers') return m.mieter;
  return 'Herr ' + m.mieter;
}

function updateBriefAnrede() {
  const sel = document.getElementById('briefEmpf');
  const anredeEl = document.getElementById('briefAnrede');
  if (!sel || !anredeEl || !window._briefMieter) return;
  const val = sel.value;
  if (val === 'all') {
    anredeEl.value = 'Sehr geehrte Damen und Herren';
  } else {
    const m = window._briefMieter.find(m=>m.id===val);
    if (m) anredeEl.value = getAnrede(m);
  }

function calcRepGesamt() {
  let sum = 0;
  // Arbeitsstunden
  const arbRows = document.getElementById('repArbeitRows')?.children?.length||0;
  for (let i=0;i<arbRows;i++) {
    const std   = parseFloat(document.getElementById('repStd_'+i)?.value)||0;
    const preis = parseFloat(document.getElementById('repStdPreis_'+i)?.value)||0;
    sum += std * preis;
  }
  // Ersatzteile
  const teilRows = document.getElementById('repTeilRows')?.children?.length||0;
  for (let i=0;i<teilRows;i++) {
    sum += parseFloat(document.getElementById('repTeilPreis_'+i)?.value)||0;
  }
  // Externe Rechnung
  if (document.getElementById('repExtern')?.value==='extern') {
    sum += parseFloat(document.getElementById('repExtBetrag')?.value)||0;
  }
  const el = document.getElementById('repGesamt');
  if (el) el.textContent = fmtEur(sum);
}

async function saveReparatur() {
  const titel = document.getElementById('repTitel')?.value?.trim();
  if (!titel) { toast('Bitte Bezeichnung eingeben'); return; }

  const extern  = document.getElementById('repExtern')?.value;
  const mieterId = document.getElementById('repMietId')?.value;
  const m = mieterId ? (await idbGet('mieter',mieterId)) : null;

  // Arbeitsstunden sammeln
  const arbeit = [];
  const arbRows = document.getElementById('repArbeitRows')?.children?.length||0;
  for (let i=0;i<arbRows;i++){
    const std   = parseFloat(document.getElementById('repStd_'+i)?.value)||0;
    const preis = parseFloat(document.getElementById('repStdPreis_'+i)?.value)||0;
    if (std>0||preis>0) arbeit.push({stunden:std, stundensatz:preis, betrag:std*preis});
  }

  // Ersatzteile sammeln
  const teile = [];
  const teilRows = document.getElementById('repTeilRows')?.children?.length||0;
  for (let i=0;i<teilRows;i++){
    const bez   = document.getElementById('repTeil_'+i)?.value?.trim();
    const preis = parseFloat(document.getElementById('repTeilPreis_'+i)?.value)||0;
    if (bez||preis>0) teile.push({bezeichnung:bez||'–', betrag:preis});
  }

  // Externe Rechnung
  let rechnung_data = null;
  const extBetrag = extern==='extern' ? (parseFloat(document.getElementById('repExtBetrag')?.value)||0) : 0;
  const rechnFile = document.getElementById('repRechnung')?.files[0];

  const arbeitGes = arbeit.reduce((s,a)=>s+a.betrag,0);
  const teileGes  = teile.reduce((s,t)=>s+t.betrag,0);
  const gesamt    = arbeitGes + teileGes + extBetrag;

  const saveEntry = async (rechnData) => {
    await idbPut('reparaturen', {
      id:uid(), type:'reparatur',
      objektId: document.getElementById('repObjId')?.value,
      mieterId: mieterId||null, weNr: m?.weNr||'',
      titel, extern,
      datum: document.getElementById('repDatum')?.value,
      beschreibung: document.getElementById('repBeschr')?.value,
      status: document.getElementById('repStatus')?.value,
      arbeit, teile,
      extBetrag: extBetrag||null,
      rechnung: rechnData||null,
      kosten: gesamt,
      gesamt,
      erstellt: now(), ersteller: CU?.name||'',
    });
    closeModal();
    clearTimeout(window._syncTimer);
    window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
    await refreshAufgaben(); await renderDash();
    if (curPage==='mieter'&&currentMieterId) await showMieter(currentMieterId);
    toast('Reparatur gespeichert ✓');
  };

  if (rechnFile) {
    const reader = new FileReader();
    reader.onload = e => saveEntry(e.target.result);
    reader.readAsDataURL(rechnFile);
  } else {
    await saveEntry(null);
  }
}

async function renderEinkaufsliste() {
  const el = document.getElementById('einkaufListeContent');
  if (!el) return;
  const myObj  = await getMyObjekte();
  const myIds  = myObj.map(o=>o.id);
  const alle   = (await idbGetAll('einkaufsliste'))
    .filter(e=>myIds.includes(e.objektId)||!e.objektId)
    .sort((a,b)=>{ if(a.status==='gekauft'&&b.status!=='gekauft') return 1; if(b.status==='gekauft'&&a.status!=='gekauft') return -1; return new Date(b.erstellt)-new Date(a.erstellt); });

  const offen   = alle.filter(e=>e.status!=='gekauft');
  const gekauft = alle.filter(e=>e.status==='gekauft');

  let h = `<div class="s-hdr" style="margin-bottom:10px">
    <div class="s-title">Materialbedarf (${offen.length} offen)</div>
    <button class="btn btn-sm btn-copper" onclick="modalAddEinkauf()">
      <i class="ti ti-plus"></i> Hinzufügen
    </button>
  </div>`;

  if (!alle.length) {
    h += '<div class="empty"><i class="ti ti-shopping-cart"></i><p>Keine Einträge vorhanden.</p></div>';
    el.innerHTML = h; return;
  }

  // Offene Einträge
  if (offen.length) {
    offen.forEach(e => { h += einkaufHTML(e); });
  }

  // Gekauft (zusammengeklappt)
  if (gekauft.length) {
    h += `<div style="font-size:11px;font-weight:700;color:var(--ink-40);text-transform:uppercase;
      letter-spacing:.6px;margin:14px 0 6px;display:flex;align-items:center;gap:6px">
      <i class="ti ti-check" style="font-size:13px;color:var(--green)"></i>
      Gekauft (${gekauft.length})
    </div>`;
    gekauft.forEach(e => { h += einkaufHTML(e); });
  }

  el.innerHTML = h;
}

          ${['Stk.','m','m²','kg','Liter','Packung','Set'].map(u=>`<option ${e.einheit===u?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
    </div>
    ${e.status==='gekauft'?`<div class="f"><label>Preis (€)</label>
      <input type="number" id="ekPreis" value="${e.preis||''}" step="0.01" placeholder="Tatsächlicher Kaufpreis"></div>`:''}
    <div class="f"><label>Notiz</label>
      <textarea id="ekNotiz" style="min-height:60px">${e.notiz||''}</textarea></div>
    <div class="f-row" style="margin-top:12px">
      <button class="btn btn-copper btn-full" onclick="updateEinkauf('${id}')">
        <i class="ti ti-check"></i> Speichern
      </button>
      <button class="btn btn-full" onclick="closeModal()">Abbrechen</button>
    </div>`);
}

async function updateEinkauf(id) {
  const e = await idbGet('einkaufsliste', id);
  if (!e) return;
  e.artikel = document.getElementById('ekArtikel')?.value?.trim()||e.artikel;
  e.menge   = parseFloat(document.getElementById('ekMenge')?.value)||e.menge;
  e.einheit = document.getElementById('ekEinheit')?.value||e.einheit;
  e.notiz   = document.getElementById('ekNotiz')?.value||'';
  const prEl = document.getElementById('ekPreis');
  if (prEl) e.preis = parseFloat(prEl.value)||null;
  await idbPut('einkaufsliste', e);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderEinkaufsliste();
  toast('Gespeichert ✓');
}

async function toggleEinkauf(id) {
  const e = await idbGet('einkaufsliste', id);
  if (!e) return;
  e.status = e.status==='gekauft' ? 'offen' : 'gekauft';
  if (e.status==='gekauft') e.gekauftAm = now();
  await idbPut('einkaufsliste', e);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderEinkaufsliste();
  if (e.status==='gekauft') toast('✓ Als gekauft markiert');
}

async function deleteEinkauf(id) {
  if (!confirm('Eintrag löschen?')) return;
  await idbDelete('einkaufsliste', id);
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderEinkaufsliste();
}

async function saveMieterhoehung(mieterId) {
  const m = await idbGet('mieter', mieterId);
  if (!m) return;
  const neueMiete = parseFloat(document.getElementById('mhNeueMiete')?.value);
  const neueNK    = parseFloat(document.getElementById('mhNeueNK')?.value);
  const datum     = document.getElementById('mhDatum')?.value;
  const grund     = document.getElementById('mhGrund')?.value;
  const begruend  = document.getElementById('mhBegruendung')?.value||'';

  if (!neueMiete || !datum) { toast('Bitte neue Miete und Datum eingeben'); return; }

  // History pflegen
  if (!m.miete_history) m.miete_history = [];
  m.miete_history.push({
    datum, alteMiete: m.miete, alteNK: m.nk,
    neueMiete, neueNK: neueNK||m.nk,
    grund, begruendung: begruend,
    erfasst: now(), erfasstVon: CU?.name||'',
  });

  // Miete aktualisieren
  const alteMiete = m.miete;
  const alteNK = m.nk;
  m.miete  = neueMiete;
  m.nk     = neueNK||m.nk;
  m.gesamt = neueMiete + (neueNK||m.nk);

  await idbPut('mieter', m);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);

  // Schreiben drucken
  const obj = getObj(m.objektId);
  const bk  = getBriefkopf(m.objektId);
  const heute = new Date().toLocaleDateString('de-DE');
  const wirksamAb = new Date(datum).toLocaleDateString('de-DE');
  const diff = neueMiete - alteMiete;
  const diffNK = (neueNK||alteNK) - alteNK;
  const diffPct = alteMiete ? (diff/alteMiete)*100 : 0;

  // Rechtliche Textbausteine je nach Rechtsgrundlage
  // § 558 = Zustimmungsmodell, § 559 = einseitige Erklärung, Staffel/Index/Einvernehmen = informativ
  const istZustimmung = /558/.test(grund);          // ortsübliche Vergleichsmiete -> Zustimmung nötig
  const istModernisierung = /559/.test(grund);      // Modernisierung -> einseitige Erklärung
  const ueberschrift = istZustimmung ? 'Mieterhöhungsverlangen'
                     : istModernisierung ? 'Mieterhöhungserklärung'
                     : 'Mitteilung zur Mietanpassung';
  // Kappungsgrenzen-Warnung nur intern (keine Rechtsberatung im Schreiben)
  if (istZustimmung && diffPct > 20.0001) {
    console.warn('Hinweis: Erhöhung über 20% – Kappungsgrenze § 558 Abs. 3 BGB prüfen (in angespannten Märkten 15%).');
  }

  const win = window.open('', '_blank');

  const mhHtml = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">

</style></head><body>

async function exportExcel() {
  if (typeof XLSX === 'undefined') { toast('XLSX-Bibliothek nicht geladen'); return; }
  toast('Excel wird erstellt...');
  const myObj   = await getMyObjekte();
  const myIds   = myObj.map(o=>o.id);
  const mieter  = (await idbGetAll('mieter')).filter(m=>myIds.includes(m.objektId)).sort((a,b)=>a.objekt?.localeCompare(b.objekt)||Number(a.weNr)-Number(b.weNr));
  const aufgaben= (await idbGetAll('aufgaben')).filter(a=>myIds.includes(a.objektId));
  const maengel = (await idbGetAll('maengel')).filter(m=>myIds.includes(m.objektId));
  const reps    = (await idbGetAll('reparaturen')).filter(r=>myIds.includes(r.objektId));

  const wb = XLSX.utils.book_new();

  // Blatt 1: Mieter
  const mRows = [['Objekt','WE-Nr.','Etage','Anrede','Mieter','Personen','Miete (€)','NK (€)','Gesamt (€)','m²','Einzug','Auszug','Kaution (€)','Telefon','E-Mail','Leerstand']];
  mieter.forEach(m => mRows.push([
    m.objekt||'', m.weNr||'', m.etage||'', m.anrede||'', m.mieter||'',
    m.personen||1, m.miete||0, m.nk||0, m.gesamt||0, m.flaeche||'',
    m.einzug||'', m.auszug||'', m.kaution||0, m.telefon||'', m.email||'',
    m.leerstand?'Ja':'',
  ]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mRows), 'Mieter');

  // Blatt 2: Aufgaben
  const aRows = [['Objekt','WE','Titel','Priorität','Status','Fällig am','Erstellt von','Beschreibung']];
  aufgaben.forEach(a => aRows.push([
    getObj(a.objektId)?.name||'', a.weNr||'', a.titel||'',
    a.prio||'', a.status||'', a.datum||'', a.ersteller||'', a.beschreibung||'',
  ]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aRows), 'Aufgaben');

  // Blatt 3: Mängel
  const mngRows = [['Objekt','WE','Titel','Schwere','Status','Datum','Kosten (€)','Erstellt von','Beschreibung']];
  maengel.forEach(m => mngRows.push([
    getObj(m.objektId)?.name||'', m.weNr||'', m.titel||'',
    m.schwere||'', m.status||'', m.datum||'', m.kosten||0, m.ersteller||'', m.beschreibung||'',
  ]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mngRows), 'Mängel');

  // Blatt 4: Reparaturen
  const repRows = [['Objekt','WE','Titel','Status','Datum','Intern/Extern','Arbeitsstunden (€)','Material (€)','Ext. Rechnung (€)','Gesamt (€)','Erstellt von']];
  reps.forEach(r => {
    const arbGes  = (r.arbeit||[]).reduce((s,a)=>s+a.betrag,0);
    const teilGes = (r.teile||[]).reduce((s,t)=>s+t.betrag,0);
    repRows.push([
      getObj(r.objektId)?.name||'', r.weNr||'', r.titel||'',
      r.status||'', r.datum||'', r.extern||'intern',
      arbGes, teilGes, r.extBetrag||0, r.kosten||0, r.ersteller||'',
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(repRows), 'Reparaturen');

  XLSX.writeFile(wb, 'NadigPfau_Export_' + today() + '.xlsx');
  toast('Excel exportiert ✓');
}


/* ═══════════════════════════════════════════════════════════

let _searchTimeout = null;

function openGlobalSearch() {
  showModal(`
    <div class="m-title"><i class="ti ti-search"></i> Globale Suche</div>
    <div class="search-bar" style="margin-bottom:12px">
      <div class="search-wrap" style="flex:1">
        <i class="ti ti-search"></i>
        <input class="search-input" id="globalSearchQ" placeholder="Mieter, Objekt, Mangel, Aufgabe..."
          oninput="runGlobalSearch(this.value)" autofocus>
      </div>
    </div>
    <div id="globalSearchResults" style="max-height:60vh;overflow-y:auto">
      <div style="text-align:center;color:var(--ink-40);padding:20px;font-size:13px">
        Suchbegriff eingeben...
      </div>
    </div>`);
  setTimeout(()=>document.getElementById('globalSearchQ')?.focus(), 100);
}

async function runGlobalSearch(q) {
  clearTimeout(_searchTimeout);
  const el = document.getElementById('globalSearchResults');
  if (!el) return;
  if (!q || q.length < 2) {
    el.innerHTML = '<div style="text-align:center;color:var(--ink-40);padding:20px;font-size:13px">Mind. 2 Zeichen eingeben</div>';
    return;
  }
  el.innerHTML = '<div style="text-align:center;padding:10px"><i class="ti ti-loader" style="animation:spin 1s linear infinite"></i></div>';

  _searchTimeout = setTimeout(async () => {
    const ql = q.toLowerCase();
    const myObj = await getMyObjekte();
    const myIds = myObj.map(o=>o.id);
    const results = [];

    // Mieter
    const mieter = (await idbGetAll('mieter')).filter(m=>myIds.includes(m.objektId));
    mieter.forEach(m=>{
      const score = [m.mieter,m.telefon,m.email,m.weNr,m.etage,m.objekt].filter(Boolean).join(' ').toLowerCase();
      if (score.includes(ql)) results.push({type:'mieter', icon:'ti-user', color:'var(--copper)', label:m.mieter, sub:'WE '+m.weNr+' · '+m.objekt, action:`closeModal();showMieter('${m.id}')`, id:m.id});
    });

    // Aufgaben
    (await idbGetAll('aufgaben')).filter(a=>myIds.includes(a.objektId)).forEach(a=>{
      if ((a.titel+' '+(a.beschreibung||'')).toLowerCase().includes(ql))
        results.push({type:'aufgabe', icon:'ti-checklist', color:'var(--amber)', label:a.titel, sub:getObj(a.objektId)?.name+' · '+a.status, action:`closeModal();showAufgabeDetail('${a.id}')`, id:a.id});
    });

    // Mängel
    (await idbGetAll('maengel')).filter(m=>myIds.includes(m.objektId)).forEach(m=>{
      if ((m.titel+' '+(m.beschreibung||'')).toLowerCase().includes(ql))
        results.push({type:'mangel', icon:'ti-alert-triangle', color:'var(--red)', label:m.titel, sub:getObj(m.objektId)?.name+' · '+m.status, action:`closeModal();showMangelDetail('${m.id}')`, id:m.id});
    });

    // Reparaturen
    (await idbGetAll('reparaturen')).filter(r=>myIds.includes(r.objektId)).forEach(r=>{
      if ((r.titel+' '+(r.beschreibung||'')).toLowerCase().includes(ql))
        results.push({type:'reparatur', icon:'ti-tools', color:'var(--ink-60)', label:r.titel, sub:getObj(r.objektId)?.name+' · '+r.datum, action:`closeModal();showReparaturDetail('${r.id}')`, id:r.id});
    });

    // Protokolle
    (await idbGetAll('protokolle')).filter(p=>myIds.includes(p.objektId)).forEach(p=>{
      if ((p.mieterName+' '+p.objektName+' WE '+(p.weNr||'')).toLowerCase().includes(ql))
        results.push({type:'protokoll', icon:'ti-clipboard-check', color:'var(--green)', label:(p.mieterName||'–')+' · WE '+(p.weNr||'?'), sub:p.objektName+' · '+fmtDate(p.datum), action:`closeModal();editProtokoll('${p.id}')`, id:p.id});
    });

    if (!el) return;
    if (!results.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--ink-40);padding:20px;font-size:13px"><i class="ti ti-search-off" style="font-size:28px;display:block;margin-bottom:6px"></i>Keine Ergebnisse für „'+q+'"</div>';
      return;
    }

    el.innerHTML = '<div style="font-size:11px;color:var(--ink-40);margin-bottom:8px">'+results.length+' Ergebnis'+( results.length!==1?'se':'')+' für „'+q+'"</div>' +
      results.map(r=>`<div style="display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--ink-10);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;background:var(--white)" onclick="${r.action}">
        <div style="width:34px;height:34px;border-radius:8px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:${r.color}">
          <i class="ti ${r.icon}"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.label}</div>
          <div style="font-size:11px;color:var(--ink-40);margin-top:1px">${r.sub}</div>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--ink-20)"></i>
      </div>`).join('');
  }, 300);
}


/* ═══════════════════════════════════════════════════════════
   KALENDER
═══════════════════════════════════════════════════════════ */
const TERMIN_TYPEN = [
  {val:'besichtigung',  label:'Besichtigung',          icon:'ti-eye',           color:'#185FA5'},
  {val:'ablesung',      label:'Ablesung / Zähler',      icon:'ti-gauge',         color:'#2874C0'},
  {val:'wartung',       label:'Wartung / Inspektion',   icon:'ti-tool',          color:'#D4820A'},
  {val:'handwerker',    label:'Handwerker / Reparatur', icon:'ti-tools',         color:'#9E5E24'},
  {val:'uebergabe',     label:'Übergabe / Protokoll',   icon:'ti-clipboard-check', color:'#2E7D52'},
  {val:'kuendigung',    label:'Kündigung / Auszug',     icon:'ti-door-exit',     color:'#C0392B'},
  {val:'mieterhoehung', label:'Mieterhöhung',           icon:'ti-trending-up',   color:'#8B008B'},
  {val:'versicherung',  label:'Versicherung / Behörde', icon:'ti-building-bank', color:'#555'},
  {val:'vertrag',       label:'Vertrag / Versorger',     icon:'ti-file-dollar',   color:'#0E7C7B'},
  {val:'sonstiges',     label:'Sonstiges',               icon:'ti-calendar',      color:'#888'},
];

function getTerminTyp(val) { return TERMIN_TYPEN.find(t=>t.val===val)||TERMIN_TYPEN[TERMIN_TYPEN.length-1]; }

// Kalender-State
let _kalMon = new Date().getMonth();
let _kalYear = new Date().getFullYear();
let _kalView = 'monat'; // 'monat' | 'woche' | 'liste'

async function renderKalender() {
  const el = document.getElementById('page-kalender');
  if (!el) return;

  const myObj  = await getMyObjekte();
  const myIds  = myObj.map(o=>o.id);
  const alle   = (await idbGetAll('termine'))
    .filter(t=>!t.objektId||myIds.includes(t.objektId));

  // Heute-Badge: Termine heute
  const todayStr = today();
  const heuteAnz = alle.filter(t=>t.datum===todayStr&&t.status!=='abgesagt').length;
  const badge = document.getElementById('kalBadge');
  if (badge) { badge.style.display = heuteAnz>0?'flex':'none'; badge.textContent=heuteAnz; }

  const monName = new Date(_kalYear,_kalMon,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});

  let h = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button class="btn btn-sm" onclick="kalNav(-1)"><i class="ti ti-chevron-left"></i></button>
    <div>
      <div style="font-size:16px;font-weight:700;color:var(--ink);text-align:center">${monName}</div>
      <div style="display:flex;gap:4px;justify-content:center;margin-top:4px">
        <button class="filter-chip ${_kalView==='monat'?'active':''}" onclick="kalSetView('monat')">Monat</button>
        <button class="filter-chip ${_kalView==='liste'?'active':''}" onclick="kalSetView('liste')">Liste</button>
      </div>
    </div>
    <button class="btn btn-sm" onclick="kalNav(1)"><i class="ti ti-chevron-right"></i></button>
  </div>`;

  if (_kalView === 'monat') {
    h += renderKalMonat(alle, _kalYear, _kalMon);
  } else {
    h += renderKalListe(alle, _kalYear, _kalMon);
  }

  // Typen-Legende
  h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding:8px;background:var(--ink-05);border-radius:8px">
    ${TERMIN_TYPEN.map(t=>`<span style="font-size:10px;display:flex;align-items:center;gap:3px;color:#444">
      <span style="width:8px;height:8px;border-radius:50%;background:${t.color};flex-shrink:0"></span>${t.label}
    </span>`).join('')}
  </div>`;

  el.innerHTML = h;
  await updateKalBadge();
}

function renderKalMonat(alle, year, mon) {
  const firstDay = new Date(year, mon, 1);
  const lastDay  = new Date(year, mon+1, 0);
  const startDow = (firstDay.getDay()+6)%7; // Mo=0
  const today_   = today();

  let h = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
    ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--ink-40);padding:2px">${d}</div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;grid-auto-rows:62px">`;

  // Leer-Zellen vor dem 1.
  for (let i=0; i<startDow; i++) h += `<div style="min-height:52px"></div>`;

  for (let d=1; d<=lastDay.getDate(); d++) {
    const dateStr = `${year}-${String(mon+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTermine = alle.filter(t=>t.datum===dateStr&&t.status!=='abgesagt');
    const isToday = dateStr===today_;
    const dow = (new Date(year,mon,d).getDay()+6)%7;
    const isWE = dow>=5;

    h += `<div style="height:62px;overflow:hidden;border-radius:6px;padding:3px;background:${isToday?'var(--ink)':'var(--white)'};
      border:1px solid ${isToday?'var(--ink)':'var(--ink-10)'};cursor:pointer;flex-shrink:0"
      onclick="kalDayClick('${dateStr}')">
      <div style="font-size:10px;font-weight:${isToday?'700':'500'};color:${isToday?'#fff':isWE?'var(--ink-40)':'var(--ink)'};text-align:right;margin-bottom:1px;line-height:1.2">${d}</div>
      ${dayTermine.slice(0,2).map(t=>{
        const typ=getTerminTyp(t.typ);
        const kurz=t.titel.length>8?t.titel.slice(0,7)+'…':t.titel;
        return `<div style="font-size:8px;background:${typ.color};color:white;border-radius:2px;padding:1px 2px;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${kurz}</div>`;
      }).join('')}
      ${dayTermine.length>2?`<div style="font-size:8px;color:${isToday?'rgba(255,255,255,.7)':'var(--ink-40)'}">+${dayTermine.length-2}</div>`:''}
    </div>`;
  }
  h += `</div>`;
  return h;
}

function renderKalListe(alle, year, mon) {
  const monStr = `${year}-${String(mon+1).padStart(2,'0')}`;
  const termine = alle.filter(t=>t.datum?.startsWith(monStr)&&t.status!=='abgesagt')
    .sort((a,b)=>a.datum.localeCompare(b.datum)||a.uhrzeit?.localeCompare(b.uhrzeit||''));

  if (!termine.length) return '<div class="empty"><i class="ti ti-calendar-off"></i><p>Keine Termine in diesem Monat</p></div>';

  // Gruppierung nach Datum
  const grouped = {};
  termine.forEach(t=>{ if(!grouped[t.datum]) grouped[t.datum]=[]; grouped[t.datum].push(t); });

  let h = '';
  Object.keys(grouped).sort().forEach(dateStr=>{
    const d = new Date(dateStr+'T12:00:00');
    const label = d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
    const isToday = dateStr===today();
    h += `<div style="font-size:11px;font-weight:700;color:${isToday?'var(--copper)':'var(--ink-40)'};
      text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;display:flex;align-items:center;gap:6px">
      <i class="ti ti-calendar-event" style="font-size:12px"></i>${label}${isToday?' · HEUTE':''}
    </div>`;
    grouped[dateStr].forEach(t=>{ h += terminHTML(t); });
  });
  return h;
}

function terminHTML(t) {
  const typ  = getTerminTyp(t.typ);
  const obj  = t.objektId ? getObj(t.objektId) : null;
  const done = t.status === 'erledigt';
  const abs  = t.status === 'abgesagt';
  return `<div style="background:var(--white);border:1px solid var(--ink-10);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;
    opacity:${abs?0.5:1}" onclick="showTerminDetail('${t.id}')">
    <div style="width:36px;height:36px;border-radius:9px;background:${typ.color}22;display:flex;
      align-items:center;justify-content:center;flex-shrink:0;color:${typ.color}">
      <i class="ti ${typ.icon}"></i>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:600;color:var(--ink);text-decoration:${abs?'line-through':'none'}">
        ${done?'<i class="ti ti-circle-check" style="color:var(--green);font-size:11px"></i> ':''}${t.titel}
      </div>
      <div style="font-size:11px;color:var(--ink-40);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap">
        ${t.uhrzeit?`<span><i class="ti ti-clock" style="font-size:10px"></i> ${t.uhrzeit}${t.uhrzeitEnd?' – '+t.uhrzeitEnd:''}</span>`:''}
        ${obj?`<span><i class="ti ti-building" style="font-size:10px"></i> ${obj.name}</span>`:''}
        ${t.mieterName?`<span><i class="ti ti-user" style="font-size:10px"></i> ${t.mieterName}</span>`:''}
        ${t.zugewiesen?`<span><i class="ti ti-user-check" style="font-size:10px;color:var(--copper)"></i> ${t.zugewiesen}</span>`:''}
        <span class="chip chip-gray" style="font-size:9px;padding:1px 5px">${typ.label}</span>
      </div>
      ${t.notiz?`<div style="font-size:11px;color:var(--ink-60);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.notiz}</div>`:''}
    </div>
  </div>`;
}

function kalNav(dir) { _kalMon+=dir; if(_kalMon>11){_kalMon=0;_kalYear++;}else if(_kalMon<0){_kalMon=11;_kalYear--;} renderKalender(); }
function kalSetView(v) { _kalView=v; renderKalender(); }

async function kalDayClick(dateStr) {
  // Zeige Tages-Termine oder füge neuen hinzu
  const myObj  = await getMyObjekte();
  const myIds  = myObj.map(o=>o.id);
  const termine= (await idbGetAll('termine')).filter(t=>t.datum===dateStr&&(!t.objektId||myIds.includes(t.objektId))&&t.status!=='abgesagt');
  const d = new Date(dateStr+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  if (!termine.length) { modalAddTermin(dateStr); return; }

  showModal(`
    <div class="m-title"><i class="ti ti-calendar-event"></i> ${d}</div>
    ${termine.sort((a,b)=>a.uhrzeit?.localeCompare(b.uhrzeit||'')).map(t=>terminHTML(t)).join('')}
    <button class="btn btn-copper btn-full" style="margin-top:10px" onclick="closeModal();modalAddTermin('${dateStr}')">
      <i class="ti ti-plus"></i> Neuer Termin an diesem Tag
    </button>
    <button class="btn btn-full" style="margin-top:6px" onclick="closeModal()">Schließen</button>`);
}

async function modalAddTermin(prefillDate) {
  const myObj  = await getMyObjekte();
  const mieter = (await idbGetAll('mieter')).filter(m=>myObj.some(o=>o.id===m.objektId)).sort((a,b)=>Number(a.weNr)-Number(b.weNr));
  showModal(`
    <div class="m-title"><i class="ti ti-calendar-plus"></i> Termin eintragen</div>
    <div class="f"><label>Bezeichnung *</label>
      <input type="text" id="tTitel" placeholder="z. B. Heizungswartung WE 3, Besichtigung..."></div>
    <div class="f"><label>Typ</label>
      <select id="tTyp">
        ${TERMIN_TYPEN.map(t=>`<option value="${t.val}">${t.label}</option>`).join('')}
      </select>
    </div>
    <div class="f-row">
      <div class="f"><label>Datum *</label>
        <input type="date" id="tDatum" value="${prefillDate||today()}"></div>
      <div class="f"><label>Uhrzeit (von)</label>
        <input type="time" id="tUhrzeit"></div>
    </div>
    <div class="f-row">
      <div class="f"><label>Uhrzeit (bis)</label>
        <input type="time" id="tUhrzeitEnd"></div>
      <div class="f"><label>Erinnerung</label>
        <select id="tErinnerung">
          <option value="">Keine</option>
          <option value="1">1 Tag vorher</option>
          <option value="2">2 Tage vorher</option>
          <option value="7">1 Woche vorher</option>
        </select>
      </div>
    </div>
    <div class="f"><label>Objekt</label>
      <select id="tObjekt" onchange="loadMieterForTermin(this.value)">
        <option value="">– Kein Objekt –</option>
        ${myObj.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}
      </select>
    </div>
    <div class="f"><label>Mieter (optional)</label>
      <select id="tMieter">
        <option value="">– Kein Mieter –</option>
        ${mieter.map(m=>`<option value="${m.id}">${m.mieter} (WE ${m.weNr} · ${m.objekt||''})</option>`).join('')}
      </select>
    </div>
    <div class="f"><label>Notiz / Details</label>
      <textarea id="tNotiz" style="min-height:60px" placeholder="Weitere Infos, Ansprechpartner, Zugangscode..."></textarea></div>
    <div class="f-row">
      <div class="f"><label>Erstellt von</label>
        <input type="text" id="tErsteller" value="${CU?.name||''}" readonly style="background:var(--ink-05)"></div>
      <div class="f"><label>Zugewiesen an</label>
        <select id="tZugewiesen">
          <option value="">– Niemanden –</option>
          ${(await idbGetAll('users')).filter(u=>u.aktiv!==false).map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="f-row" style="margin-top:12px">
      <button class="btn btn-copper btn-full" onclick="saveTermin()">
        <i class="ti ti-check"></i> Speichern
      </button>
      <button class="btn btn-full" onclick="closeModal()">Abbrechen</button>
    </div>`);
}

async function loadMieterForTermin(objektId) {
  const sel = document.getElementById('tMieter');
  if (!sel) return;
  const mieter = objektId ? (await idbGetAll('mieter','objektId',objektId)).sort((a,b)=>Number(a.weNr)-Number(b.weNr)) : [];
  sel.innerHTML = '<option value="">– Kein Mieter –</option>' +
    mieter.map(m=>`<option value="${m.id}">${m.mieter} (WE ${m.weNr})</option>`).join('');
}

async function saveTermin() {
  const titel = document.getElementById('tTitel')?.value?.trim();
  const datum = document.getElementById('tDatum')?.value;
  if (!titel || !datum) { toast('Bitte Bezeichnung und Datum eingeben'); return; }
  const mieterId = document.getElementById('tMieter')?.value;
  const m = mieterId ? (await idbGet('mieter',mieterId).catch(()=>null)) : null;
  await idbPut('termine', {
    id:         uid(),
    titel,
    typ:        document.getElementById('tTyp')?.value||'sonstiges',
    datum,
    uhrzeit:    document.getElementById('tUhrzeit')?.value||'',
    uhrzeitEnd: document.getElementById('tUhrzeitEnd')?.value||'',
    erinnerung: document.getElementById('tErinnerung')?.value||'',
    objektId:   document.getElementById('tObjekt')?.value||null,
    mieterId:   mieterId||null,
    mieterName: m?.mieter||'',
    notiz:      document.getElementById('tNotiz')?.value||'',
    zugewiesen: document.getElementById('tZugewiesen')?.value||'',
    status:     'offen',
    erstellt:   now(), ersteller: CU?.name||'',
  });
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderKalender();
  toast('Termin gespeichert ✓');
}

async function showTerminDetail(id) {
  const t = await idbGet('termine', id);
  if (!t) return;
  const obj  = t.objektId ? getObj(t.objektId) : null;
  const typ  = getTerminTyp(t.typ);
  const done = t.status==='erledigt';
  const abs  = t.status==='abgesagt';
  const d    = new Date(t.datum+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  showModal(`
    <div class="m-title" style="color:${typ.color}"><i class="ti ${typ.icon}"></i> ${t.titel}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="chip chip-gray">${typ.label}</span>
      ${done?'<span class="chip chip-ok">Erledigt</span>':''}
      ${abs?'<span class="chip chip-err">Abgesagt</span>':''}
    </div>
    <div style="font-size:13px;color:var(--ink-40);margin-bottom:10px;display:flex;flex-direction:column;gap:5px">
      <span><i class="ti ti-calendar" style="font-size:12px"></i> ${d}</span>
      ${t.uhrzeit?`<span><i class="ti ti-clock" style="font-size:12px"></i> ${t.uhrzeit}${t.uhrzeitEnd?' – '+t.uhrzeitEnd:''} Uhr</span>`:''}
      ${obj?`<span><i class="ti ti-building" style="font-size:12px"></i> ${obj.name} · ${obj.ort}</span>`:''}
      ${t.mieterName?`<span><i class="ti ti-user" style="font-size:12px"></i> ${t.mieterName}</span>`:''}
      ${t.ersteller?`<span><i class="ti ti-user-circle" style="font-size:12px"></i> ${t.ersteller} · ${t.erstellt||''}</span>`:''}
      ${t.zugewiesen?`<span><i class="ti ti-user-check" style="font-size:12px;color:var(--copper)"></i> <strong>Zugewiesen an:</strong> ${t.zugewiesen}</span>`:''}
    </div>
    ${t.notiz?`<div style="background:var(--ink-05);border-radius:8px;padding:10px;font-size:13px;line-height:1.6;margin-bottom:12px;white-space:pre-wrap">${t.notiz}</div>`:''}
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${!done&&!abs?`<button class="btn btn-success" onclick="setTerminStatus('${id}','erledigt')"><i class="ti ti-check"></i> Erledigt</button>`:''}
      ${!abs?`<button class="btn btn-sm" onclick="setTerminStatus('${id}','abgesagt')"><i class="ti ti-x"></i> Absagen</button>`:''}
      ${done||abs?`<button class="btn btn-sm" onclick="setTerminStatus('${id}','offen')"><i class="ti ti-rotate-ccw"></i> Öffnen</button>`:''}
      <button class="btn btn-sm" onclick="closeModal();modalEditTermin('${id}')"><i class="ti ti-pencil"></i> Bearbeiten</button>
      <button class="btn btn-sm btn-danger" onclick="deleteTermin('${id}')"><i class="ti ti-trash"></i></button>
    </div>`);
}

async function setTerminStatus(id, status) {
  const t = await idbGet('termine', id);
  if (!t) return;
  t.status = status;
  await idbPut('termine', t);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderKalender();
  toast(status==='erledigt'?'Termin erledigt ✓':status==='abgesagt'?'Termin abgesagt':'Termin wieder offen');
}

      <input type="text" id="tTitel" value="${t.titel}"></div>
    <div class="f"><label>Typ</label>
      <select id="tTyp">${TERMIN_TYPEN.map(tp=>`<option value="${tp.val}" ${tp.val===t.typ?'selected':''}>${tp.label}</option>`).join('')}</select>
    </div>
    <div class="f-row">
      <div class="f"><label>Datum</label><input type="date" id="tDatum" value="${t.datum}"></div>
      <div class="f"><label>Uhrzeit (von)</label><input type="time" id="tUhrzeit" value="${t.uhrzeit||''}"></div>
    </div>
    <div class="f"><label>Uhrzeit (bis)</label><input type="time" id="tUhrzeitEnd" value="${t.uhrzeitEnd||''}"></div>
    <div class="f"><label>Objekt</label>
      <select id="tObjekt">
        <option value="">– Kein Objekt –</option>
        ${myObj.map(o=>`<option value="${o.id}" ${o.id===t.objektId?'selected':''}>${o.name}</option>`).join('')}
      </select>
    </div>

  t.typ        = document.getElementById('tTyp')?.value||t.typ;
  t.datum      = document.getElementById('tDatum')?.value||t.datum;
  t.uhrzeit    = document.getElementById('tUhrzeit')?.value||'';
  t.uhrzeitEnd = document.getElementById('tUhrzeitEnd')?.value||'';
  t.objektId   = document.getElementById('tObjekt')?.value||null;

  await idbPut('termine', t);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderKalender();
  toast('Gespeichert ✓');
}

async function deleteTermin(id) {

  await idbDelete('termine', id);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(),3000);
  await renderKalender();
}

async function updateKalBadge() {
  const myObj = await getMyObjekte();
  const myIds = myObj.map(o=>o.id);
  const todayStr = today();
  const alle = (await idbGetAll('termine')).filter(t=>(!t.objektId||myIds.includes(t.objektId))&&t.status!=='abgesagt');
  // Badge: Termine heute + in den nächsten 7 Tagen
  const next7 = new Date(); next7.setDate(next7.getDate()+7);
  const next7Str = next7.toISOString().split('T')[0];
  const relevant = alle.filter(t=>t.datum>=todayStr&&t.datum<=next7Str).length;
  const badge = document.getElementById('kalBadge');
  if (badge) { badge.style.display=relevant>0?'flex':'none'; badge.textContent=relevant; }
}

function addPersonRow() {
  const liste = document.getElementById('personenListe');
  const i = liste.children.length;

  div.className = 'f-row'; div.style.marginBottom = '4px'; div.id = 'pRow_'+i;
  div.innerHTML = `<select id="pAnr_${i}" style="width:70px;padding:8px 4px;border:1.5px solid var(--ink-10);border-radius:var(--radius);font-size:12px;margin-right:4px"><option>Herr</option><option>Frau</option><option>Divers</option></select><div class="f"><input type="text" id="pName_${i}" placeholder="Vor- und Nachname" style="font-size:13px"></div>

  liste.appendChild(div);
  document.getElementById('mPersonen').value = liste.children.length;
}

function removePerson(idx) {
  const el = document.getElementById('pRow_'+idx);
  if (el) { el.remove(); document.getElementById('mPersonen').value = document.getElementById('personenListe').children.length; }
}

function syncPersonenAnzahl(n) {
  const liste = document.getElementById('personenListe');
  const current = liste.children.length;
  const target = parseInt(n)||1;
  for (let i = current; i < target; i++) addPersonRow();
  for (let i = current-1; i >= target; i--) {
    const el = document.getElementById('pRow_'+i);
    if (el && i > 0) el.remove();
  }
}

function getPersonenFromForm() {
  const liste = document.getElementById('personenListe');
  const result = [];
  for (let i = 0; i < liste.children.length; i++) {
    const name = document.getElementById('pName_'+i)?.value?.trim();
    const geb  = document.getElementById('pGeb_'+i)?.value;
    const anr  = document.getElementById('pAnr_'+i)?.value || (i===0 ? (document.getElementById('mAnrede')?.value||'Herr') : 'Herr');
    if (name) result.push({name, geburtsdatum: geb||'', anrede: anr});
  }
  return result;
}

// Reaktion auf WE-Auswahl: Daten übernehmen + Hinweis zu Mieterwechsel
function onAddMieterWeChange() {
  const sel = document.getElementById('mWeSelect');
  const neuWrap = document.getElementById('mWeNeuWrap');
  const info = document.getElementById('mWeInfo');
  if (!sel) return;
  const val = sel.value;
  if (val === '__neu') {
    neuWrap.style.display = 'block';
    info.style.display = 'none';
    return;
  }
  neuWrap.style.display = 'none';
  const weMap = window._addMieterWeMap || {};
  const cur = weMap[val];
  if (!val || !cur) { info.style.display = 'none'; return; }
  // Hinweis je nachdem, ob die Wohnung aktuell belegt ist
  if (cur.mieter && !cur.leerstand) {
    info.style.display = 'block';
    info.innerHTML = `<i class="ti ti-info-circle"></i> Diese Wohnung ist derzeit an <strong>${cur.mieter}</strong> vermietet
      (Fläche ${cur.flaeche?cur.flaeche+' m²':'–'}, ${cur.etage||'–'}).<br>
      Der neue Mieter wird als <strong>zukünftiger Mieter</strong> erfasst. Sobald der Mietbeginn erreicht ist,
      rückt er automatisch in die Übersicht auf und ${cur.mieter} wird als Vormieter hinterlegt.`;
  } else {
    info.style.display = 'block';
    info.innerHTML = `<i class="ti ti-info-circle"></i> Wohnung WE ${val} ist als Leerstand / frei erfasst
      (Fläche ${cur.flaeche?cur.flaeche+' m²':'–'}, ${cur.etage||'–'}). Die Wohnungsdaten werden übernommen.`;
  }
}

async function saveNewMieter(objektId) {
  const persListe = getPersonenFromForm();
  const name = persListe[0]?.name || document.getElementById('pName_0')?.value?.trim() || '';
  const sel  = document.getElementById('mWeSelect')?.value || '';
  if (!name) { toast('Name der ersten Person ist ein Pflichtfeld'); return; }
  if (!sel)  { toast('Bitte eine Wohneinheit auswählen'); return; }

  const obj = getObj(objektId);
  const weMap = window._addMieterWeMap || {};
  let weNr, flaeche, etage, vorhanden = null;

  if (sel === '__neu') {
    weNr = document.getElementById('mWeNrNeu')?.value?.trim();
    if (!weNr) { toast('Bitte WE-Nr. für die neue Wohneinheit eingeben'); return; }
    flaeche = document.getElementById('mFlaecheNeu')?.value || '';
    etage   = document.getElementById('mEtageNeu')?.value || '';
  } else {
    weNr = sel;
    vorhanden = weMap[weNr] || null;
    flaeche = vorhanden?.flaeche || '';
    etage   = vorhanden?.etage || '';
  }

  const einzugRaw = document.getElementById('mEinzug')?.value;
  if (!einzugRaw) { toast('Bitte Mietbeginn angeben'); return; }
  const einzugDate = new Date(einzugRaw);
  const heute = new Date(); heute.setHours(0,0,0,0);
  const istZukunft = einzugDate > heute;

  const miete = parseFloat(document.getElementById('mMiete')?.value)||'';
  const nk    = parseFloat(document.getElementById('mNk')?.value)||'';

  const neuerMieter = {
    id: 'm_' + objektId + '_' + weNr + '_' + name.replace(/\W/g,'').slice(0,10) + '_' + Date.now().toString(36),
    objektId, objekt: obj?.name||'',
    weNr, etage, flaeche,
    mieter: name,
    anrede: document.getElementById('mAnrede')?.value || 'Herr',
    personen: parseInt(document.getElementById('mPersonen')?.value)||persListe.length||1,
    personen_liste: persListe,
    miete, nk,
    gesamt: (parseFloat(miete)||0)+(parseFloat(nk)||0) || '',
    einzug: einzugDate.toLocaleDateString('de-DE'),
    einzugISO: einzugRaw,
    kaution: parseFloat(document.getElementById('mKaution')?.value)||'',
    telefon: document.getElementById('mTel')?.value||'',
    email:   document.getElementById('mEmail')?.value||'',
    tgNr:    document.getElementById('mTgNr')?.value||'',
    leerstand: false,
  };

  if (istZukunft && vorhanden && vorhanden.mieter && !vorhanden.leerstand) {
    // Zukünftiger Mieter: noch nicht aktiv, alter Mieter bleibt vorerst sichtbar
    neuerMieter._zukuenftig = true;
    neuerMieter._ersetztMieterId = vorhanden.id;
    await idbPut('mieter', neuerMieter);
    toast(`Zukünftiger Mieter erfasst – aktiv ab ${neuerMieter.einzug}`);
  } else {
    // Sofort aktiv: ggf. vorhandenen Mieter zum Vormieter machen
    if (vorhanden && vorhanden.mieter && !vorhanden.leerstand && vorhanden.id !== neuerMieter.id) {
      await mieterZuVormieter(vorhanden, neuerMieter);
    } else if (vorhanden && vorhanden.leerstand) {
      // Leerstand-Datensatz mit neuem Mieter überschreiben (gleiche WE freigeben)
      await idbDelete('mieter', vorhanden.id).catch(()=>{});
    }
    await idbPut('mieter', neuerMieter);
    toast('Mieter gespeichert ✓');
  }

  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  const tabEl = document.getElementById('objTabContent');
  if (tabEl) await renderObjMieter(tabEl);
  await renderDash();
}

// Macht einen bisherigen Mieter zum Vormieter und verknüpft ihn mit dem Nachmieter.
// Übernimmt die neue Adresse aus dem letzten Auszugsprotokoll, falls vorhanden.
async function mieterZuVormieter(alt, neu) {
  alt._vormieter = true;
  alt._nachmieterId = neu.id;
  alt.auszug = alt.auszug || neu.einzug;
  // Neue Adresse aus letztem Protokoll des alten Mieters ziehen
  try {
    const prots = (await idbGetAll('protokolle')).filter(p=>p.mieterId===alt.id);
    const letzt = prots.sort((a,b)=>new Date(b.datum||0)-new Date(a.datum||0))[0];
    const adr = letzt?.neueAdresse || letzt?.neue_anschrift || letzt?.mieterNeueAdresse;
    if (adr && !alt.neueAdresse) alt.neueAdresse = adr;
  } catch(e){}
  await idbPut('mieter', alt);
  neu._vormieterId = alt.id;
  // neu wird vom Aufrufer gespeichert
}

// Stellt Fotos einer unterbrochenen Mangel-Erfassung wieder her
async function restoreMangelFotos(){
  let offen = [];
  try { offen = await idbGetAll('fotos', 'protId', '__mangel_offen__'); } catch(e){ return; }
  if(!offen.length) return;
  if(!confirm(`Es liegen ${offen.length} Foto(s) aus einer nicht abgeschlossenen Mangel-Erfassung vor. Übernehmen?`)){
    // Verworfen: aufräumen
    for(const fo of offen) await idbDelete('fotos', fo.id).catch(()=>{});
    return;
  }
  window._mangelPhotos = offen.map(f=>f.data);
  window._mangelFotoIds = offen.map(f=>f.id);
  const grid = document.getElementById('mgPhotoGrid');
  if(grid){
    grid.style.display='grid';
    grid.innerHTML = window._mangelPhotos.map((p,i) =>
      '<div class="ph-thumb"><img src="'+p+'"><button class="ph-del" onclick="delMangelFoto('+i+')">'+String.fromCharCode(10005)+'</button></div>'
    ).join('');
  }
}

function delMangelFoto(i){
  window._mangelPhotos.splice(i,1);
  if(window._mangelFotoIds && window._mangelFotoIds[i]){
    idbDelete('fotos', window._mangelFotoIds[i]).catch(()=>{});
    window._mangelFotoIds.splice(i,1);
  }
  const grid=document.getElementById('mgPhotoGrid');
  if(grid){
    grid.innerHTML = window._mangelPhotos.map((p,idx) =>
      '<div class="ph-thumb"><img src="'+p+'"><button class="ph-del" onclick="delMangelFoto('+idx+')">'+String.fromCharCode(10005)+'</button></div>'
    ).join('');
    if(!window._mangelPhotos.length) grid.style.display='none';
  }
}

async function saveMangel(){
  const titel=document.getElementById('mgTitel').value.trim();
  if(!titel){toast('Bitte Bezeichnung eingeben');return;}
  const objektId=document.getElementById('mgObjId').value;
  const mieterId=document.getElementById('mgMietId').value;
  const m=mieterId?(await idbGet('mieter',mieterId)):null;
  const istRep=document.getElementById('mgIstRep')?.checked||false;
  const teile=parseFloat(document.getElementById('mgTeile')?.value)||0;
  const stunden=parseFloat(document.getElementById('mgStunden')?.value)||0;
  const satz=parseFloat(document.getElementById('mgSatz')?.value)||0;
  const arbeit=stunden*satz, gesamt=teile+arbeit;
  const nummer=await naechsteMangelNr(objektId);
  const entry={
    id:uid(),type:istRep?'reparatur':'mangel',istReparatur:istRep,nummer,
    objektId, mieterId:mieterId||null, weNr:m?.weNr||'',
    titel,schwere:document.getElementById('mgSchwere').value,
    datum:document.getElementById('mgDatum').value,
    beschreibung:document.getElementById('mgBeschr').value,
    kostenTeile:teile||null, stunden:stunden||null, stundensatz:satz||null,
    kostenArbeit:arbeit||null, kosten:gesamt||null,
    status:document.getElementById('mgStatus').value,
    fotos:window._mangelPhotos||[],
    erstellt:now(),ersteller:CU?.name||'',
  };
  await idbPut('maengel',entry);
  try {
    const offen = await idbGetAll('fotos', 'protId', '__mangel_offen__');
    for(const fo of offen) await idbDelete('fotos', fo.id).catch(()=>{});
  } catch(e){}
  window._mangelFotoIds = [];
  closeModal(); bcSend('mangel_changed',{});
  await refreshAufgaben(); await renderDash();
  if(curPage==='objekt') await renderObjTab('maengel');
  toast(`Erfasst ✓ (${nummer})`);
}

async function naechsteMangelNr(objektId){
  const obj=getObj(objektId);
  const gruppe=obj?.nr||0;
  const alle=await idbGetAll('maengel');
  let max=0;
  for(const x of alle){
    if(!x.nummer) continue;
    const mt=String(x.nummer).match(/^M-(\d+)-(\d+)$/);
    if(mt && parseInt(mt[1],10)===gruppe){ const nn=parseInt(mt[2],10); if(nn>max) max=nn; }
  }
  return `M-${gruppe}-${String(max+1).padStart(3,'0')}`;
}

const ROOMS=['Flur / Diele','Wohnzimmer','Schlafzimmer 1','Schlafzimmer 2','Schlafzimmer 3',
  'Küche','Badezimmer','Gäste-WC','Abstellraum','Keller','Balkon / Terrasse'];
const CONDS=['Wände / Decken','Boden / Fußleisten','Fenster / Rollläden','Türen / Türrahmen',
  'Elektro / Schalter','Heizung / Heizkörper','Sonstiges'];
// Raumspezifische Zustandsfelder
const ROOMS_NEBEN=['Abstellraum','Keller','Balkon / Terrasse']; // nur Grundfelder
const ROOMS_FLIESEN=['Badezimmer','Gäste-WC','Küche'];           // zusätzlich Fliesen
const ROOM_EXTRA_CONDS={
  'Badezimmer':['Waschbecken / Armatur','Dusche / Duschwanne','Badewanne','Toilette / Spülkasten'],
  'Gäste-WC':['Waschbecken / Armatur','Toilette / Spülkasten'],
};
// Liefert die exakte Feldliste je Raum
function condsForRoom(rn){
  if(ROOMS_NEBEN.includes(rn)){
    return ['Wände / Decken','Boden / Fußleisten','Türen / Türrahmen','Elektro / Schalter','Sonstiges'];
  }
  let base=['Wände / Decken','Boden / Fußleisten','Fenster / Rollläden','Türen / Türrahmen','Elektro / Schalter','Heizung / Heizkörper'];
  if(ROOMS_FLIESEN.includes(rn)) base.push('Fliesen');
  base=base.concat(ROOM_EXTRA_CONDS[rn]||[]);
  base.push('Sonstiges');
  return base;
}
const COND_V=['Einwandfrei','Leichte Gebrauchsspuren','Renovierungsbedarf','Beschädigt','Entfällt'];
const PROT_STEPS=['Objekt','Räume','Zähler','Schlüssel','Mängel','Unterschriften'];
