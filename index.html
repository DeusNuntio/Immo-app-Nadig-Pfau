<style>
/* ═══════════════════════ DESIGN SYSTEM ═══════════════════════ */
:root{
  /* ── Nadig Pfau Blau-Palette ── */
  --ink:#0C447C;--ink-80:#185FA5;--ink-60:#2874C0;--ink-40:#5B96CC;
  --ink-20:#A8C8E8;--ink-10:#D6E8F5;--ink-05:#EEF4FB;--ink-02:#F6FAFD;
  /* Akzent: Mittelblau (ersetzt copper/orange) */
  --copper:#185FA5;--copper-l:#2874C0;--copper-d:#0C447C;--copper-bg:#EEF4FB;
  /* Pfauenauge-Hellblau als Highlight */
  --highlight:#85B7EB;--highlight-bg:#E8F2FB;
  --green:#2E7D52;--green-l:#E6F4EC;
  --red:#C0392B;--red-l:#FDECEA;
  --amber:#D4820A;--amber-l:#FEF3E2;
  --white:#FFF;--surface:#F0F5FB;
  --radius:10px;--radius-sm:6px;--radius-lg:16px;--radius-xl:20px;
  --shadow:0 2px 12px rgba(12,68,124,.10);--shadow-lg:0 8px 32px rgba(12,68,124,.18);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --hdr:56px;--nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;font-family:var(--font)}
body{background:var(--surface);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}

/* ── SCREENS ── */
.screen{display:none;height:100vh;flex-direction:column;overflow:hidden;position:fixed;inset:0}
.screen.active{display:flex}

/* ── SPLASH ── */
#splashScreen{background:var(--ink);align-items:center;justify-content:center}
.splash-logo{text-align:center;animation:fadeUp .6s ease}
.splash-icon{width:80px;height:80px;background:var(--copper);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:40px;color:#fff;margin-bottom:16px;box-shadow:0 8px 32px rgba(201,123,58,.4)}
.splash-title{font-size:26px;font-weight:600;color:#fff;letter-spacing:-.5px}
.splash-sub{font-size:13px;color:var(--ink-20);margin-top:4px}
.splash-loader{width:48px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin:24px auto 0;overflow:hidden}
.splash-loader-bar{height:100%;background:var(--copper);border-radius:2px;animation:loading 1.5s ease infinite}
@keyframes loading{0%{width:0;transform:translateX(0)}50%{width:100%}100%{width:0;transform:translateX(48px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGIN ── */
#loginScreen{background:var(--ink);align-items:center;justify-content:center;position:relative;overflow:hidden}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 25% 15%,rgba(201,123,58,.2) 0%,transparent 55%),radial-gradient(ellipse at 75% 85%,rgba(46,74,98,.6) 0%,transparent 55%)}
.login-box{position:relative;z-index:1;width:100%;max-width:400px;padding:24px}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand-icon{width:60px;height:60px;background:var(--copper);border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin-bottom:12px;box-shadow:0 4px 20px rgba(201,123,58,.4)}
.login-brand h1{font-size:22px;font-weight:600;color:#fff;letter-spacing:-.3px}
.login-brand p{font-size:13px;color:var(--ink-20);margin-top:3px}
.login-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-xl);padding:24px;backdrop-filter:blur(16px)}
.lg{margin-bottom:14px}
.lg label{display:block;font-size:11px;font-weight:600;color:var(--ink-20);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.lg input,.lg select{width:100%;padding:12px 14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:var(--radius);color:#fff;font-size:15px;font-family:var(--font);transition:border-color .15s}
.lg input::placeholder{color:rgba(255,255,255,.3)}
.lg input:focus,.lg select:focus{outline:none;border-color:var(--copper)}
.lg select option{background:var(--ink-80)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pin-dot{height:48px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;cursor:pointer;transition:all .15s;font-family:var(--mono);user-select:none}
.pin-dot:active{background:rgba(201,123,58,.3);border-color:var(--copper)}
.pin-dot.del{font-size:18px}
.pin-display{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.pin-circle{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:all .2s}
.pin-circle.filled{background:var(--copper);border-color:var(--copper)}
.btn-login{width:100%;padding:14px;background:var(--copper);border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s;letter-spacing:.1px}
.btn-login:active{background:var(--copper-d)}
.login-err{background:rgba(192,57,43,.2);border:1px solid rgba(192,57,43,.3);border-radius:8px;padding:10px 12px;color:#ff9b93;font-size:13px;margin-top:10px;display:none}
.login-err.show{display:block}

/* ── APP SHELL ── */
#appScreen{background:var(--surface)}
.app-header{height:var(--hdr);background:var(--ink);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.25);z-index:10}
.hdr-back{width:36px;height:36px;border:none;background:rgba(255,255,255,.09);border-radius:8px;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hdr-back.vis{display:flex}
.hdr-titles{flex:1;min-width:0}
.hdr-title{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:var(--ink-20);margin-top:1px}
.hdr-actions{display:flex;gap:6px;flex-shrink:0}
.hdr-btn{width:36px;height:36px;border:none;background:rgba(255,255,255,.09);border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s}
.hdr-btn:active{background:rgba(255,255,255,.2)}
.hdr-sync{position:relative}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:absolute;top:6px;right:6px;border:2px solid var(--ink)}
.sync-dot.pending{background:var(--amber)}
.sync-dot.offline{background:var(--red)}

/* ── CONTENT ── */
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + 12px);-webkit-overflow-scrolling:touch}
.page{display:none;padding:14px;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── BOTTOM NAV ── */
.bottom-nav{height:var(--nav);background:var(--ink);display:flex;flex-shrink:0;box-shadow:0 -2px 16px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--ink-40);cursor:pointer;font-family:var(--font);padding:8px 4px;position:relative;transition:color .15s}
.nav-btn i{font-size:22px;transition:transform .15s}
.nav-btn span{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.nav-btn.active{color:var(--copper)}
.nav-btn.active i{transform:translateY(-2px)}
.nav-badge{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;background:var(--red);border-radius:8px;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--mono)}

/* ── CARDS ── */
.card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--ink-10);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-hdr{font-size:12px;font-weight:600;color:var(--ink-40);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-hdr i{font-size:15px;color:var(--copper)}

/* ── OBJEKT CARDS ── */
.obj-card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--ink-10);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;align-items:center;gap:12px}
.obj-card:active{transform:scale(.98);box-shadow:none}
.obj-icon{width:46px;height:46px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;color:#fff}
.obj-icon.c-kr{background:var(--copper)}
.obj-icon.c-mg{background:var(--ink-60)}
.obj-icon.c-dus{background:var(--ink-80)}
.obj-icon.c-mon{background:#2E7D52}
.obj-body{flex:1;min-width:0}
.obj-name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.obj-meta{font-size:12px;color:var(--ink-40);margin-top:2px}
.obj-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.chip-active{background:var(--ink);color:#fff;border:1px solid var(--ink)}
button.chip{padding:6px 14px;font-size:12px;white-space:nowrap;background:var(--ink-05);color:var(--ink-60);border:1px solid var(--ink-10);cursor:pointer;flex-shrink:0}
button.chip.chip-active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip-gray{background:var(--ink-05);color:var(--ink-60)}
.chip-warn{background:var(--amber-l);color:var(--amber)}
.chip-ok{background:var(--green-l);color:var(--green)}
.chip-err{background:var(--red-l);color:var(--red)}
.chip-copper{background:var(--copper-bg);color:var(--copper-d)}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--ink-10);padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat-n{font-size:28px;font-weight:600;color:var(--ink);font-family:var(--mono);letter-spacing:-1.5px;line-height:1}
.stat-l{font-size:11px;color:var(--ink-40);margin-top:3px;font-weight:500}
.stat.hl .stat-n{color:var(--copper)}

/* ── MIETER LIST ── */
.mieter-row{background:var(--white);border-radius:var(--radius);border:1px solid var(--ink-10);padding:11px 13px;margin-bottom:7px;cursor:pointer;display:flex;gap:11px;align-items:center;transition:border-color .15s}
.mieter-row:active{border-color:var(--copper)}
.m-avatar{width:40px;height:40px;border-radius:10px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--ink-60);flex-shrink:0;font-family:var(--mono)}
.m-body{flex:1;min-width:0}
.m-name{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.m-sub{font-size:12px;color:var(--ink-40);margin-top:2px}
.m-we{font-size:11px;font-weight:700;color:var(--copper);background:var(--copper-bg);border-radius:4px;padding:2px 7px;font-family:var(--mono);flex-shrink:0}

/* ── DETAIL HEADER ── */
.det-hdr{background:var(--ink);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px;color:#fff}
.det-av-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.det-av{width:54px;height:54px;border-radius:13px;background:var(--copper);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0;font-family:var(--mono)}
.det-name{font-size:18px;font-weight:600;letter-spacing:-.3px}
.det-we{font-size:12px;color:var(--ink-20);margin-top:3px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.det-field{background:rgba(255,255,255,.08);border-radius:8px;padding:9px 11px}
.det-field label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-20);display:block;margin-bottom:2px}
.det-field span{font-size:13px;font-weight:500;color:#fff}
.det-field a{color:var(--copper-l)}

/* ── FORM ── */
.f-section{margin-bottom:18px}
.f-section-title{font-size:11px;font-weight:700;color:var(--ink-40);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;display:flex;align-items:center;gap:5px;padding-bottom:6px;border-bottom:1px solid var(--ink-10)}
.f-section-title i{color:var(--copper);font-size:13px}
.f{margin-bottom:9px}
.f label{font-size:12px;font-weight:500;color:var(--ink-60);display:block;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ink-10);border-radius:var(--radius);background:#fff;color:var(--ink);font-size:14px;font-family:var(--font);transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--copper)}
.f textarea{resize:vertical;min-height:72px;line-height:1.5}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-row.t3{grid-template-columns:1fr 1fr 1fr}
.f-row.t4{grid-template-columns:1fr 1fr 1fr 1fr}

/* ── BUTTONS ── */
.btn{padding:10px 16px;border-radius:var(--radius);border:1.5px solid var(--ink-10);background:#fff;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn i{font-size:15px}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-copper{background:var(--copper);color:#fff;border-color:var(--copper)}
.btn-copper:active{background:var(--copper-d)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{border-color:#fcc;color:var(--red);background:var(--red-l)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-full{width:100%;justify-content:center}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:12px}

/* ── TABS ── */
.tab-bar{display:flex;gap:4px;background:var(--ink-05);border-radius:10px;padding:4px;margin-bottom:14px}
.tab-btn{flex:1;padding:8px 6px;border:none;border-radius:8px;background:transparent;color:var(--ink-40);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap;text-align:center}
.tab-btn.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* ── TASK ITEMS ── */
.task-item{background:var(--white);border-radius:var(--radius);border:1px solid var(--ink-10);padding:11px 12px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
.t-prio{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;margin-top:2px}
.prio-h{background:var(--red)}
.prio-m{background:var(--amber)}
.prio-l{background:var(--green)}
.t-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-20);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.t-check.done{background:var(--green);border-color:var(--green);color:#fff}
.t-body{flex:1;min-width:0}
.t-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.4}
.t-title.done{text-decoration:line-through;color:var(--ink-40)}
.t-meta{font-size:11px;color:var(--ink-40);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.t-actions{display:flex;gap:4px;flex-shrink:0}

/* ── PHOTO ── */
.ph-area{border:2px dashed var(--ink-10);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--ink-02)}
.ph-area:active{border-color:var(--copper);background:var(--copper-bg)}
.ph-area i{font-size:28px;color:var(--ink-20);display:block;margin-bottom:5px}
.ph-area span{font-size:13px;color:var(--ink-40)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px;margin-bottom:9px}
.ph-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--ink-10)}
.ph-thumb img{width:100%;height:100%;object-fit:cover}
.ph-del{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.65);border:none;border-radius:50%;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ── SIGNATURE ── */
.sig-pad{display:block;width:100%;height:180px;border:2px solid var(--copper);border-radius:var(--radius);background:#fff;touch-action:none;cursor:crosshair}
.sig-row{display:flex;gap:8px;margin-top:6px}

/* ── ROOM TABS ── */
.room-scroll{overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.room-scroll::-webkit-scrollbar{display:none}
.room-tabs{display:flex;gap:5px;width:max-content;padding:3px 0}
.room-tab{padding:7px 13px;border-radius:20px;border:1.5px solid var(--ink-10);background:#fff;color:var(--ink-40);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:var(--font)}
.room-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.room-tab.has-data{border-color:var(--green);color:var(--green);background:var(--green-l)}
.room-tab.active.has-data{background:var(--ink);color:#fff}

/* ── COND GRID ── */
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.cond-item label{font-size:11px;font-weight:600;color:var(--ink-40);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px}
.cond-item select{width:100%;padding:8px 9px;border:1.5px solid var(--ink-10);border-radius:var(--radius-sm);background:#fff;font-size:13px;font-family:var(--font)}

/* ── KEY GRID ── */
.key-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key-box{background:var(--ink-05);border-radius:var(--radius);padding:10px;text-align:center}
.key-box label{font-size:10px;font-weight:700;color:var(--ink-40);text-transform:uppercase;display:block;margin-bottom:5px}
.key-box input{width:60px;padding:7px;text-align:center;border:1.5px solid var(--ink-10);border-radius:7px;font-size:20px;font-weight:700;color:var(--copper);background:#fff;font-family:var(--mono)}

/* ── STEP INDICATOR ── */
.steps{display:flex;align-items:center;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.steps::-webkit-scrollbar{display:none}
.step-dot{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;min-width:56px}
.step-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-10);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink-40);font-family:var(--mono);transition:all .2s;background:#fff}
.step-dot.done .step-circle{background:var(--green);border-color:var(--green);color:#fff}
.step-dot.cur .step-circle{background:var(--copper);border-color:var(--copper);color:#fff}
.step-lbl{font-size:10px;color:var(--ink-40);text-align:center}
.step-dot.cur .step-lbl{color:var(--copper);font-weight:600}
.step-line{flex:1;height:2px;background:var(--ink-10);margin-bottom:12px;flex-shrink:0;min-width:12px}
.step-line.done{background:var(--green)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(13,31,45,.7);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:18px;animation:slideUp .22s ease}
.m-handle{width:34px;height:4px;background:var(--ink-10);border-radius:2px;margin:0 auto 14px}
.m-title{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.m-title i{color:var(--copper);font-size:18px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--nav) + 14px);right:14px;width:52px;height:52px;background:var(--copper);border:none;border-radius:50%;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 18px rgba(201,123,58,.5);display:none;align-items:center;justify-content:center;z-index:50;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab.visible{display:flex}

/* ── SECTION HEADER ── */
.s-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.s-title{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.2px}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--ink-10);margin:14px 0}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:36px 16px;color:var(--ink-40)}
.empty i{font-size:44px;display:block;margin-bottom:10px;color:var(--ink-10)}
.empty p{font-size:13px;line-height:1.6}

/* ── UPLOAD ZONE ── */
.upload-zone{border:2px dashed var(--ink-10);border-radius:var(--radius-lg);padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:active,.upload-zone.drag{border-color:var(--copper);background:var(--copper-bg)}
.upload-zone i{font-size:38px;color:var(--ink-20);display:block;margin-bottom:10px}
.upload-zone h3{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
.upload-zone p{font-size:13px;color:var(--ink-40)}

/* ── SYNC INDICATOR ── */
.sync-bar{background:var(--amber);color:#fff;font-size:12px;font-weight:500;padding:6px 14px;text-align:center;display:none}
.sync-bar.show{display:block}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav) + 78px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* ── PROTOKOLL LIST ITEM ── */
.prot-item{background:var(--white);border-radius:var(--radius);border:1px solid var(--ink-10);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer}
.prot-icon{width:36px;height:36px;border-radius:9px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--copper);flex-shrink:0}
.prot-body{flex:1;min-width:0}
.prot-title{font-size:13px;font-weight:600;color:var(--ink)}
.prot-sub{font-size:11px;color:var(--ink-40);margin-top:2px}

/* ── USER LIST ── */
.user-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ink-10)}
.user-item:last-child{border:none}
.user-av{width:38px;height:38px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.user-av.admin{background:var(--copper)}
.user-body{flex:1}
.user-name{font-size:14px;font-weight:600;color:var(--ink)}
.user-role{font-size:12px;color:var(--ink-40);margin-top:1px}

/* ── SETTINGS ── */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--ink-10);cursor:pointer}
.settings-row:last-child{border:none}
.settings-row-left{display:flex;align-items:center;gap:10px}
.settings-row-icon{width:34px;height:34px;border-radius:8px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--copper)}
.settings-row-text .title{font-size:14px;font-weight:500;color:var(--ink)}
.settings-row-text .sub{font-size:12px;color:var(--ink-40);margin-top:1px}

/* ── RESPONSIVE ── */
@media(max-width:380px){
  .f-row{grid-template-columns:1fr}
  .f-row.t3{grid-template-columns:1fr 1fr}
  .cond-grid{grid-template-columns:1fr}
  .key-grid{grid-template-columns:repeat(2,1fr)}
  .stats-row{grid-template-columns:1fr 1fr}
  .det-grid{grid-template-columns:1fr}
}
@media(min-width:768px){
  .app-body{max-width:680px;margin:0 auto}
  .stats-row{grid-template-columns:repeat(4,1fr)}
}
@media print{
  .bottom-nav,.app-header,.fab,.modal-bg{display:none!important}
  .app-body{padding-bottom:0!important;overflow:visible!important}
  .page{display:block!important}
}

/* ── SUCHE & FILTER ── */
.search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-input{flex:1;padding:10px 14px 10px 36px;border:1.5px solid var(--ink-10);border-radius:var(--radius);background:#fff;color:var(--ink);font-size:14px;font-family:var(--font)}
.search-input:focus{outline:none;border-color:var(--copper)}
.search-wrap{position:relative;flex:1}
.search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-40);font-size:16px;pointer-events:none}
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px 0}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--ink-10);background:#fff;color:var(--ink-40);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:var(--font);transition:all .15s;flex-shrink:0}
.filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter-chip.active.copper{background:var(--copper);border-color:var(--copper)}
/* ── MANGEL DETAIL ── */
.mangel-detail-hdr{background:var(--ink);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;color:#fff}
.status-timeline{border-left:2px solid var(--ink-10);margin-left:10px;padding-left:16px}
.timeline-item{position:relative;margin-bottom:12px}
.timeline-item::before{content:'';position:absolute;left:-21px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--copper);border:2px solid #fff}
.timeline-date{font-size:11px;color:var(--ink-40)}
.timeline-text{font-size:13px;color:var(--ink);margin-top:1px}
/* ── FOTO GALERIE ── */
.foto-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.foto-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--ink-10)}
.foto-item img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.foto-item:active img{transform:scale(.95)}
.foto-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column}
.foto-overlay.open{display:flex}
.foto-overlay img{max-width:95vw;max-height:80vh;object-fit:contain;border-radius:8px}
.foto-overlay-close{position:absolute;top:16px;right:16px;width:40px;height:40px;background:rgba(255,255,255,.15);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ── QUICK ACTIONS ── */
.quick-actions{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.quick-actions::-webkit-scrollbar{display:none}
.qa-btn{padding:10px 16px;border-radius:var(--radius);border:1.5px solid var(--ink-10);background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font);white-space:nowrap;flex-shrink:0;transition:all .15s}
.qa-btn:active{transform:scale(.96)}
.qa-btn.copper{background:var(--copper-bg);border-color:var(--copper);color:var(--copper-d)}
.qa-btn i{font-size:16px;color:var(--copper)}
/* ── AKTIVITÄTS-FEED ── */
.activity-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--ink-10)}
.activity-item:last-child{border:none}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--copper);flex-shrink:0;margin-top:5px}
.activity-dot.green{background:var(--green)}
.activity-dot.red{background:var(--red)}
.activity-text{font-size:13px;color:var(--ink);flex:1;line-height:1.4}
.activity-time{font-size:11px;color:var(--ink-40);flex-shrink:0;margin-top:1px}
/* ── KONTAKT BUTTONS ── */
.contact-btns{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.contact-btn{padding:8px 14px;border-radius:var(--radius);border:1.5px solid var(--ink-10);background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font);transition:all .15s;text-decoration:none}
.contact-btn:active{transform:scale(.96)}
.contact-btn.tel{border-color:var(--green);color:var(--green);background:var(--green-l)}
.contact-btn.mail{border-color:var(--copper);color:var(--copper-d);background:var(--copper-bg)}
/* ── BEARBEITEN INDIKATOR ── */
.edit-badge{background:var(--amber-l);color:var(--amber);font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px}
/* ── PROTOKOLL VERBESSERUNGEN ── */
.prot-summary-card{background:var(--ink-05);border-radius:var(--radius);padding:12px;margin-bottom:8px;border-left:3px solid var(--copper)}
.prot-summary-room{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:4px}
.prot-finding{font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
/* ── KOMMENTAR-BEREICH ── */
.comment-box{background:var(--ink-05);border-radius:var(--radius);padding:10px;margin-top:8px}
.comment-item{padding:7px 0;border-bottom:1px solid var(--ink-10)}
.comment-item:last-child{border:none}
.comment-meta{font-size:11px;color:var(--ink-40);margin-bottom:2px}
.comment-text{font-size:13px;color:var(--ink)}
/* ── STATUS BADGE ── */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.sb-offen{background:var(--amber-l);color:var(--amber)}
.sb-behoben{background:var(--green-l);color:var(--green)}
.sb-erledigt{background:var(--green-l);color:var(--green)}
/* ── EMPTY SEARCH ── */
.no-results{text-align:center;padding:28px;color:var(--ink-40)}
.no-results i{font-size:36px;display:block;margin-bottom:8px;color:var(--ink-10)}
/* ── MOBILE CALL/MAIL CTA ── */
.cta-tel{display:flex;align-items:center;gap:8px;padding:12px;background:var(--green-l);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;text-decoration:none}
.cta-mail{display:flex;align-items:center;gap:8px;padding:12px;background:var(--copper-bg);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;text-decoration:none}
.cta-tel span,.cta-mail span{font-size:14px;font-weight:500}
.cta-tel i{color:var(--green);font-size:20px}
.cta-mail i{color:var(--copper);font-size:20px}
/* ── PROTOKOLL PHOTO COUNTER ── */
.room-photo-count{position:absolute;bottom:3px;right:3px;background:rgba(13,31,45,.7);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:8px;font-family:var(--mono)}
.room-tab-wrap{position:relative;display:inline-block}


/* ── INSTALL BANNER ── */
#installBanner{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--ink);border-top:2px solid var(--copper);
  padding:12px 16px;z-index:300;align-items:center;gap:12px;
  box-shadow:0 -4px 20px rgba(0,0,0,.3)
}
#installBanner .ib-icon{width:40px;height:40px;background:var(--copper);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#installBanner .ib-text{flex:1;color:#fff}
#installBanner .ib-title{font-size:13px;font-weight:600}
#installBanner .ib-sub{font-size:11px;color:var(--ink-20);margin-top:1px}
#installBanner .ib-btn{padding:8px 16px;background:var(--copper);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);flex-shrink:0}
#installBanner .ib-close{width:28px;height:28px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:var(--ink-20);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

const DB_NAME='immo_v2', DB_VER=11;
const APP_VERSION = '2026-06-08-v19';
let idb=null;

function openIDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('IndexedDB nicht verfügbar'));return;}
    let settled=false;
    const timeout=setTimeout(()=>{
      if(!settled){settled=true;rej(new Error('IDB Timeout'));}
    },8000);
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      ['users','mieter','tg','protokolle','aufgaben','maengel','reparaturen','settings','dokumente','nka_archiv','einkaufsliste','termine','fotos','wartung','zaehler','zaehlerstaende','versorger','lager','lager_anforderung','taetigkeit_kat','arbeitszeit','abwesenheit'].forEach(s=>{
        if(!db.objectStoreNames.contains(s)){
          const store=db.createObjectStore(s,{keyPath:'id'});
          if(s==='mieter'){store.createIndex('objektId','objektId');store.createIndex('weNr','weNr')}
          if(s==='aufgaben'){store.createIndex('objektId','objektId');store.createIndex('status','status')}
          if(s==='maengel'){store.createIndex('objektId','objektId')}
          if(s==='reparaturen'){store.createIndex('objektId','objektId')}
          if(s==='protokolle'){store.createIndex('objektId','objektId')}
          if(s==='dokumente'){store.createIndex('objektId','objektId');store.createIndex('mieterId','mieterId')}
          if(s==='nka_archiv'){store.createIndex('objektId','objektId')}
          if(s==='einkaufsliste'){store.createIndex('objektId','objektId');store.createIndex('status','status')}
          if(s==='termine'){store.createIndex('datum','datum');store.createIndex('objektId','objektId')}
          if(s==='fotos'){store.createIndex('protId','protId')}
          if(s==='wartung'){store.createIndex('objektId','objektId')}
          if(s==='zaehler'){store.createIndex('objektId','objektId')}
          if(s==='zaehlerstaende'){store.createIndex('objektId','objektId');store.createIndex('zaehlerId','zaehlerId')}
          if(s==='versorger'){store.createIndex('objektId','objektId')}
          if(s==='lager'){store.createIndex('objektId','objektId');store.createIndex('kategorie','kategorie')}
          if(s==='lager_anforderung'){store.createIndex('status','status')}
          if(s==='arbeitszeit'){store.createIndex('userId','userId');store.createIndex('datum','datum')}
          if(s==='abwesenheit'){store.createIndex('userId','userId')}
        }
      });
    };
    req.onsuccess=e=>{
      if(settled)return;settled=true;clearTimeout(timeout);
      idb=e.target.result;res(idb);
    };
    req.onerror=e=>{
      if(settled)return;settled=true;clearTimeout(timeout);
      console.error('IDB Fehler:',e);rej(e.target.error||new Error('IDB Fehler'));
    };
    req.onblocked=e=>{
      console.warn('IDB blockiert',e);
    };
  });
}

function idbGet(store,id){
  return new Promise((res,rej)=>{
    const tx=idb.transaction(store,'readonly');
    const req=tx.objectStore(store).get(id);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function idbGetAll(store,indexName,value){
  return new Promise((res,rej)=>{
    const tx=idb.transaction(store,'readonly');
    const os=tx.objectStore(store);
    const req=indexName ? os.index(indexName).getAll(value) : os.getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>rej(req.error);
  });
}
function idbPut(store,obj){
  return new Promise((res,rej)=>{
    // updatedAt für Merge-Strategie automatisch setzen
    if (obj && typeof obj === 'object' && !obj.updatedAt) {
      obj.updatedAt = new Date().toISOString();
    }
    const tx=idb.transaction(store,'readwrite');
    const req=tx.objectStore(store).put(obj);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function idbDelete(store,id){
  return new Promise((res,rej)=>{
    const tx=idb.transaction(store,'readwrite');
    const req=tx.objectStore(store).delete(id);
    req.onsuccess=()=>res();
    req.onerror=()=>rej(req.error);
  });
}
function idbClear(store){
  return new Promise((res,rej)=>{
    const tx=idb.transaction(store,'readwrite');
    tx.objectStore(store).clear().onsuccess=()=>res();
  });
}

async function ensureDefaultUsers(){
  const all=await idbGetAll('users');
  if(!all.length){
    // Erster Start: alle anlegen
    for(const u of DEFAULT_USERS) await idbPut('users',u);
  } else {
    // Fehlende Default-User nachträglich ergänzen (z.B. nach Update)
    const existingIds = all.map(u=>u.id);
    for(const u of DEFAULT_USERS){
      if(!existingIds.includes(u.id)){
        await idbPut('users',u);
        console.log('Neuer Benutzer angelegt:', u.name);
      }
    }
  }
}

function pinPress(d){
  if(pinBuf.length>=6) return;
  pinBuf+=d;
  updatePinDisplay();
  if(pinBuf.length>=4) setTimeout(tryLogin,200);
}
function pinDel(){pinBuf=pinBuf.slice(0,-1);updatePinDisplay();}
function updatePinDisplay(){
  for(let i=0;i<4;i++){
    document.getElementById('pc'+i)?.classList.toggle('filled',i<pinBuf.length);
  }
}
async function tryLogin(){
  const uid=document.getElementById('loginUserSel').value;
  if(!uid){showLoginErr('Bitte Benutzer wählen');pinBuf='';updatePinDisplay();return;}
  const user=await idbGet('users',uid);
  if(!user||user.pin!==pinBuf){
    showLoginErr('Falscher PIN');pinBuf='';updatePinDisplay();return;
  }
  localStorage.setItem('lastLoginUser', uid);
  // Session-Marker: erlaubt Auto-Wiederanmeldung nach OS-Reload (z. B. nach Kamera-Nutzung)
  try { sessionStorage.setItem('activeSession', uid); } catch(e) {}
  try { localStorage.setItem('activeSession', JSON.stringify({uid, ts: Date.now()})); } catch(e) {}
  CU=user;pinBuf='';
  showScreen('appScreen');
  await initApp();
}
function showLoginErr(msg){
  const el=document.getElementById('loginErr');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
function doLogout(){
  CU=null;pinBuf='';
  try { sessionStorage.removeItem('activeSession'); } catch(e) {}
  try { localStorage.removeItem('activeSession'); } catch(e) {}
  showScreen('loginScreen');
  loadLoginUsers();
}

let navStack=[];let curPage='dash';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function nav(id,title,sub,push=true){
  if(id!=='protokoll'){ try { localStorage.removeItem('openProtokoll'); } catch(e){} }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id)?.classList.add('active');
  const TITLES={dash:'Dashboard',aufgaben:'Aufgaben & Mängel',settings:'Einstellungen',
                objekt:'Objekt',mieter:'Mieter',protokoll:'Übergabeprotokoll',
                'protokoll-archiv':'Protokoll-Archiv',
                'kalender':'Kalender','wartung':'Wartungsfristen','lager':'Lager & Material'};
  document.getElementById('hdrTitle').textContent=title||TITLES[id]||id;
  document.getElementById('hdrSub').textContent=sub||'';
  document.getElementById('hdrBack').classList.toggle('vis',push&&id!=='dash');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+id)?.classList.add('active');
  document.getElementById('fab').classList.toggle('visible',id==='aufgaben'||id==='kalender');
  if(push&&id!=='dash'){
    navStack.push({id,title,sub});
    // History-Eintrag für Android-Zurück-Button
    history.pushState({navId:id,title,sub}, '', window.location.pathname);
  } else if(id==='dash'){
    navStack=[];
    history.replaceState({navId:'dash'}, '', window.location.pathname);
  }
  curPage=id;
}

// Android Zurück-Button abfangen
window.addEventListener('popstate', function(e) {
  // Wenn Kamera offen → Kamera schließen
  if(document.getElementById('camOverlay')?.style.display==='flex'){
    closeCam(); history.pushState({}, '', window.location.pathname); return;
  }
  // Wenn Modal offen → Modal schließen
  if(document.getElementById('modalBg')?.classList.contains('open')){
    closeModal(); history.pushState({}, '', window.location.pathname); return;
  }
  // Wenn navStack gefüllt → eine Ebene zurück
  if(navStack.length > 0){
    history.pushState({}, '', window.location.pathname); // Verhindert App-Schließen
    goBack();
    return;
  }
  // Wenn auf Dashboard → Android darf minimieren (einmal erlaubt)
  // Nichts tun → normales Android-Verhalten (App in Hintergrund)
});
function goBack(){
  navStack.pop();
  const prev=navStack.length?navStack[navStack.length-1]:{id:'dash'};
  navStack.pop();
  if(prev.id==='dash') renderDash().then(()=>nav('dash','Dashboard','',false));
  else if(prev.id==='objekt') showObjekt(currentObjId);
  else nav(prev.id,prev.title,prev.sub,true);
}
function refreshCurrentPage(){if(curPage==='dash')renderDash();}

  const maengel   = await idbGetAll('maengel');

  const myMng     = maengel.filter(m => myObj.some(o=>o.id===m.objektId) && m.status!=='behoben');
  const el = document.getElementById('page-dash');

  const setting = await idbGet('settings','lastImport').catch(()=>null);
  const faelligeWartung = await getFaelligeWartung(30).catch(()=>[]);
  const lastSyncEntry = await idbGet('settings','lastSync').catch(()=>null);

  // 4er Stats
  let html = `<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat hl"><div class="stat-n">${myObj.length}</div><div class="stat-l">Objekte</div></div>

    <div class="stat"><div class="stat-n" style="color:${myMng.length?'var(--red)':'var(--green)'}">${myMng.length}</div><div class="stat-l">Mängel</div></div>
  </div>`;

  if (setting) {
    html += `<div style="font-size:11px;color:var(--ink-40);margin-bottom:10px;display:flex;align-items:center;gap:4px">
      <i class="ti ti-refresh" style="font-size:12px"></i> ${setting.value}
    </div>`;
  }

  // Quick-Actions
  html += `<div class="quick-actions">
    <button class="qa-btn copper" onclick="newProtokoll()"><i class="ti ti-clipboard-check"></i> Neues Protokoll</button>
    <button class="qa-btn" onclick="nav('aufgaben')"><i class="ti ti-checklist"></i> Aufgaben</button>
    <button class="qa-btn" onclick="modalAddAufgabe(null,null)"><i class="ti ti-plus"></i> ToDo</button>

    <button class="qa-btn" onclick="nav('wartung')"><i class="ti ti-calendar-stats"></i> Wartung</button>
    <button class="qa-btn" onclick="nav('lager')"><i class="ti ti-package"></i> Lager</button>
    <button class="qa-btn" onclick="nav('zeit')"><i class="ti ti-clock"></i> Zeiterfassung</button>
    <button class="qa-btn" onclick="nav('settings')"><i class="ti ti-upload"></i> Excel-Import</button>
  </div>`;

  // Fällige Wartungsfristen
  if (faelligeWartung.length) {
    const ueberfaellig = faelligeWartung.filter(w=>w.tage<0);
    const randColor = ueberfaellig.length ? 'var(--red)' : 'var(--amber)';
    const titelColor = ueberfaellig.length ? 'var(--red)' : 'var(--amber)';
    html += `<div class="card" style="border-color:${randColor};margin-bottom:12px">
      <div class="card-hdr" style="color:${titelColor}"><i class="ti ti-calendar-stats"></i> Wartungsfristen (${faelligeWartung.length})</div>
      ${faelligeWartung.slice(0,4).map(w=>{
        const c = w.tage<0?'var(--red)':'var(--amber)';
        const txt = w.tage<0?`${Math.abs(w.tage)} Tage überfällig`:`in ${w.tage} Tagen`;
        const obj = w.objektId?getObj(w.objektId):null;
        return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ink-10);cursor:pointer" onclick="nav('wartung')">
          <div style="width:6px;height:6px;border-radius:50%;background:${c};flex-shrink:0"></div>

          <div style="font-size:11px;color:${c};font-weight:600;white-space:nowrap">${txt}</div>
          <div style="font-size:11px;color:var(--ink-40);white-space:nowrap">${obj?esc(obj.name):'Alle'}</div>
        </div>`;
      }).join('')}
      ${faelligeWartung.length>4?`<div style="font-size:12px;color:var(--ink-40);padding-top:6px;cursor:pointer" onclick="nav('wartung')">+${faelligeWartung.length-4} weitere anzeigen</div>`:''}

  // Backup-Erinnerung – wenn kein Sync oder letzter Sync älter als 7 Tage
  {
    let warnBackup = false, syncInfo = '';
    if (!lastSyncEntry || !lastSyncEntry.value) {
      warnBackup = true; syncInfo = 'Noch keine Datensicherung über OneDrive erfolgt.';
    } else {
      const tage = Math.floor((Date.now() - new Date(lastSyncEntry.value).getTime())/86400000);

      <div class="card-hdr" style="color:var(--red)"><i class="ti ti-alert-triangle"></i> Dringend (${dringend.length})</div>

        <div style="width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0"></div>
        <div style="flex:1;font-size:13px;color:var(--ink)">${d.titel}</div>
        <div style="font-size:11px;color:var(--ink-40)">${getObj(d.objektId)?.name||''}</div>
      </div>`).join('')}
      ${dringend.length>3?`<div style="font-size:12px;color:var(--ink-40);padding-top:6px;cursor:pointer" onclick="nav('aufgaben')">+${dringend.length-3} weitere anzeigen</div>`:''}
    </div>`;
  }

  // Letzte Protokolle
  // Offene Entwürfe
  const drafts = prots.filter(p=>myObj.some(o=>o.id===p.objektId)&&p.status==='draft')
    .sort((a,b)=>new Date(b.erstellt)-new Date(a.erstellt));
  if (drafts.length) {
    html += `<div class="card" style="margin-bottom:12px;border-color:var(--amber)">
      <div class="card-hdr" style="color:var(--amber)"><i class="ti ti-clipboard"></i> Offene Entwürfe (${drafts.length})</div>
      ${drafts.map(p=>`<div class="activity-item" onclick="editProtokoll('${p.id}')" style="cursor:pointer">
        <div class="activity-dot" style="background:var(--amber)"></div>
        <div class="activity-text">${p.mieterName||'(kein Mieter)'} · WE ${p.weNr||'?'} · ${p.objektName||''} · Schritt ${(p._draftStep||0)+1}</div>
        <div class="activity-time">${fmtDate(p.datum)}</div>
      </div>`).join('')}
    </div>`;
  }

  const lastProts = prots
    .filter(p=>myObj.some(o=>o.id===p.objektId)&&p.status!=='draft')
    .sort((a,b)=>new Date(b.erstellt)-new Date(a.erstellt))
    .slice(0,3);
  if (lastProts.length) {
    html += `<div class="card" style="margin-bottom:12px">
      <div class="card-hdr"><i class="ti ti-clipboard-check"></i> Letzte Protokolle</div>
      ${lastProts.map(p=>`<div class="activity-item" onclick="editProtokoll('${p.id}')" style="cursor:pointer">
        <div class="activity-dot ${p.art?.includes('Einzug')?'green':''}"></div>
        <div class="activity-text">${p.mieterName||'–'} · WE ${p.weNr||'?'} · ${p.objektName||''}</div>
        <div class="activity-time">${fmtDate(p.datum)}</div>
      </div>`).join('')}
    </div>`;
  }

  // Objekte
  html += `<div class="s-hdr"><div class="s-title">Meine Objekte</div></div>`;
  const gruppen = {};
  myObj.forEach(o => { if(!gruppen[o.nr]) gruppen[o.nr]=[]; gruppen[o.nr].push(o); });
  for (const nr of Object.keys(gruppen).sort()) {
    for (const obj of gruppen[nr]) {
      const cnt    = myMieter.filter(m=>m.objektId===obj.id).length;
      const aufCnt = myAuf.filter(a=>a.objektId===obj.id).length;
      const mngCnt = myMng.filter(m=>m.objektId===obj.id).length;
      const hoch   = myAuf.filter(a=>a.objektId===obj.id&&a.prio==='hoch').length;
      html += `<div class="obj-card" onclick="showObjekt('${obj.id}')">
        <div class="obj-icon ${obj.color}"><i class="ti ti-building"></i></div>
        <div class="obj-body">
          <div class="obj-name">${obj.name}</div>
          <div class="obj-meta">${obj.ort}</div>
          <div class="obj-chips">
            <span class="chip chip-gray">${cnt} Mieter</span>
            ${hoch?`<span class="chip chip-err"><i class="ti ti-alert-triangle" style="font-size:10px"></i> ${hoch} dringend</span>`:''}
            ${aufCnt?`<span class="chip chip-warn">${aufCnt} Aufgabe${aufCnt!==1?'n':''}</span>`:''}
            ${mngCnt?`<span class="chip chip-err">${mngCnt} Mangel${mngCnt!==1?'':''}</span>`:''}
            ${!aufCnt&&!mngCnt?'<span class="chip chip-ok">Alles OK</span>':''}
          </div>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--ink-20);font-size:20px;flex-shrink:0"></i>
      </div>`;
    }
  }
  el.innerHTML = html;
}


async function getMyObjekte(){
  if(!CU) return [];
  // Objekte mit eingeschränkter Sichtbarkeit (sichtbarFuer) nur für gelistete Benutzer
  const sichtbar = o => !o.sichtbarFuer || o.sichtbarFuer.includes(CU.id);

  return OBJEKTE.filter(o=>CU.objekte.includes(o.gruppe) && sichtbar(o));

// Standard-Zählerbelegung je Objekt. Sonderfälle überschreiben den Standard.
const ZAEHLER_STANDARD = [
  {art:'gas',    name:'Gas gesamt',      einheit:'m³'},
  {art:'wasser', name:'Wasser gesamt',   einheit:'m³'},
  {art:'strom',  name:'Allgemeinstrom',  einheit:'kWh'},
];
const ZAEHLER_SONDERFALL = {
  wilm11: [
    {art:'strom',   name:'Allgemeinstrom', einheit:'kWh'},
    {art:'heizung', name:'Heizung',        einheit:'kWh'},
  ],
  inr185: [
    {art:'strom',     name:'Allgemeinstrom', einheit:'kWh'},
    {art:'heizung',   name:'Heizung',        einheit:'kWh'},
    {art:'tiefgarage',name:'Tiefgarage',     einheit:'kWh'},
  ],
};
const ZAEHLER_ICON = {gas:'ti-flame',wasser:'ti-droplet',strom:'ti-bolt',heizung:'ti-temperature',tiefgarage:'ti-parking'};

// Stellt sicher, dass für ein Objekt die (Standard- oder Sonder-)Zähler existieren.
async function ensureZaehler(objektId){
  const vorhandene = await idbGetAll('zaehler','objektId',objektId);
  if(vorhandene.length) return vorhandene;
  const def = ZAEHLER_SONDERFALL[objektId] || ZAEHLER_STANDARD;
  const erstellt = [];
  for(const d of def){
    const z = {id:'z_'+objektId+'_'+d.art+'_'+Math.random().toString(36).slice(2,6),
      objektId, art:d.art, name:d.name, einheit:d.einheit, erstellt:now()};
    await idbPut('zaehler', z);
    erstellt.push(z);
  }
  return erstellt;
}

async function renderObjZaehler(el){
  const zaehler = (await ensureZaehler(currentObjId)).sort((a,b)=>a.name.localeCompare(b.name));
  const alleStaende = await idbGetAll('zaehlerstaende','objektId',currentObjId);
  let h=`<div class="s-hdr"><div class="s-title"><i class="ti ti-gauge"></i> Zähler (${zaehler.length})</div>
    ${CU?.role==='admin'?`<button class="btn btn-sm" onclick="modalNeuerZaehler('${currentObjId}')"><i class="ti ti-plus"></i> Zähler</button>`:''}
  </div>`;

  for(const z of zaehler){
    const staende = alleStaende.filter(s=>s.zaehlerId===z.id)
      .sort((a,b)=>new Date(b.datumISO||0)-new Date(a.datumISO||0));
    const letzter = staende[0];
    const vorletzter = staende[1];
    // Verbrauch & Vergleich
    let verbrauchTxt = '';
    if(letzter && vorletzter){
      const diff = (parseFloat(letzter.wert)||0)-(parseFloat(vorletzter.wert)||0);
      const tage = Math.max(1,Math.round((new Date(letzter.datumISO)-new Date(vorletzter.datumISO))/86400000));
      verbrauchTxt = `<span style="color:var(--ink-60)">Verbrauch seit letzter Ablesung: <strong>${diff.toFixed(2)} ${z.einheit}</strong> (${tage} Tage)</span>`;
    }
    h+=`<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div style="width:38px;height:38px;border-radius:8px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--copper)">
          <i class="ti ${ZAEHLER_ICON[z.art]||'ti-gauge'}"></i>
        </div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${z.name}</div>
          <div style="font-size:12px;color:var(--ink-40)">
            ${letzter?`Letzter Stand: <strong>${letzter.wert} ${z.einheit}</strong> · ${letzter.datum}`:'Noch keine Ablesung'}
          </div>
        </div>
        <button class="btn btn-sm btn-copper" onclick="modalZaehlerstand('${z.id}')"><i class="ti ti-camera"></i> Ablesen</button>
      </div>
      ${verbrauchTxt?`<div style="font-size:12px;margin-bottom:6px">${verbrauchTxt}</div>`:''}
      ${staende.length?`<button class="btn btn-sm" style="width:100%" onclick="zeigeZaehlerVerlauf('${z.id}')"><i class="ti ti-chart-line"></i> Verlauf & Verbrauch (${staende.length})</button>`:''}
    </div>`;
  }
  el.innerHTML=h;
}

async function saveZaehlerstand(zaehlerId){
  const z = await idbGet('zaehler', zaehlerId);
  if(!z) return;
  const wert = document.getElementById('zsWert')?.value;
  if(wert===''||wert==null){ toast('Bitte Zählerstand eingeben'); return; }
  const datumISO = document.getElementById('zsDatum')?.value || today();
  const nummer = document.getElementById('zsNummer')?.value?.trim()||'';
  // Plausibilität: neuer Wert sollte nicht kleiner als letzter sein (Hinweis, kein Block)
  const bisher = (await idbGetAll('zaehlerstaende','zaehlerId',zaehlerId))
    .sort((a,b)=>new Date(b.datumISO||0)-new Date(a.datumISO||0));
  const letzter = bisher[0];
  if(letzter && parseFloat(wert) < parseFloat(letzter.wert)){
    if(!confirm(`Der neue Wert (${wert}) ist kleiner als der letzte Stand (${letzter.wert}). Trotzdem speichern?`)) return;
  }
  const eintrag = {
    id: uid(),
    zaehlerId, objektId: z.objektId,
    wert: parseFloat(wert),
    einheit: z.einheit,
    datum: new Date(datumISO).toLocaleDateString('de-DE'),
    datumISO,
    nummer,
    foto: window._zsFoto || '',
    bemerkung: document.getElementById('zsBemerkung')?.value?.trim()||'',
    erfasst: now(), erfasstVon: CU?.name||'',
  };
  await idbPut('zaehlerstaende', eintrag);
  // Zählernummer am Stammdatensatz merken
  if(nummer && nummer!==z.zaehlernummer){ z.zaehlernummer=nummer; await idbPut('zaehler', z); }
  window._zsFoto = null;
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await renderObjZaehler(document.getElementById('objTabContent'));
  toast('Ablesung gespeichert ✓');
}

// Verlauf mit Verbrauchsdifferenzen (Monat/Jahr-Vergleich)
async function zeigeZaehlerVerlauf(zaehlerId){
  const z = await idbGet('zaehler', zaehlerId);
  const staende = (await idbGetAll('zaehlerstaende','zaehlerId',zaehlerId))
    .sort((a,b)=>new Date(b.datumISO||0)-new Date(a.datumISO||0));
  let rows='';
  for(let i=0;i<staende.length;i++){
    const s=staende[i];
    const naechstAelter=staende[i+1];
    let diff='–', proTag='–';
    if(naechstAelter){
      const d=(parseFloat(s.wert)||0)-(parseFloat(naechstAelter.wert)||0);
      const tage=Math.max(1,Math.round((new Date(s.datumISO)-new Date(naechstAelter.datumISO))/86400000));
      diff=`${d.toFixed(2)} ${z.einheit}`;
      proTag=`${(d/tage).toFixed(2)} ${z.einheit}/Tag`;
    }
    rows+=`<tr style="border-bottom:1px solid var(--ink-10)">
      <td style="padding:6px 4px;font-size:12px">${s.datum}</td>
      <td style="padding:6px 4px;font-size:12px;font-weight:600">${s.wert} ${z.einheit}</td>
      <td style="padding:6px 4px;font-size:12px">${diff}</td>
      <td style="padding:6px 4px;font-size:11px;color:var(--ink-40)">${proTag}</td>
      <td style="padding:6px 4px;text-align:right">${s.foto?`<button class="btn btn-sm" onclick="openFoto('${s.id}','zaehlerstand')"><i class="ti ti-photo"></i></button>`:''}
        ${CU?.role==='admin'?`<button class="btn btn-sm btn-danger" onclick="delZaehlerstand('${s.id}','${zaehlerId}')"><i class="ti ti-trash"></i></button>`:''}</td>
    </tr>`;
  }
  // Jahresvergleich: Verbrauch pro Kalenderjahr
  const perJahr={};
  for(let i=0;i<staende.length-1;i++){
    const neu=staende[i], alt=staende[i+1];
    const jahr=new Date(neu.datumISO).getFullYear();
    const d=(parseFloat(neu.wert)||0)-(parseFloat(alt.wert)||0);
    if(d>=0) perJahr[jahr]=(perJahr[jahr]||0)+d;
  }
  const jahrRows=Object.keys(perJahr).sort((a,b)=>b-a).map(j=>
    `<tr><td style="padding:4px 6px;font-size:12px">${j}</td><td style="padding:4px 6px;font-size:12px;font-weight:600">${perJahr[j].toFixed(2)} ${z.einheit}</td></tr>`).join('');

  showModal(`
    <div class="m-title"><i class="ti ti-chart-line"></i> Verlauf – ${z.name}</div>
    ${jahrRows?`<div class="card-hdr" style="margin-bottom:6px">Verbrauch je Kalenderjahr</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px">
      <thead><tr style="background:var(--ink-05)"><th style="padding:4px 6px;text-align:left;font-size:11px">Jahr</th><th style="padding:4px 6px;text-align:left;font-size:11px">Verbrauch</th></tr></thead>
      <tbody>${jahrRows}</tbody></table>`:''}
    <div class="card-hdr" style="margin-bottom:6px">Alle Ablesungen (${staende.length})</div>
    <div style="max-height:50vh;overflow-y:auto">
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--ink-05)">
        <th style="padding:6px 4px;text-align:left;font-size:11px">Datum</th>
        <th style="padding:6px 4px;text-align:left;font-size:11px">Stand</th>
        <th style="padding:6px 4px;text-align:left;font-size:11px">Verbrauch</th>
        <th style="padding:6px 4px;text-align:left;font-size:11px">Ø</th>
        <th style="padding:6px 4px"></th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="5" style="padding:10px;text-align:center;color:var(--ink-40)">Keine Daten</td></tr>'}</tbody>
    </table></div>
    <button class="btn btn-full" style="margin-top:12px" onclick="closeModal()">Schließen</button>`);
}

/* ═══════════════════════════════════════════════════════════
   VERSORGER / VERTRÄGE (nur Admin)
   Stammdaten je Objekt inkl. Vertrag, Preise, Zugangsdaten.
   Automatische Kalender-Erinnerung 1 Monat vor Kündigungsfrist.
═══════════════════════════════════════════════════════════ */
const VERSORGER_SPARTE = [
  {val:'strom',  label:'Strom',   icon:'ti-bolt'},
  {val:'gas',    label:'Gas',     icon:'ti-flame'},
  {val:'wasser', label:'Wasser',  icon:'ti-droplet'},
  {val:'heizung',label:'Heizung/Fernwärme', icon:'ti-temperature'},
  {val:'muell',  label:'Abfall / Entsorgung', icon:'ti-trash'},
  {val:'internet',label:'Internet / TK', icon:'ti-wifi'},
  {val:'sonstige',label:'Sonstige', icon:'ti-file-dollar'},
];
/* ═══════════════════════════════════════════════════════════
   VERSCHLÜSSELUNG (WebCrypto / AES-GCM, Schlüssel aus Master-Passwort)
   Für sensible Zugangsdaten (Versorger-Passwörter). Master-Passwort wird
   nie gespeichert; der abgeleitete Schlüssel lebt nur in der Sitzung.
═══════════════════════════════════════════════════════════ */
let _cryptoKey = null;            // abgeleiteter AES-Schlüssel (nur im RAM, pro Sitzung)
const _txtEnc = new TextEncoder();
const _txtDec = new TextDecoder();
function _b64(buf){ let s=''; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function _unb64(s){ const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

async function _deriveKey(masterPw, saltB64){
  const salt=_unb64(saltB64);
  const base=await crypto.subtle.importKey('raw', _txtEnc.encode(masterPw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function _encryptVal(plain){
  if(!_cryptoKey || !plain) return null;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, _cryptoKey, _txtEnc.encode(plain));
  return {iv:_b64(iv), ct:_b64(ct)};
}
async function _decryptVal(obj){
  if(!_cryptoKey || !obj || !obj.ct) return '';
  try{
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:_unb64(obj.iv)}, _cryptoKey, _unb64(obj.ct));
    return _txtDec.decode(pt);
  }catch(e){ return ''; }
}

// Ist die Verschlüsselung bereits eingerichtet (Master-PW gesetzt)?
async function cryptoIstEingerichtet(){
  const s=await idbGet('settings','cryptoConfig').catch(()=>null);
  return !!(s && s.salt && s.check);
}
// Schlüssel für die Sitzung entsperrt?
function cryptoIstEntsperrt(){ return !!_cryptoKey; }

// Master-Passwort erstmalig einrichten
async function cryptoEinrichten(masterPw){
  const salt=_b64(crypto.getRandomValues(new Uint8Array(16)));
  _cryptoKey=await _deriveKey(masterPw, salt);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, _cryptoKey, _txtEnc.encode('CHECK_OK'));
  await idbPut('settings',{id:'cryptoConfig', salt, check:{iv:_b64(iv), ct:_b64(ct)}, erstellt:now()});
}
// Sitzung mit Master-Passwort entsperren; true bei Erfolg
async function cryptoEntsperren(masterPw){
  const cfg=await idbGet('settings','cryptoConfig').catch(()=>null);
  if(!cfg) return false;
  try{
    const key=await _deriveKey(masterPw, cfg.salt);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:_unb64(cfg.check.iv)}, key, _unb64(cfg.check.ct));
    if(_txtDec.decode(pt)==='CHECK_OK'){ _cryptoKey=key; return true; }
  }catch(e){}
  return false;
}
function cryptoSperren(){ _cryptoKey=null; }

async function trySetupCrypto(onDoneName, ...args){
  const pw=document.getElementById('cryptoPw')?.value||'';
  const pw2=document.getElementById('cryptoPw2')?.value||'';
  const err=document.getElementById('cryptoErr');
  if(pw.length<8){ err.textContent='Master-Passwort muss mindestens 8 Zeichen haben.'; return; }
  if(pw!==pw2){ err.textContent='Die Passwörter stimmen nicht überein.'; return; }
  await cryptoEinrichten(pw);
  closeModal();
  toast('Verschlüsselung eingerichtet ✓');
  if(onDoneName && window[onDoneName]) window[onDoneName](...args);
}
async function tryCryptoUnlock(onDoneName, ...args){
  const pw=document.getElementById('cryptoPw')?.value||'';
  const err=document.getElementById('cryptoErr');
  const ok=await cryptoEntsperren(pw);
  if(!ok){ if(err) err.textContent='Falsches Master-Passwort.'; return; }
  closeModal();
  if(onDoneName && window[onDoneName]) window[onDoneName](...args);
}

function getSparte(v){ return VERSORGER_SPARTE.find(s=>s.val===v)||VERSORGER_SPARTE[VERSORGER_SPARTE.length-1]; }

// Zieht Monate von einem Datum ab, ohne Monatsüberlauf (31.12. − 3 Mon. = 30.09., nicht 01.10.).
// Wichtig für rechtssichere Kündigungsfristen: rundet bei kürzeren Monaten auf das Monatsende ab.
function monateAbziehen(datum, monate){
  const d=new Date(datum);
  const zielTag=d.getDate();
  d.setDate(1);                       // erst auf Monatsersten, um Überlauf zu vermeiden
  d.setMonth(d.getMonth()-monate);
  // letzter Tag des Zielmonats
  const letzterTag=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(zielTag, letzterTag));
  return d;
}

        ${v.arbeitspreis?`<span>Arbeitspreis: <strong>${v.arbeitspreis} ct/${v.einheit||'Einheit'}</strong></span>`:''}

async function saveVersorger(objektId, versorgerId){
  const anbieter=document.getElementById('vAnbieter')?.value?.trim();
  if(!anbieter){ toast('Bitte Anbieter eingeben'); return; }
  const pwKlartext = document.getElementById('vPasswort')?.value||'';
  // Formularwerte einsammeln
  const formData={
    objektId, versorgerId,
    sparte: document.getElementById('vSparte')?.value||'sonstige',
    anbieter,
    vertragsnummer: document.getElementById('vVertragsnr')?.value?.trim()||'',
    vertragsbeginn: document.getElementById('vBeginn')?.value||'',
    vertragsende:   document.getElementById('vEnde')?.value||'',
    kuendigungsfristMonate: parseInt(document.getElementById('vKuendFrist')?.value)||'',
    einheit: document.getElementById('vEinheit')?.value?.trim()||'',
    grundpreis: parseFloat(document.getElementById('vGrundpreis')?.value)||'',
    arbeitspreis: parseFloat(document.getElementById('vArbeitspreis')?.value)||'',
    website: document.getElementById('vWebsite')?.value?.trim()||'',
    login: document.getElementById('vLogin')?.value?.trim()||'',
    notiz: document.getElementById('vNotiz')?.value?.trim()||'',
    pwKlartext,
  };
  // Passwort eingegeben, aber Verschlüsselung nicht bereit? Erst einrichten/entsperren.
  if(pwKlartext && !cryptoIstEntsperrt()){
    window._pendingVersorger = formData;
    await modalCryptoUnlock('saveVersorgerFortsetzen');
    return;
  }
  await saveVersorgerFortsetzen(formData);
}

async function saveVersorgerFortsetzen(formData){
  const fd = formData || window._pendingVersorger;
  window._pendingVersorger = null;
  if(!fd) return;
  const alt = fd.versorgerId ? await idbGet('versorger', fd.versorgerId) : null;
  let passwortEnc = alt?.passwortEnc || null;
  if(fd.pwKlartext){
    if(cryptoIstEntsperrt()){
      passwortEnc = await _encryptVal(fd.pwKlartext);
    } else {
      toast('Passwort konnte nicht verschlüsselt werden');
    }
  }
  const v = {
    id: fd.versorgerId || ('vs_'+fd.objektId+'_'+Math.random().toString(36).slice(2,7)),
    objektId: fd.objektId,
    sparte: fd.sparte, anbieter: fd.anbieter,
    vertragsnummer: fd.vertragsnummer, vertragsbeginn: fd.vertragsbeginn,
    vertragsende: fd.vertragsende, kuendigungsfristMonate: fd.kuendigungsfristMonate,
    einheit: fd.einheit, grundpreis: fd.grundpreis, arbeitspreis: fd.arbeitspreis,
    website: fd.website, login: fd.login, passwortEnc, notiz: fd.notiz,
    erstellt: alt?.erstellt||now(), terminId: alt?.terminId||null,
  };
  await idbPut('versorger', v);
  await syncVersorgerErinnerung(v);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  const tabEl=document.getElementById('objTabContent');
  if(tabEl) await renderObjVersorger(tabEl);
  toast('Versorger gespeichert ✓');
}

// Erstellt/aktualisiert die Kalender-Erinnerung 1 Monat vor Kündigungsstichtag.
async function syncVersorgerErinnerung(v){
  // Bestehende Erinnerung entfernen, falls vorhanden
  if(v.terminId){ await idbDelete('termine', v.terminId).catch(()=>{}); v.terminId=null; }
  if(!v.vertragsende){ await idbPut('versorger', v); return; }
  const ende=new Date(v.vertragsende);
  const kuendMonate=parseInt(v.kuendigungsfristMonate)||0;
  // Kündigungsstichtag = Vertragsende minus Kündigungsfrist (ohne Monatsüberlauf)
  const stichtag=monateAbziehen(ende, kuendMonate);
  // Erinnerung = 1 Monat vor Stichtag
  const erinnerung=monateAbziehen(stichtag, 1);
  const obj=getObj(v.objektId);
  const sp=getSparte(v.sparte);
  const terminId=uid();
  await idbPut('termine', {
    id: terminId,
    titel: `Kündigungsfrist ${sp.label} – ${v.anbieter}`,
    typ: 'vertrag',
    datum: erinnerung.toISOString().split('T')[0],
    uhrzeit:'', uhrzeitEnd:'', erinnerung:'',
    objektId: v.objektId,
    mieterId:null, mieterName:'',
    notiz: `Vertrag ${v.anbieter} (${sp.label}) läuft am ${ende.toLocaleDateString('de-DE')} aus. `+
           `Kündigung spätestens bis ${stichtag.toLocaleDateString('de-DE')}`+
           `${v.kuendigungsfristMonate?` (Frist ${v.kuendigungsfristMonate} Monate)`:''}. `+
           `${v.vertragsnummer?'Vertragsnr.: '+v.vertragsnummer:''}`,
    zugewiesen:'', status:'offen',
    erstellt: now(), ersteller: CU?.name||'', autoVersorger:true,
  });
  v.terminId=terminId;
  await idbPut('versorger', v);
}

async function deleteVersorger(versorgerId, objektId){
  if(!confirm('Versorger wirklich löschen? Die zugehörige Kalender-Erinnerung wird ebenfalls entfernt.')) return;
  const v=await idbGet('versorger', versorgerId);
  if(v?.terminId) await idbDelete('termine', v.terminId).catch(()=>{});
  await idbDelete('versorger', versorgerId);
  closeModal();
  clearTimeout(window._syncTimer);
  window._syncTimer = setTimeout(()=>syncToOneDrive(), 3000);
  await renderObjVersorger(document.getElementById('objTabContent'));
  toast('Versorger gelöscht');
}

// Trennt echte Artikel von Lagerort-Definitionen (beide liegen im 'lager'-Store)
async function getLagerArtikel(idxField, idxVal){
  const alle = idxField ? await idbGetAll('lager', idxField, idxVal) : await idbGetAll('lager');
  return alle.filter(x=>x._typ!=='lagerort');
}
async function getLagerorte(standort){
  const alle = await idbGetAll('lager');
  let orte = alle.filter(x=>x._typ==='lagerort');
  if(standort && standort!=='alle') orte=orte.filter(o=>o.standort===standort);
  return orte.sort((a,b)=>(a.bezeichnung||'').localeCompare(b.bezeichnung||''));
}

/* ── Lagerorte (Regale/Kisten) + QR-Etiketten ──────────────
   Lagerorte werden zentral je Standort angelegt. Jeder Ort hat eine QR-ID;
   das QR-Etikett trägt den QR-Code plus Klartext-Name. Beim Scannen eines
   Ort-QR übernimmt die App den Lagerort in den Artikel.
*/
let _lagerorteStandort='alle';

async function zeigeLagerorte(){
  const el=document.getElementById('page-lager');
  if(!el) return;
  const meineObjekte=await getMyObjekte();
  const meineGruppen=new Set(meineObjekte.map(o=>o.gruppe));
  const standorte=LAGER_STANDORTE.filter(s=>s.alleSichtbar||meineGruppen.has(s.id));
  const orte=await getLagerorte(_lagerorteStandort==='alle'?null:_lagerorteStandort);

  let h=`<div class="s-hdr">
    <button class="btn btn-sm" onclick="renderLager()"><i class="ti ti-arrow-left"></i></button>
    <div class="s-title"><i class="ti ti-map-2"></i> Lagerorte</div>
    <button class="btn btn-sm btn-copper" onclick="modalLagerort()"><i class="ti ti-plus"></i> Ort</button>
  </div>
  <div style="font-size:12px;color:var(--ink-40);margin-bottom:10px">
    Regale, Fächer und Kisten anlegen und QR-Etiketten drucken. Beim Einlagern den Ort-QR scannen – der Lagerort wird automatisch übernommen.
  </div>
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px">
    <button class="chip ${_lagerorteStandort==='alle'?'chip-copper':''}" onclick="_lagerorteStandort='alle';zeigeLagerorte()">Alle</button>
    ${standorte.map(s=>`<button class="chip ${_lagerorteStandort===s.id?'chip-copper':''}" onclick="_lagerorteStandort='${s.id}';zeigeLagerorte()">${s.label}</button>`).join('')}
  </div>`;

  if(!orte.length){
    h+=`<div class="empty"><i class="ti ti-map-off"></i><p>Noch keine Lagerorte angelegt.</p></div>
      <button class="btn btn-copper btn-full" style="margin-top:10px" onclick="modalLagerort()"><i class="ti ti-plus"></i> Ersten Lagerort anlegen</button>`;
    el.innerHTML=h; return;
  }
  // Nach Standort gruppieren
  const proStandort={};
  for(const o of orte){ (proStandort[o.standort]=proStandort[o.standort]||[]).push(o); }
  for(const stId of Object.keys(proStandort).sort()){
    h+=`<div class="card-hdr" style="margin:12px 0 6px"><i class="ti ti-map-pin" style="font-size:13px"></i> ${getLagerStandort(stId).label}</div>`;
    for(const o of proStandort[stId]){
      h+=`<div class="card" style="margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:8px;background:var(--ink-05);display:flex;align-items:center;justify-content:center;color:var(--copper);flex-shrink:0"><i class="ti ti-box"></i></div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${o.bezeichnung}${o.nummer?` <span style="font-weight:400;color:var(--ink-40);font-size:11px">· ${o.nummer}</span>`:''}</div>
            ${o.pfad?`<div style="font-size:11px;color:var(--ink-40)">${o.pfad}</div>`:''}
          </div>
          <div style="display:flex;gap:4px;flex-shrink:0">
            <button class="btn btn-sm" onclick="druckeLagerortEtikett('${o.id}')" title="QR-Etikett drucken"><i class="ti ti-qrcode"></i></button>
            <button class="btn btn-sm" onclick="modalLagerort('${o.id}')"><i class="ti ti-pencil"></i></button>
            <button class="btn btn-sm btn-danger" onclick="deleteLagerort('${o.id}')"><i class="ti ti-trash"></i></button>
          </div>
        </div>
      </div>`;
    }
  }
  el.innerHTML=h;
}

async function modalLagerort(ortId){
  const o = ortId ? (await idbGet('lager', ortId))||{} : {};
  const isEdit=!!ortId;
  const meineObjekte=await getMyObjekte();
  const meineGruppen=new Set(meineObjekte.map(x=>x.gruppe));
  const standorte=LAGER_STANDORTE.filter(s=>s.alleSichtbar||meineGruppen.has(s.id));
  showModal(`
    <div class="m-title"><i class="ti ti-box"></i> ${isEdit?'Lagerort bearbeiten':'Neuer Lagerort'}</div>
    <div class="f"><label>Standort *</label>
      <select id="loStandort">${standorte.map(s=>`<option value="${s.id}" ${o.standort===s.id?'selected':''}>${s.label}</option>`).join('')}</select></div>
    <div class="f"><label>Bezeichnung * (kurz, fürs Etikett)</label>
      <input type="text" id="loBez" value="${(o.bezeichnung||'').replace(/"/g,'&quot;')}" placeholder="z. B. Regal 3 / Kiste 5 / Werkzeugkoffer"></div>
    <div class="f"><label>Beschreibung / Pfad (optional)</label>
      <input type="text" id="loPfad" value="${(o.pfad||'').replace(/"/g,'&quot;')}" placeholder="z. B. Linkes Lager › Regal 3 › Fach 4"></div>
    <div class="f-row" style="margin-top:12px">
      <button class="btn btn-copper btn-full" onclick="saveLagerort('${ortId||''}')"><i class="ti ti-check"></i> Speichern</button>
      <button class="btn btn-full" onclick="zeigeLagerorte()">Abbrechen</button>
    </div>
    ${isEdit?`<button class="btn btn-full" style="margin-top:8px" onclick="druckeLagerortEtikett('${ortId}')"><i class="ti ti-qrcode"></i> QR-Etikett drucken</button>`:''}`);
}

async function saveLagerort(ortId){
  const bez=document.getElementById('loBez')?.value?.trim();
  if(!bez){ toast('Bitte Bezeichnung eingeben'); return; }
  const standort=document.getElementById('loStandort')?.value;
  const alt = ortId ? await idbGet('lager', ortId) : null;
  const o={
    id: ortId || ('lo_'+standort+'_'+Math.random().toString(36).slice(2,8)),
    _typ:'lagerort',
    standort,
    bezeichnung: bez,
    pfad: document.getElementById('loPfad')?.value?.trim()||'',
    nummer: alt?.nummer || await naechsteLagerortNr(standort),
    qrId: alt?.qrId || ('ORT-'+Math.random().toString(36).slice(2,8).toUpperCase()),
    erstellt: alt?.erstellt||now(),
  };
  await idbPut('lager', o);
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  await zeigeLagerorte();
  toast('Lagerort gespeichert ✓');
}

async function deleteLagerort(ortId){
  const o=await idbGet('lager', ortId);
  if(!o) return;
  if(!confirm(`Lagerort „${o.bezeichnung}" löschen? Artikel bleiben erhalten, verlieren aber diese Ortszuordnung.`)) return;
  // Ortszuordnung aus Artikeln entfernen
  const artikel=await getLagerArtikel();
  for(const a of artikel){
    if(a.lagerorte?.includes(ortId)){ a.lagerorte=a.lagerorte.filter(x=>x!==ortId); await idbPut('lager', a); }
  }
  await idbDelete('lager', ortId);
  clearTimeout(window._syncTimer); window._syncTimer=setTimeout(()=>syncToOneDrive(),3000);
  await zeigeLagerorte();
  toast('Lagerort gelöscht');
}

/* ── Eigenständiger QR-Encoder (Byte-Modus, EC-Level L, V1–10) ──

  var EC_L={1:[7,1,19,0,0],2:[10,1,34,0,0],3:[15,1,55,0,0],4:[20,1,80,0,0],5:[26,1,108,0,0],6:[18,2,68,0,0],7:[20,2,78,0,0],8:[24,2,97,0,0],9:[30,2,116,0,0],10:[18,2,68,2,69]};

  function buildMat(version,db){var size=version*4+17,m=[],res=[];for(var r=0;r<size;r++){m[r]=new Array(size).fill(null);res[r]=new Array(size).fill(false);}function fdr(R,C){for(var dr=-1;dr<=7;dr++)for(var dc=-1;dc<=7;dc++){var rr=R+dr,cc=C+dc;if(rr<0||rr>=size||cc<0||cc>=size)continue;var on=(dr>=0&&dr<=6&&(dc===0||dc===6))||(dc>=0&&dc<=6&&(dr===0||dr===6))||(dr>=2&&dr<=4&&dc>=2&&dc<=4);m[rr][cc]=on?1:0;res[rr][cc]=true;}}fdr(0,0);fdr(0,size-7);fdr(size-7,0);for(var i=8;i<size-8;i++){var bt=(i%2===0)?1:0;if(!res[6][i]){m[6][i]=bt;res[6][i]=true;}if(!res[i][6]){m[i][6]=bt;res[i][6]=true;}}var ap=ALIGN[version]||[];for(var a1=0;a1<ap.length;a1++)for(var a2=0;a2<ap.length;a2++){var ar=ap[a1],ac=ap[a2];if(res[ar][ac])continue;for(var dr2=-2;dr2<=2;dr2++)for(var dc2=-2;dc2<=2;dc2++){var on2=(Math.abs(dr2)===2||Math.abs(dc2)===2||(dr2===0&&dc2===0));m[ar+dr2][ac+dc2]=on2?1:0;res[ar+dr2][ac+dc2]=true;}}m[size-8][8]=1;res[size-8][8]=true;for(var i2=0;i2<=8;i2++){res[8][i2]=true;res[i2][8]=true;}for(var i3=0;i3<8;i3++){res[8][size-1-i3]=true;res[size-1-i3][8]=true;}var idx=0,up=true;for(var col=size-1;col>0;col-=2){if(col===6)col--;for(var rc=0;rc<size;rc++){var row=up?(size-1-rc):rc;for(var s=0;s<2;s++){var c2=col-s;if(res[row][c2])continue;m[row][c2]=idx<db.length?db[idx]:0;idx++;}}up=!up;}return{m:m,res:res,size:size};}
  function maskFn(mk,r,c){switch(mk){case 0:return(r+c)%2===0;case 1:return r%2===0;case 2:return c%3===0;case 3:return(r+c)%3===0;case 4:return(Math.floor(r/2)+Math.floor(c/3))%2===0;case 5:return((r*c)%2)+((r*c)%3)===0;case 6:return(((r*c)%2)+((r*c)%3))%2===0;case 7:return(((r+c)%2)+((r*c)%3))%2===0;}return false;}
  function placeFmt(m,size,mask){var fmt=(1<<3)|mask,d=fmt<<10,g=0x537;for(var i=14;i>=10;i--){if((d>>>i)&1)d^=(g<<(i-10));}var bits=((fmt<<10)|(d&0x3ff))^0x5412;function fb(i){return(bits>>>i)&1;}m[8][0]=fb(14);m[8][1]=fb(13);m[8][2]=fb(12);m[8][3]=fb(11);m[8][4]=fb(10);m[8][5]=fb(9);m[8][7]=fb(8);m[8][8]=fb(7);m[7][8]=fb(6);m[5][8]=fb(5);m[4][8]=fb(4);m[3][8]=fb(3);m[2][8]=fb(2);m[1][8]=fb(1);m[0][8]=fb(0);m[size-1][8]=fb(14);m[size-2][8]=fb(13);m[size-3][8]=fb(12);m[size-4][8]=fb(11);m[size-5][8]=fb(10);m[size-6][8]=fb(9);m[size-7][8]=fb(8);m[8][size-8]=fb(7);m[8][size-7]=fb(6);m[8][size-6]=fb(5);m[8][size-5]=fb(4);m[8][size-4]=fb(3);m[8][size-3]=fb(2);m[8][size-2]=fb(1);m[8][size-1]=fb(0);}
